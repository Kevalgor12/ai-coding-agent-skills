id: SK-DATA-005
slug: search-integration
name: Search integration
spec_version: "1.0"
skill_version: "0.1.0"
kind: generic
layer: 3
domain: DATA

purpose: >-
  Add full-text and/or vector/semantic search to an application — choosing
  the search approach (database-native full-text search vs. a dedicated
  search engine vs. vector search), index/analyzer/mapping design, relevance
  tuning, and keeping the search index in sync with the source of truth —
  independent of which engine is eventually used.
scope: >-
  Search-capability design: engine selection, indexing/mapping, relevance
  tuning, index-sync strategy, and search-specific performance tuning.
  Specialized by the OpenSearch technology skill (and, where the engine
  choice lands on the database itself, by the already-authored PostgreSQL
  and Redis technology skills). Not a simple indexed `WHERE`-clause lookup
  (database-operations, not yet authored) and not vector-search's
  RAG/LLM-application layer (llm-application-engineering, a documented
  research gap — not fabricated here).
expertise: Senior/principal backend engineer with search-systems experience.
description: >-
  Add full-text and/or vector/semantic search — choose an engine
  (database-native FTS vs. dedicated search engine vs. vector search),
  design indexing/mapping, tune relevance, and keep the index in sync with
  the source of truth. Use when a feature needs search beyond a simple
  indexed lookup. Not for plain `WHERE`-clause queries, and not for the
  RAG/LLM-application layer on top of vector search, which this library
  has not researched.

activation_conditions:
  - A feature needs full-text search, faceted/filtered search, or semantic/vector search
  - The search-engine choice is open (database-native FTS vs. dedicated engine vs. vector search)
  - An existing search index's relevance, mapping, or sync-with-source-of-truth strategy needs review
non_activation_conditions:
  - A simple indexed `WHERE`/lookup query suffices (route to database-operations, not yet authored)
  - The request is really about the RAG/LLM-application layer built on top of vector search (llm-application-engineering) — a documented research gap in this library, not answered here
activation_mode: auto

inputs:
  - name: search-requirements
    description: What the search needs to support — full-text, faceted, semantic/vector — and expected data/query scale.
    required: true
  - name: existing-search-layer
    description: An existing search index/engine's design, if this is not greenfield.
    required: false
required_context:
  - Whether the need is full-text, faceted/filtered, and/or semantic/vector search
  - Expected index size and query volume/latency requirements
optional_context:
  - Whether a database already in use (PostgreSQL, Redis) could serve the need natively, avoiding a new dedicated engine
  - Relevance-quality requirements and how they'll be evaluated

outputs:
  - name: engine-choice
    kind: analysis
    description: The recommended search approach/engine with trade-offs, when open.
  - name: index-design-and-sync-strategy
    kind: analysis
    description: Index/analyzer/mapping design, relevance-tuning approach, and the strategy for keeping the index in sync with the source of truth.

depends_on_skills: []
related_skills: [SK-DATA-001, SK-TECH-postgresql, SK-TECH-redis, SK-AI-001, SK-AI-005]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B

grounding: mixed
source_references:
  - url: research/knowledge-maps/technology-decision-matrix.md
    title: "Technology Decision Matrix — Search engine: OpenSearch (only search engine profiled; Elasticsearch unresolved)"
    via: research/knowledge-maps/technology-decision-matrix.md
    retrieved: "2026-09-10"
  - url: research/knowledge-maps/performance-knowledge-map.md
    title: "Performance Knowledge Map — OpenSearch shard sizing, JVM heap, and cluster-tuning sections"
    via: research/knowledge-maps/performance-knowledge-map.md
    retrieved: "2026-09-10"
  - url: research/knowledge-maps/concept-knowledge-map.md
    title: "Concept Knowledge Map — Full-Text Search / Vector-Semantic Search sections (PostgreSQL, Redis, OpenSearch scope comparison)"
    via: research/knowledge-maps/concept-knowledge-map.md
    retrieved: "2026-09-10"
last_verified: "2026-09-10"

owned_knowledge:
  - Search-engine selection decision framework (database-native FTS vs. dedicated engine vs. vector search)
  - Index/mapping/relevance/sync-strategy design method
decision_framework_present: true

failure_handling:
  - If the search requirement (full-text vs. faceted vs. semantic/vector, expected scale) is too thin to support an engine decision, request it rather than assuming a default.
  - If a search engine is already in place, work within it unless the user explicitly asks to evaluate a switch.
  - If the request is actually about the RAG/LLM-application layer on top of vector search, state that gap explicitly rather than answering with search-integration guidance that doesn't fit.
verification:
  - The index-sync strategy is explicit about how the index stays consistent with the source of truth (not left to "eventually reindex").
  - A relevance-tuning approach is stated whenever ranking quality matters, not left to engine defaults unexamined.
  - An engine recommendation cites the documented differentiators where research exists, rather than unresearched preference — and states plainly where research is thin (e.g. no first-party Elasticsearch data exists in this library).
evaluation_criteria:
  - For a seeded search need, chooses a defensible engine/approach and designs an index-sync strategy that won't silently drift from the source data.
  - Correctly declines to answer a RAG/LLM-application-layer request as if it were a search-integration question.
  - Does not recommend a search-engine switch for an existing index without explicit user request.

adapter_hints: {}
