covered_versions:
  tailwindcss: ">=3.4 <=4.3 (v3-LTS and v4 both simultaneously live)"
version_sensitive_claims:
  - claim: v4.0 requires Safari 16.4+, Chrome 111+, Firefox 128+ due to its dependence on @property and color-mix(); teams needing older-browser support must stay on the v3.4 line. This is a hard compatibility gate, not a soft recommendation.
    applies_to: ">=4.0"
    source_ref: research/technologies/tailwind.md §13 (Breaking Changes); research/knowledge-maps/version-matrix.md
  - claim: v4.2.0 added four new default color palettes (mauve, olive, mist, taupe) that do not exist in any earlier v4.x release or in v3.x — code/snapshots referencing them fail on earlier v4.x or any v3.x.
    applies_to: ">=4.2.0"
    source_ref: research/technologies/tailwind.md §12; research/knowledge-maps/version-matrix.md
  - claim: Arbitrary CSS-variable-value syntax changed from bracket form (bg-[--brand-color]) in v3 to parenthesis form (bg-(--brand-color)) in v4.
    applies_to: "v3.x uses bracket form; >=4.0 uses parenthesis form"
    source_ref: research/technologies/tailwind.md §3, §13
  - claim: The official v3→v4 migration codemod (npx @tailwindcss/upgrade) requires Node.js 20+.
    applies_to: "upgrade tooling, current as of tailwindcss 4.3.3"
    source_ref: research/technologies/tailwind.md §11; research/knowledge-maps/version-matrix.md
  - claim: The @config/@plugin legacy-JS-config compatibility bridge does not support the corePlugins, safelist, or separator options.
    applies_to: "confirmed for 4.0.0; unconfirmed whether later 4.x patches expanded this — Unresolved"
    source_ref: research/technologies/tailwind.md §4, §14; research/knowledge-maps/version-matrix.md
last_verified: "2026-09-10"
reverify_triggers:
  - Whether the @config/@plugin corePlugins/safelist/separator gap has been confirmed resolved (or is still present) in a later 4.x patch beyond 4.3.3
  - A new Tailwind major release (v5), or a new v4.x minor that changes default theme content the way v4.2.0's color-palette addition did
  - Any official statement establishing a formal v3-LTS end-of-life date (currently an informal, observed-only pattern from the v3-lts npm dist-tag and changelog activity, not a documented policy)

owned_knowledge:
  - Tailwind utility-class composition, variant-stacking syntax, and arbitrary-value/variable syntax (bracket vs. parenthesis)
  - The v4 CSS-first @theme/@utility/@variant/@custom-variant configuration model and its v3 tailwind.config.js equivalent
  - Tailwind's content-detection/class-scanning mechanism and its dynamic-class-name limitation
  - The documented v3→v4 breaking-change catalogue and browser-support floor
decision_framework_present: true

failure_handling:
  - If the target browser support matrix is unknown, ask for it or explicitly state that v4's floor (Safari 16.4+/Chrome 111+/Firefox 128+) is assumed — never silently assume v4 support for an unstated audience (VA-3).
  - If the installed Tailwind major/minor version cannot be determined, ask for it or state the version the guidance assumes, since features (e.g. v4.2.0's color palettes) and syntax (bracket vs. parenthesis arbitrary values) are not uniform across the live v3.4/v4.x lines.
  - If shell/build execution is unavailable, degrade to advisory class/config edits and state that the codemod (npx @tailwindcss/upgrade) or a real build was not run.
escalation:
  - A v3→v4 upgrade touching a shared/production config requires explicit user confirmation before running the codemod, since it rewrites config and template files across the project and the official guide itself recommends reviewing every diff before merging.
  - Introducing Tailwind v4 into a project that currently relies on Sass/Less/Stylus as a preprocessing step requires explicit user confirmation before removing/bypassing the preprocessor, since v4 does not support using it alongside Tailwind.
verification:
  - Every version-specific claim in the output (browser floor, color-palette availability, arbitrary-value syntax) is tagged with the range it holds for.
  - A proposed v3→v4 migration is run via the official codemod on a branch with the diff reviewed, not applied blind.
  - No dynamically-constructed class-name string is introduced (e.g. template-interpolated utility classes); only a static lookup map is used for data-driven styling.
evaluation_criteria:
  - For a seeded project with an unstated browser target, does not silently assume v4 support; asks or states the assumption explicitly.
  - For a seeded v3 codebase being touched, correctly identifies at least one real, version-tagged v3→v4 breaking change relevant to the seeded code (e.g. bracket-to-parenthesis arbitrary-variable syntax, or the border/ring default-color change).
  - For a seeded "add Tailwind to a project that already uses Sass" task, states the narrow v4 preprocessing incompatibility precisely rather than treating Sass and Tailwind as universally conflicting, and does not recommend abandoning Sass project-wide without cause.
  - Chooses a defensible v3-vs-v4 and utility-first-vs-component-library decision for a seeded scenario, including the "plain CSS, no framework" simplest branch when nothing justifies more (QR-4).
  - Does not restate generic styling-token/theming-architecture guidance owned by the parent styling-systems skill (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running the @tailwindcss/upgrade codemod or a build; abstract shell → CC tools
  cursor:
    paths: ["**/*.css", "tailwind.config.*", "**/*.{jsx,tsx,vue,svelte,html}"]
  vscode:
    argument_hint: "<task, e.g. 'convert this component to utility classes' or 'plan the v3 to v4 upgrade'>"
