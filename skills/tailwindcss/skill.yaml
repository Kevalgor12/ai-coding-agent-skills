id: SK-TECH-tailwindcss
slug: tailwindcss
name: Tailwind CSS
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-003]   # styling-systems

purpose: >-
  Apply Tailwind CSS correctly and version-appropriately — the utility-first
  model, v4's CSS-first @theme configuration and Oxide engine, content
  detection, arbitrary-value/variant syntax, and the v3-vs-v4 browser-support
  and migration decision.
scope: >-
  Tailwind-specific facts and mechanics: utility-class composition, the
  @theme/@utility/@variant/@custom-variant at-rule family, content-detection
  and its dynamic-class-name limitation, the v3→v4 breaking-change surface,
  and the concurrently-live v3.4/v4.x version lines. The generic method for
  choosing/architecting a project's styling system (tokens, theming
  architecture, when to reach for a framework at all) comes from the parent
  Layer-3 skill (styling-systems).
expertise: Frontend engineer specializing in utility-first CSS with Tailwind CSS.
description: >-
  Tailwind CSS utility-first styling: v4's CSS-first @theme config, Oxide
  engine, content detection, arbitrary-value/variant syntax, and the
  v3-vs-v4 browser-floor/migration decision. Use when the stack has a
  tailwind.config.js, "@import \"tailwindcss\"", a Tailwind dependency, or
  utility-class markup, or the task names Tailwind/@theme/utility-first CSS.
  Not for generic styling-system architecture (styling-systems), Sass syntax
  with no Tailwind involved (sass), or shadcn/ui mechanics (shadcn-ui).

activation_conditions:
  - A tailwind.config.js/tailwind.config.ts, an "@import \"tailwindcss\";" CSS entry, or a @tailwindcss/vite|postcss|cli dependency is present
  - Markup contains Tailwind utility-class patterns (e.g. flex, text-*, bg-*, and stacked responsive/state/dark variant prefixes)
  - The task names Tailwind, utility-first CSS, or a Tailwind-specific mechanism (@theme, @utility, @custom-variant, the Oxide engine, content detection)
  - A Tailwind v3→v4 upgrade, browser-support-floor decision, or Play CDN production-readiness question is being evaluated
non_activation_conditions:
  - No Tailwind dependency/config, and the task is generic styling-system architecture with no framework chosen yet (route to SK-FE-003 styling-systems)
  - The task is Sass-specific syntax or module-system work with no Tailwind involved (route to SK-TECH-sass)
  - The task is shadcn/ui component installation/registry mechanics beyond Tailwind's own utility classes (route to SK-TECH-shadcn-ui)
  - Plain hand-authored CSS/HTML semantics with no utility-class framework involved (route to SK-TECH-web-standards)
activation_mode: auto

inputs:
  - name: task
    description: The Tailwind task (utility-class implementation, theme/token setup via @theme, v3→v4 upgrade, browser-support decision).
    required: true
  - name: existing-config
    description: Existing tailwind.config.js or CSS @theme block, the target browser support matrix, and the currently installed Tailwind version.
    required: false
required_context:
  - The Tailwind major version in use (v3.4.x vs. v4.x) — required given both lines are simultaneously live and their syntax/config model differ.
optional_context:
  - The project's target browser support matrix (needed to validate the v4.0 floor of Safari 16.4+/Chrome 111+/Firefox 128+).
  - Whether a CSS preprocessor (Sass/Less/Stylus) is already in the build pipeline.

outputs:
  - name: styles-or-config
    kind: edit
    description: Utility-class markup, an @theme block (v4) or tailwind.config.js (v3) change, reflecting version-correct syntax.
  - name: migration-edit
    kind: edit
    description: v3→v4 migration changes, produced via the official codemod and reviewed diff-by-diff, or a manual equivalent.
  - name: analysis
    kind: analysis
    description: A v3-vs-v4, utility-first-vs-component-library, or browser-floor recommendation with rationale and the version it applies to.

depends_on_skills: []
# depends_on_skills stays empty: this skill's relationship to SK-FE-003
# (styling-systems) is specialization, not hard sub-step composition — that
# relationship is already fully captured by `parents` above. Putting SK-FE-003
# here too would be redundant and would assert a stronger claim (blocking
# invocation) than "I am a more specific version of that skill's method"
# actually is (spec §2.5). This exact mistake happened in an earlier batch
# (see audits/2026-09-09-data-domain-validation.md) — not repeating it here.
related_skills: [SK-TECH-shadcn-ui, SK-TECH-web-standards]
conflicts_with: []
# Deliberately empty, not [SK-TECH-sass]: this project's dependency
# architecture treats Sass and Tailwind as independent, non-conflicting
# project-level styling choices at the skill-composition level, even though
# Tailwind v4 itself declines to support Sass as a preprocessing step used
# alongside it. That is a narrow technical incompatibility (stated in Security
# note below and in the Knowledge/When-to-use sections), not a skill-level
# "must not co-activate" conflict — a project could still consult both skills
# (e.g. migrating away from Sass toward Tailwind, or running Sass for a
# non-Tailwind part of a codebase).

required_capabilities: [file-read, file-write]
execution_tier: A
# Tier A: this skill's work is advisory/file-only — editing markup, @theme
# blocks, or config, and reasoning about version/browser-floor tradeoffs.
# Running the actual build or the @tailwindcss/upgrade codemod needs shell,
# which is outside this skill's required capabilities; failure_handling below
# states the advisory-only degrade explicitly for that case.

