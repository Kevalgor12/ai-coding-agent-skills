covered_versions:
  mysql: ">=8.0 <=9.7 LTS / 26.x Innovation (calendar-versioned, from 26.7.0)"
version_sensitive_claims:
  - claim: 9.7 is the last MySQL release on traditional MAJOR.MINOR.PATCH numbering; Innovation releases from 26.7.0 onward use calendar-based YY.M.P versioning.
    applies_to: ">=26.7.0 (scheme change); 9.7 is the last pre-change release"
    source_ref: research/knowledge-maps/version-matrix.md (MySQL row, "Versioning scheme")
  - claim: mysql_native_password authentication is disabled by default; default_authentication_plugin was removed in favor of authentication_policy.
    applies_to: ">=8.4.0"
    source_ref: research/technologies/mysql.md §7, §13
  - claim: AUTO_INCREMENT on FLOAT/DOUBLE columns is removed (error, not warning); affected tables must be altered before upgrading or the table cannot be upgraded.
    applies_to: ">=8.4.0"
    source_ref: research/technologies/mysql.md §6, §11, §13
  - claim: Replication SQL syntax renamed (START SLAVE → START REPLICA, etc.); old syntax errors rather than warns.
    applies_to: ">=8.4.0"
    source_ref: research/technologies/mysql.md §13
  - claim: Upgrade paths cannot skip a bugfix/LTS series (5.7 → 8.0 → 8.4, not direct); Innovation-to-Innovation upgrades cannot skip across an LTS boundary.
    applies_to: "all documented upgrade paths through 9.7"
    source_ref: research/technologies/mysql.md §11
  - claim: MySQL 5.7 reached Oracle Lifetime Sustaining Support (EOL) 2023-10-25; MySQL 8.0 reached Lifetime Sustaining Support 2026-04-21, with users pushed to 8.4 LTS or 9.7 LTS.
    applies_to: "5.7 as of 2023-10-25; 8.0 as of 2026-04-21"
    source_ref: research/technologies/mysql.md §12 (dates derived from a search summary of mysql.com/support/eol-notice.html, flagged for direct re-verification)
  - claim: As of the July 2026 GA wave, MySQL 26.7.0 (Innovation), MySQL 9.7.2 LTS, and MySQL 8.4.11 LTS are concurrently current — old and new numbering schemes coexist.
    applies_to: "July 2026 GA wave and after"
    source_ref: research/technologies/mysql.md §12
last_verified: "2026-09-09"
reverify_triggers:
  - A new MySQL LTS or Innovation release (any 8.4.x, 9.7.x, or 26.x patch/minor beyond what's cited here)
  - Publication of an official "Changes in MySQL 9.x" or "Changes in MySQL 26.7.0" breaking-changes page (not yet enumerated in the underlying research — currently a documented gap)
  - Clarification of whether MySQL 9.7 LTS is itself renumbered under calendar versioning, or remains a permanent legacy-numbered LTS line
  - Any change to the official EOL dates for MySQL 8.4 LTS / 9.7 LTS (currently derived from a search summary, not a direct fetch)

owned_knowledge:
  - MySQL pluggable storage-engine selection (InnoDB vs. MyISAM/MEMORY/CSV/ARCHIVE/BLACKHOLE/MERGE/FEDERATED)
  - MySQL replication/HA topology selection (async replication, GTID, Group Replication/InnoDB Cluster, NDB Cluster)
  - MySQL version-numbering transition and upgrade-path restrictions
  - MySQL authentication-plugin and Keyring at-rest-encryption specifics
decision_framework_present: true

failure_handling:
  - If the MySQL version cannot be determined, ask for it or state the version its guidance assumes; never assume "latest" silently (VA-3) — this matters more than usual given the concurrent 8.4/9.7/26.x numbering.
  - If shell is unavailable/denied, degrade to advisory DDL/engine/index output and state that EXPLAIN or the migration was not run.
  - If a claim would depend on the still-unresearched 9.7→26.x breaking-changes page, say so explicitly ("verify against current 26.x release notes") rather than assert behavior by analogy to 8.0→8.4.
escalation:
  - A destructive migration (DROP/ALTER that loses data), a storage-engine change on a populated table, or an in-place major-version upgrade requires explicit user confirmation before execution (defer to SK-DATA-006 rollout discipline).
verification:
  - Any proposed index is checked against an EXPLAIN actually run against the target table, not a guess or a plan reasoned about from the query text alone.
  - Any storage-engine choice is justified against the table's actual workload (transactional vs. read-only/temp/archival), not left at the InnoDB default by inertia or changed from it without cause.
  - Any version-specific claim is tagged with the range it holds for, and the target MySQL version is confirmed before recommending a version-gated feature.
  - For an upgrade, the path respects the documented no-skip-a-series restriction and the AUTO_INCREMENT FLOAT/DOUBLE pre-upgrade check when crossing into 8.4+.
evaluation_criteria:
  - For a seeded slow query with EXPLAIN output, proposes an index/rewrite that addresses the actual plan, not a generic guess.
  - For a seeded upgrade scenario (e.g. 8.0 → 8.4), correctly flags at least one version-gated breaking change (auth default, AUTO_INCREMENT FLOAT/DOUBLE, or replication syntax) relevant to the seeded schema.
  - Chooses a defensible storage engine and replication topology for a seeded workload, including the "just use InnoDB + default async replication" simplest branch when nothing justifies more.
  - Does not restate generic schema-design method owned by SK-DATA-001, or claim an unresearched MySQL-vs-PostgreSQL performance comparison as fact (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running mysqlsh/EXPLAIN/mysqldump; abstract shell → CC tools
  cursor:
    paths: ["**/*.sql", "**/migrations/**"]
  vscode:
    argument_hint: "<task, e.g. 'pick a storage engine for this table' or 'plan the 8.0 to 8.4 upgrade'>"
