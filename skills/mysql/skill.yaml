id: SK-TECH-mysql
slug: mysql
name: MySQL
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-001, SK-DATA-003]   # data-modeling, database-operations

purpose: >-
  Apply MySQL correctly and version-appropriately — storage-engine choice,
  indexing, replication topology, authentication/encryption, and safe upgrade
  paths across MySQL's dual-track (LTS/Innovation) and now dual-numbering
  (MAJOR.MINOR.PATCH vs. calendar YY.M.P) release model.
scope: >-
  MySQL-specific design and operations: pluggable storage engines, indexing
  and EXPLAIN-driven tuning, replication/HA topology, authentication and
  at-rest encryption, and version-gated upgrade hazards. The generic
  schema-design method comes from the parent Layer-3 skill (data-modeling);
  query/index tuning depth beyond MySQL-specific facts is owned by
  database-operations.
expertise: MySQL database engineer.
description: >-
  MySQL-specific storage-engine choice, indexing, replication, authentication,
  and at-rest encryption. Use when the stack uses MySQL (mysql:// URL, mysql2/
  Connector driver, a MySQL-targeted ORM provider, or the task names MySQL/
  InnoDB/binlog/GTID/an LTS-to-LTS upgrade). Not for PostgreSQL/other engines,
  generic data modeling (use data-modeling), or ORM usage mechanics (use
  orm-integration).

activation_conditions:
  - A mysql:// connection string or a MySQL driver (mysql2, Connector/J, Connector/Python, Connector/Node.js, Connector/ODBC, libmysqlclient) is present
  - An ORM/ODM configured with a MySQL provider/dialect is detected
  - The task names MySQL or a MySQL-specific feature (InnoDB, storage engine, binlog, GTID, Group Replication, InnoDB Cluster, the Keyring)
  - A MySQL version upgrade is being planned (e.g. 8.0 → 8.4, 8.4 → 9.7, or onto a 26.x calendar-versioned Innovation release)
non_activation_conditions:
  - The stack uses PostgreSQL, MongoDB, or another engine (route to that engine's skill)
  - Purely generic relational schema design with no relational engine chosen yet (route to SK-DATA-001 data-modeling)
  - ORM usage mechanics independent of the underlying engine (route to SK-DATA-002 orm-integration)
  - The task is safely evolving an already-populated schema's data, not MySQL-specific facts (route to SK-DATA-006 data-migration)
activation_mode: auto

inputs:
  - name: task
    description: The MySQL task (schema/engine change, slow query, replication/HA design, auth/encryption setup, version upgrade).
    required: true
  - name: schema-and-workload
    description: Existing schema, storage engine(s) in use, query patterns, EXPLAIN output, and the current MySQL version.
    required: false
required_context:
  - The MySQL version in use (server, image tag, or manifest) — required for version-correct guidance given the 8.0/8.4/9.7/26.x split.
optional_context:
  - EXPLAIN (including JSON format) output for a slow query.
  - Existing storage-engine assignment per table (ENGINE=...).
  - Replication topology (standalone, source/replica, Group Replication/InnoDB Cluster, NDB Cluster).

outputs:
  - name: schema-or-migration
    kind: edit
    description: DDL / migration reflecting version-correct MySQL syntax and storage-engine choice.
  - name: engine-or-index-change
    kind: edit
    description: Storage-engine assignment, index definitions, or query rewrites addressing an observed EXPLAIN plan.
  - name: analysis
    kind: analysis
    description: Recommendations (engine choice, replication topology, upgrade plan) with rationale and the version they apply to.

depends_on_skills: []
# Policy fix (2026-09-09, applied consistently with the solution-architecture
# fix from the DISC-domain batch): depends_on_skills is reserved for hard
# composition (invoking another skill as a blocking sub-step of this skill's
# own execution). The relationship to the generic parent skill(s) above is
# specialization, already fully captured by the `parents` field -- duplicating
# it into depends_on_skills was redundant and conflated the two relationship
# types. Cleared here; parents is the single source of truth for this edge.
related_skills: [SK-TECH-drizzle, SK-TECH-prisma, SK-TECH-typeorm, SK-DATA-002, SK-DATA-006]
conflicts_with: [SK-TECH-postgresql]   # alternative primary relational engine; do not co-activate for the same engine decision

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: proposing DDL/engine/index changes is advisory; running EXPLAIN,
# mysqld/mysqlsh, or migrations needs shell. No capability_fallbacks block
# required (Tier B, not C) — degrades to advisory per failure_handling below.

