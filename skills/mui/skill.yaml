id: SK-TECH-mui
slug: mui
name: MUI (Material UI)
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-003, SK-FE-002]
# SK-FE-003 (styling-systems) and SK-FE-002 (ui-ux-design) — no content
# from either is assumed or fabricated here.

purpose: >-
  Apply MUI (Material UI) correctly and version-appropriately — Emotion-based
  CSS-in-JS theming, the sx prop, the styled() utility, CSS-variables theming,
  and RSC/App Router integration — while tracking the patch-line and peer-
  dependency gotchas that differ across its v7/v9 major lines.
scope: >-
  MUI-specific API, theming, styling-engine, CSP, and integration detail. The
  general styling-system method (design tokens, theming architecture,
  dark-mode strategy) belongs to styling-systems (SK-FE-003);
  general UI/UX design judgment (information architecture, visual
  design) belongs to ui-ux-design (SK-FE-002). This skill
  supplies what's MUI-specific: the sx prop, createTheme()/ThemeProvider, the
  Emotion styling engine and its CSP requirements, the v7/v9 breaking-change
  surface, and the security-patch-line policy.
expertise: Frontend engineer building or maintaining a Material-Design UI with MUI.
description: >-
  MUI (Material UI) component library — Emotion-based CSS-in-JS via the sx
  prop, theming (createTheme()/ThemeProvider/CSS-variables mode), and RSC/App
  Router integration (AppRouterCacheProvider). Use when @mui/material,
  @mui/icons-material, or @emotion/react+styled appear, or the task names MUI
  or Material UI. Not for shadcn/ui (route to that skill), generic
  styling-system choice (styling-systems), or UI/UX design judgment
  independent of a library (ui-ux-design).

activation_conditions:
  - "@mui/material, @mui/icons-material, @mui/material-nextjs, or @mui/system appear in package.json, a lockfile, or an import statement"
  - "A createTheme()/ThemeProvider/sx-prop pattern recognizable as MUI is present in the codebase"
  - The task names MUI, Material UI, or a Material-Design component library specifically
non_activation_conditions:
  - The project uses shadcn/ui, Chakra UI, Ant Design, or another component library instead (route to that skill)
  - The question is a generic styling-system or design-token choice with no component library chosen yet (route to styling-systems)
  - The question is UI/UX design judgment (information architecture, visual design, usability) independent of a specific component library (route to ui-ux-design)
activation_mode: auto

inputs:
  - name: task
    description: The MUI-specific task (component usage, theming, sx-vs-styled() decision, CSP configuration, SSR/RSC integration, version migration).
    required: true
  - name: installed-version
    description: The pinned @mui/material major version (from package.json/lockfile) — governs both API surface and security-patch posture.
    required: false
required_context:
  - The installed @mui/material major version — v9 (current, patched), v7 (LTS, patched), or v6-and-earlier (unpatched) changes both the correct API surface and the security posture of the recommendation.
optional_context:
  - The host framework/rendering setup (Next.js App Router vs. Pages Router vs. Express vs. another SSR host) — changes which integration pattern (AppRouterCacheProvider vs. AppCacheProvider vs. createEmotionServer) applies.
  - Whether a strict CSP is enforced in production — changes which CSP directives must be planned for.

outputs:
  - name: component-or-theme-code
    kind: edit
    description: MUI component usage, theme configuration (createTheme/ThemeProvider), sx-prop or styled() code, or CSS-variables theming setup correct for the installed version.
  - name: integration-config
    kind: edit
    description: SSR/RSC integration (AppRouterCacheProvider/AppCacheProvider), CSP directive configuration, or import-path/ESLint config addressing dev-server import performance.
  - name: analysis
    kind: analysis
    description: The determined version/patch-line and which version-sensitive caveats apply, or a MUI-vs-shadcn/ui / sx-vs-styled()-vs-CSS-variables decision with rationale.

depends_on_skills: []
# Per specification.md §2.5: parents (SK-FE-003, SK-FE-002) already captures
# the specialization relationship. depends_on_skills is reserved for hard,
# blocking sub-step composition, which does not apply here — deliberately
# left empty, not populated with the parents.
related_skills: []
conflicts_with: [SK-TECH-shadcn-ui]
# SK-TECH-shadcn-ui is an alternative component library for the same UI
# layer; no content of that skill is assumed here beyond the structural
# comparison already recorded in technology-decision-matrix.md §8.

required_capabilities: [file-read, file-write]
execution_tier: A
# Tier A: MUI work is authoring/advising on component, theme, and config
# code. No shell execution is required to produce correct MUI code; running a
# dev server to observe an import-speed regression or a build to measure
# bundle size is out of this skill's tier and is stated as such (see
# failure_handling).

