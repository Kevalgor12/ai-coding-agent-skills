covered_versions:
  "@mui/material": ">=7.0 <=9.0 (only 9.x current and 7.x LTS receive patches; 6.x and earlier unpatched)"
  react: "17.0.0+, 18.0.0+, 19.0.0+ (React <=18 requires pinning react-is to the installed React major via package-manager overrides)"
  typescript: ">=4.9 (raised from 4.7 by the v6->v7 migration)"
version_sensitive_claims:
  - claim: Only v9.x (current stable) and v7.x (designated long-term support) receive security patches; v6.x and earlier are not receiving security patches under this policy.
    applies_to: "v9.x and v7.x are currently patched; v6.x and earlier are unpatched (state as of the v9 release cycle)"
    source_ref: research/technologies/mui.md §7, §12; github.com/mui/material-ui SECURITY.md
  - claim: React <=18 apps must pin react-is to their installed React major via package-manager overrides, because MUI's own code depends on react-is@19.
    applies_to: "React 17.0.0+/18.0.0+ peer support, gotcha introduced/documented from the v7 migration onward"
    source_ref: research/technologies/mui.md §11, §12
  - claim: TypeScript minimum raised to 4.9 (from 4.7).
    applies_to: "v7 and later"
    source_ref: research/technologies/mui.md §11, §13
  - claim: Next.js 13.5+ auto-applies optimizePackageImports for MUI, removing the need for manual path-import discipline.
    applies_to: "Next.js >=13.5, any MUI version"
    source_ref: research/technologies/mui.md §5
  - claim: RSC/App Router support ("use client" on all components) shipped in Material UI v5.14.0.
    applies_to: ">=5.14.0"
    source_ref: research/technologies/mui.md §2, §16
  - claim: Minimum supported browsers raised to Chrome 117+, Firefox 121+, Safari 17.0+.
    applies_to: "v9 and later"
    source_ref: research/technologies/mui.md §11, §13
  - claim: Major version numbering jumped from v7 directly to v9 (skipping v8) specifically to align with MUI X, which as of v9 shares major-version numbers with Material UI.
    applies_to: "v9 release onward"
    source_ref: research/technologies/mui.md §11, §16
  - claim: CSS-variables theming (cssVariables:true) was opt-in/experimental in v5, became more central/refined through v6-v9, and v9 adds color-mix()-based derived colors.
    applies_to: "opt-in from v5; refined v6-v9"
    source_ref: research/technologies/mui.md §1, §13
last_verified: "2026-09-10"
reverify_triggers:
  - A new Material UI major release (changes covered_versions and the API surface)
  - Any change to the SECURITY.md supported-version/patch-line policy
  - The 9.0.0-beta.1 "next" dist-tag (or a subsequent v10 line) reaching stable
  - MUI's stated migration of Material UI's internals onto Base UI reaching a documented, version-tagged milestone

owned_knowledge:
  - MUI's sx prop, styled() utility, and theme-overrides customization API
  - MUI's Emotion-based CSS-in-JS styling engine and its CSP nonce requirements
  - MUI's CSS-variables theming mode (cssVariables:true, colorSchemes)
  - MUI's v7/v9 breaking-change surface, codemods, and security-patch-line policy
  - MUI's RSC/App Router integration pattern (AppRouterCacheProvider)
decision_framework_present: true

failure_handling:
  - If the installed @mui/material major version cannot be determined, ask for it or explicitly state the version the guidance assumes — never assume "v9/latest" silently, since v6-and-earlier is unpatched and the API surface differs materially across majors (VA-3).
  - If shell is unavailable (this skill's tier is A), produce advisory component/theme/config code and state plainly that no dev-server/build was run to verify an import-performance or bundle-size claim.
  - If the project pins @mui/material to v6.x or earlier, state explicitly that the line no longer receives security patches per MUI's SECURITY.md policy, rather than proceeding as if it were a routine version choice.
escalation:
  - Recommending or continuing development on an unpatched v6-or-earlier @mui/material line for a production app is a security-relevant decision requiring explicit user acknowledgment before proceeding.
  - Accepting style-src-attr 'unsafe-inline' in a strict-CSP production deployment (required by some MUI components) should be surfaced to the user for explicit sign-off, not silently included in generated CSP config.
verification:
  - Every version-sensitive API used (Grid vs. GridLegacy, slots/slotProps vs. components/componentsProps, react-is pin) matches the confirmed installed major version.
  - Any CSP configuration produced includes the style-src-elem nonce, and notes style-src-attr 'unsafe-inline' and the InitColorSchemeScript script-src nonce where applicable.
  - Any claim about patch support, browser floor, or peer-dependency requirements is tagged with the version range it holds for.
evaluation_criteria:
  - Given a seeded package.json pinning @mui/material to v6.x or earlier, flags the unpatched-security-line risk rather than proceeding silently.
  - Given a seeded React 18 project using @mui/material v7+, recommends pinning react-is via overrides rather than omitting the step.
  - For a seeded strict-CSP Next.js App Router scenario, produces CSP directives covering the Emotion style-src-elem nonce, any needed style-src-attr allowance, and the InitColorSchemeScript script-src nonce.
  - Chooses a defensible customization approach (sx vs. styled() vs. theme components key) for a seeded one-off-vs-reusable-vs-global styling scenario, matching MUI's documented scope guidance.
  - Does not restate styling-systems' or ui-ux-design's general method, or shadcn/ui's internal API, verbatim (QR-2).

