id: SK-TECH-github-actions
slug: github-actions
name: GitHub Actions
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-INFRA-002]

purpose: >-
  Apply GitHub Actions correctly and version-appropriately — workflow YAML
  mechanics, reusable-workflow composition, artifact storage, self-hosted
  runner risk, cache-poisoning boundaries, and the set-output/save-state
  security fix — as the concrete implementation of ci-cd-pipeline's generic
  method.
scope: >-
  GitHub-Actions-specific implementation depth: workflow/job/step YAML
  structure, reusable workflows and composite actions, `actions/cache` and
  `actions/upload-artifact`/`download-artifact` usage, self-hosted-runner
  operational risk, cache-poisoning restrictions on low-trust triggers, and
  the `set-output`/`save-state` deprecation. Does not repeat the generic
  pipeline-design method, OIDC/token/caching *principles*, or matrix-strategy
  concepts already owned by the parent (ci-cd-pipeline) — only adds
  platform-specific mechanics and content the parent does not cover.
expertise: CI/CD engineer specializing in GitHub Actions.
description: >-
  GitHub-Actions-specific workflow YAML syntax, reusable workflows,
  actions/cache and artifact-storage mechanics, self-hosted-runner risk,
  cache-poisoning on pull_request_target, and the set-output/save-state
  security fix. Use when the CI platform is (or is being set up as) GitHub
  Actions. Not for platform-agnostic pipeline design (use ci-cd-pipeline) or
  other CI platforms, which have no researched grounding in this library.

activation_conditions:
  - A `.github/workflows/*.yml` or `.yaml` file exists or is being authored
  - The task names GitHub Actions, a workflow file, a GitHub Actions action, or a self-hosted runner
  - Configuring `GITHUB_TOKEN` permissions, `actions/cache`, `actions/*-artifact`, or GitHub OIDC-to-cloud federation
non_activation_conditions:
  - Platform-agnostic pipeline design with no CI platform chosen yet (route to ci-cd-pipeline)
  - A different CI platform (Jenkins, CircleCI, GitLab CI) — not researched or grounded in this library
  - Git hooks running locally rather than on a GitHub-hosted/self-hosted runner (route to husky)
activation_mode: auto

inputs:
  - name: task
    description: The GitHub Actions task (author/change a workflow, harden a security posture, diagnose a failing run, speed up a pipeline).
    required: true
  - name: existing-workflows
    description: Existing `.github/workflows/*.yml` files, if this is not greenfield.
    required: false
required_context:
  - Whether the target platform is confirmed to be GitHub Actions (vs. platform-agnostic design, which belongs to the parent)
optional_context:
  - The deploy target's cloud provider, if OIDC federation is in scope
  - Whether any self-hosted runners are in use, and whether the repo is public

outputs:
  - name: workflow-yaml
    kind: edit
    description: Workflow, reusable-workflow, or composite-action YAML under `.github/workflows/` or `action.yml`.
  - name: analysis
    kind: analysis
    description: Findings on runner choice, cache/artifact configuration, or a security-hardening gap, with rationale.

depends_on_skills: []
related_skills: [SK-TECH-husky]
conflicts_with: []

required_capabilities: [file-read, file-write]
execution_tier: A
# Tier A: authoring workflow YAML is advisory/file-only. This library's
# capability map found no ecosystem that drives GitHub Actions natively —
# actual workflow execution is external, same posture as the parent skill.

