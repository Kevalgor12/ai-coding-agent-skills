covered_versions:
  mongoose: ">=8.0 <=9.x"
version_sensitive_claims:
  - claim: >-
      sanitizeFilter failed to recursively sanitize inside the $nor operator,
      allowing NoSQL injection even with sanitizeFilter enabled
      (CVE-2026-42334, CVSS 7.5).
    applies_to: "<6.13.9, 7.0.0-7.8.8, 8.0.0-8.22.0, 9.0.0-9.1.5 — patched in ^6.13.9, ^7.8.9, ^8.22.1, ^9.1.6"
    source_ref: "research/technologies/mongoose.md §7/§13; GHSA-wpg9-53fq-2r8h"
  - claim: >-
      Mongoose-to-MongoDB-server version compatibility matrix (which Mongoose
      major/range works against which MongoDB server major/range).
    applies_to: "MongoDB 8.x <-> ^8.7.0|^9.0.0; 7.x <-> ^7.4.0|^8.0.0|^9.0.0; 6.x <-> ^7.0.0|^8.0.0|^9.0.0; 5.x/4.4.x/4.2.x <-> ^6.0.0|^7.0.0|^8.0.0; 4.0.x <-> ^6.0.0|^7.0.0|^8.0.0<8.16.0; 3.6.x <-> ^6.0.0|^7.0.0|^8.0.0<8.8.0"
    source_ref: "research/knowledge-maps/version-matrix.md; research/technologies/mongoose.md §12"
  - claim: Node.js >= 20.19.0 is required.
    applies_to: "mongoose 9.x"
    source_ref: "research/knowledge-maps/version-matrix.md; research/technologies/mongoose.md §12/§13"
  - claim: updatePipeline (array/aggregation-pipeline update syntax) defaults to disabled/opt-in.
    applies_to: "mongoose >=9.0.0 (previously always-allowed in 8.x)"
    source_ref: "research/technologies/mongoose.md §4/§13"
  - claim: Pre middleware hooks no longer receive a next() callback parameter — async/Promise-only.
    applies_to: "mongoose >=9.0.0"
    source_ref: "research/technologies/mongoose.md §11/§13"
  - claim: TypeScript is officially supported.
    applies_to: ">=5.11.0"
    source_ref: "research/technologies/mongoose.md §16"
  - claim: >-
      Support-window state: Mongoose 8's stated support window ("through
      2026-02-01") is in documented tension with 8.24.x patches observed
      shipping past that date; Mongoose 6 EOL 2027-02-01 (security/requested
      fixes only until then); Mongoose 5 EOL 2024-03-01, no longer maintained.
    applies_to: "mongoose 5.x, 6.x, 8.x"
    source_ref: "research/technologies/mongoose.md §12; research/knowledge-maps/version-matrix.md"
last_verified: "2026-09-09"
reverify_triggers:
  - A new Mongoose major release (10.x) — Document.prototype.validateSync() is already flagged for removal there
  - Any update to, or new advisory related to, CVE-2026-42334 / GHSA-wpg9-53fq-2r8h
  - A change to the Mongoose-to-MongoDB-server compatibility matrix at mongoosejs.com/docs/compatibility.html
  - Resolution of the Mongoose 8 support-window tension (stated EOL vs. continued patches)

owned_knowledge:
  - Mongoose Schema/Model/Document lifecycle and pre-compilation registration rule
  - Mongoose middleware/hooks execution model and 8.x->9.x next()-callback removal
  - Mongoose discriminators, change tracking, and type-casting behavior
  - Mongoose sanitizeFilter mechanics and CVE-2026-42334 detail
decision_framework_present: true

failure_handling:
  - If the pinned Mongoose version isn't known, ask for it or state the covered_versions range the guidance assumes — sanitizeFilter's CVE exposure, updatePipeline's default, and the pre-middleware next() signature all differ materially between 8.x and 9.x.
  - If shell is unavailable, degrade to advisory schema/config/code output and say that index builds, migrations, or a live-connection check were not run.
verification:
  - Schema methods/statics/virtuals/middleware/plugins are registered before mongoose.model() compilation, never after [Source: https://mongoosejs.com/docs/models.html].
  - Any query filter built from user input either whitelists fields explicitly or relies on a patched (sanitizeFilter-enabled, post-CVE-2026-42334) Mongoose version — never an unpatched version assumed safe by the flag alone.
  - Any version-specific claim made is tagged with the Mongoose range it holds for.
  - Schema registration order is confirmed by actually running the application (or a smoke script) that compiles the model and checks the plugin/method is present on an instance, not inferred from reading the file order alone.
evaluation_criteria:
  - Given a seeded schema/model task, produces methods/statics/middleware as non-arrow functions registered pre-compilation, per the documented `this`-binding and pre-compilation-only registration rules.
  - Given a query-filter task built from user input, either flags sanitizeFilter's off-by-default status plus CVE-2026-42334's version range, or recommends field whitelisting instead of asserting the flag alone is sufficient.
  - Given a cross-document read task, correctly distinguishes when `.populate()` suffices vs. when an aggregation pipeline (`$lookup`) is warranted, without restating orm-integration's generic N+1 content verbatim.
  - Does not duplicate orm-integration's cross-ORM N+1/transaction-handling content or data-migration's generic expand/contract method — only adds Mongoose-specific depth.

adapter_hints: {}
