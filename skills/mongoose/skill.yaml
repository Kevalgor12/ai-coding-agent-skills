id: SK-TECH-mongoose
slug: mongoose
name: Mongoose
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-002, SK-DATA-006]   # orm-integration, data-migration

purpose: >-
  Apply Mongoose correctly and version-appropriately as MongoDB's ODM —
  Schema/Model/Document design, middleware hooks, discriminators, change
  tracking, type casting, and safe document-schema evolution.
scope: >-
  Mongoose-specific API, configuration, and behavior for MongoDB object
  modeling. Specializes orm-integration (generic ODM/ORM usage, cross-ORM N+1
  and transaction handling — not repeated here) and data-migration (generic
  migration mechanics — specialized here for schema-less-but-evolving
  documents). Not general MongoDB server administration with no Mongoose
  layer in play.
expertise: Node.js engineer who has run Mongoose against production MongoDB.
description: >-
  Mongoose-specific Schema/Model/Document design, middleware hooks,
  discriminators, change tracking, and type casting on MongoDB. Use when the
  stack uses Mongoose (mongoose npm package, Schema/Model/Document code,
  mongoose.connect()). Not for other ODMs/ORMs (orm-integration), generic
  MongoDB use with no Mongoose layer, or non-Mongoose-specific migration
  mechanics (data-migration).

activation_conditions:
  - The `mongoose` npm package is a dependency, or code imports/requires `mongoose`
  - Code defines a Mongoose `Schema`/`Model` (`new mongoose.Schema(...)`, `mongoose.model(...)`) or calls `mongoose.connect()`/`createConnection()`
  - The task names Mongoose or a Mongoose-specific feature (middleware/hooks, discriminators, populate, sanitizeFilter, lean(), a Mongoose error like ParallelSaveError/DivergentArrayError)
non_activation_conditions:
  - The project uses a different ODM/ORM (TypeORM/Prisma/Drizzle) or the raw MongoDB driver with no Mongoose layer (route to orm-integration, or a MongoDB-driver-specific skill)
  - The task is generic ORM/ODM selection or cross-ORM N+1/transaction guidance with no store chosen yet (route to orm-integration)
  - The task is schema/data migration mechanics with nothing Mongoose-specific in question (route to data-migration)
activation_mode: auto

inputs:
  - name: task
    description: The Mongoose-mediated task (schema/model design, middleware/hooks, discriminators, populate, transactions, security hardening, schema evolution).
    required: true
  - name: mongoose-and-mongodb-versions
    description: The pinned Mongoose version and target MongoDB server version — needed for version-correct guidance (compatibility matrix, CVE exposure, 8.x vs 9.x API differences).
    required: false
required_context:
  - Confirmation that Mongoose (not another ODM/ORM or the raw driver) is the data-access layer in use
optional_context:
  - Whether the deployment target is serverless (Lambda/Next.js) or a standalone `mongod` vs. replica set/sharded cluster (gates change streams/transactions)

outputs:
  - name: schema-model-code
    kind: edit
    description: Mongoose Schema/Model/Document definitions, middleware/hooks, discriminators, or query code.
  - name: security-hardening
    kind: edit
    description: sanitizeFilter/strict-mode configuration and version-patch guidance addressing CVE-2026-42334.
  - name: analysis
    kind: analysis
    description: Version-correctness and trade-off analysis (schema strictness, middleware vs. application-layer logic, populate vs. aggregation).

depends_on_skills: []
