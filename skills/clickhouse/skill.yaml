covered_versions:
  clickhouse: ">=26.2 <=26.8"
version_sensitive_claims:
  - claim: max_insert_threads default changed from 1 to auto, making INSERT SELECT parallelized by default — a breaking change affecting resulting part creation and row ordering compared to prior versions' single-threaded-by-default behavior.
    applies_to: ">=26.8"
    source_ref: research/technologies/clickhouse.md §13; research/knowledge-maps/version-matrix.md
  - claim: tokenbf_v1/ngrambf_v1 Bloom-filter skip-index types are deprecated.
    applies_to: ">=26.2"
    source_ref: research/technologies/clickhouse.md §5; research/knowledge-maps/version-matrix.md
  - claim: "26.8 is the documented LTS release (dated 2026-08-27); LTS ships twice yearly (historically March/August) with >=1-year support, current and prior LTS overlapping. 26.3 is believed to be the prior LTS line (inference from search metadata, not a directly fetched docs page)."
    applies_to: "as of research date 2026-09-09"
    source_ref: research/technologies/clickhouse.md §12; research/knowledge-maps/version-matrix.md
  - claim: "Stable releases publish monthly; the three most recent get bug-fix support, and Stable (not LTS) is the documented default recommendation for production. Exact support-duration wording is flagged by the source research as obtained via search summary, not a directly fetched policy page, and needs re-verification."
    applies_to: "as of research date 2026-09-09; Unresolved: exact support-duration figures"
    source_ref: research/technologies/clickhouse.md §12, Unresolved item 2
  - claim: 26.8 also changed X-ClickHouse-Format header precedence (now authoritative over FORMAT clause), reinterpreted unquoted JSON numbers in JSONEachRow as Unix timestamps for DateTime columns, removed the library dictionary source, and removed the Apache-Arrow-library-based reader/writer in favor of a native implementation.
    applies_to: ">=26.8"
    source_ref: research/technologies/clickhouse.md §13
  - claim: Cluster node version skew — downgrades are supported only to versions less than one year old, and only if no newer features introduced by the newer version have been used; once used, downgrade is not possible. Nodes in the same cluster differing by more than a year risk instability/data unavailability; use intermediate "stepping stone" versions for large jumps.
    applies_to: "general policy, current as of research date 2026-09-09"
    source_ref: research/technologies/clickhouse.md §11
  - claim: ClickHouse Keeper does not need to be upgraded in lockstep with the ClickHouse server, unless a security fix specifically targets Keeper or Apache ZooKeeper.
    applies_to: "general policy, current as of research date 2026-09-09"
    source_ref: research/technologies/clickhouse.md §11
last_verified: "2026-09-09"
reverify_triggers:
  - A new ClickHouse LTS or Stable release changes the max_insert_threads default or the 26.8 breaking-change set again
  - clickhouse.com/legal/support-services-policy is directly fetched and confirms/corrects the Stable "3 most recent releases" and LTS "1-year overlap" support-duration figures currently flagged Unresolved
  - The dedicated ClickHouse Keeper overview page is fetched and confirms/refutes the from-scratch Raft-based reimplementation claim
  - A new ClickHouse year-version line (e.g. 27.x) ships, or a new LTS is designated

owned_knowledge:
  - ClickHouse columnar storage and MergeTree table-engine mechanics (partitions/parts/granules, wide vs. compact part format, background merges)
  - ClickHouse sparse primary-key index design (ORDER BY key, granule sizing)
  - ClickHouse insert-strategy sizing (batch size, async_insert, "too many parts" avoidance)
  - ClickHouse SQL-driven RBAC entity model (Users/Roles/Row Policies/Settings Profiles/Quotas)
  # Cross-cutting security/performance/testing depth beyond ClickHouse specifics is NOT owned here.

decision_framework_present: true

failure_handling:
  - If it is unclear whether analytical load is actually degrading the OLTP primary (vs. anticipated future need), ask rather than recommending ClickHouse adoption preemptively — defer to SK-DATA-001's overengineering guard.
  - If the ClickHouse version cannot be determined, ask for it or explicitly state the version the guidance assumes — never assume "latest" silently (rule VA-3); this is consequential given the max_insert_threads behavior change at 26.8.
  - If shell is unavailable or denied, degrade to advisory DDL/query/insert-config output and state that it was not actually executed.
escalation:
  - Enabling ALTER TABLE ... UPDATE/DELETE (mutations) at scale, or dropping a partition, requires explicit user confirmation before execution — mutations rewrite whole data parts, cannot be undone once submitted, and persist across restarts unless cancelled.
  - A cluster upgrade spanning more than a year of releases, or any downgrade attempt after newer-version features have been used, requires an explicit stepping-stone plan and user confirmation before proceeding.
verification:
  - The chosen table engine and ORDER BY/primary key match the actual query access pattern, not a default choice.
  - Insert strategy (batch size or async_insert config) follows the documented sizing guidance rather than many small, frequent inserts.
  - Every version-specific claim is tagged with the ClickHouse range it holds for.
  - Nullable(T) usage is justified by a genuine need to distinguish "empty" from "absent," not used reflexively.
evaluation_criteria:
  - For a seeded scenario where analytical queries are demonstrably degrading an OLTP primary, recommends adding ClickHouse as a second, complementary store — not a replacement for the OLTP primary.
  - For a seeded scenario where the analytical need is only hypothetical ("might need it later"), does not recommend adopting ClickHouse (anti-overengineering, QR-4).
  - Insert-batch-size guidance for a seeded high-frequency-write scenario matches the documented 10,000–100,000-row range or recommends async inserts, not many small synchronous inserts.
  - Correctly flags the max_insert_threads 26.8 breaking change when the scenario involves upgrading across that boundary.
  - Does not restate data-modeling's (SK-DATA-001) store-shape decision framework verbatim (rule QR-2) — adds only ClickHouse-specific depth.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running clickhouse-client/clickhouse-local; abstract shell -> CC tools
  cursor:
    paths: ["**/*.sql", "**/clickhouse/**", "**/migrations/**"]
  vscode:
    argument_hint: "<task, e.g. 'design a MergeTree table for event analytics' or 'size the insert batch'>"
