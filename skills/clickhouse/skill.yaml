id: SK-TECH-clickhouse
slug: clickhouse
name: ClickHouse
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-003]   # database-operations — FORWARD REFERENCE, not yet authored in this library

purpose: >-
  Apply ClickHouse correctly and version-appropriately as a columnar OLAP
  store — MergeTree table-engine design, sparse primary-key indexing,
  partitioning, insert strategy, and SQL-driven RBAC — used to complement,
  not replace, a transactional (OLTP) primary datastore.
scope: >-
  ClickHouse-specific design and operations once ClickHouse is (or is being
  seriously evaluated as) part of the stack. Does not own the store-shape
  decision itself — whether a columnar/OLAP store is warranted at all is
  decided by the parent's parent, data-modeling (SK-DATA-001), which this
  skill treats as already settled. Generic query-tuning/indexing/transaction
  method across engines is owned by SK-DATA-003 (database-operations, a
  forward reference — not yet authored in this library); this skill supplies
  ClickHouse's concrete specifics only.
expertise: ClickHouse / OLAP database engineer.
description: >-
  ClickHouse-specific columnar OLAP: MergeTree engine family, sparse
  primary-key indexing (1 mark per ~8,192-row granule), partitioning,
  batch/async insert strategy, SQL-driven RBAC (5 entity types), and
  version-gated 26.x behavior (max_insert_threads auto-parallel as of 26.8).
  Use once analytical load is actually degrading an OLTP primary. Not for
  the store-shape decision itself (data-modeling), OLTP schema/query design
  (PostgreSQL/MySQL), or "for analytics later" premature adoption.

activation_conditions:
  - A ClickHouse client/driver, connection config, or clickhouse-server/clickhouse-local/chDB reference is present in the stack
  - The task names ClickHouse or a ClickHouse-specific feature (MergeTree, ORDER BY primary key, partitioning key, skip index, async_insert, ClickHouse Keeper)
  - An existing OLTP primary (PostgreSQL/MySQL) has analytical/aggregate query load that is demonstrably degrading it, and adding ClickHouse as a second store is being evaluated or implemented
non_activation_conditions:
  - No analytical load has actually degraded the primary store yet — "we might need analytics later" is premature adoption (route to SK-DATA-001's decision framework instead)
  - The store-shape decision itself is still open (relational vs. document vs. columnar) — route to SK-DATA-001
  - The task is OLTP schema or query design against PostgreSQL/MySQL with no ClickHouse in play — route to SK-TECH-postgresql / SK-TECH-mysql
  - Generic cross-engine query/index/transaction-tuning method with ClickHouse not actually in the stack — route to SK-DATA-003 (forward reference)
activation_mode: auto

inputs:
  - name: task
    description: The ClickHouse task (table/engine design, insert-strategy sizing, query/skip-index tuning, RBAC setup, version upgrade).
    required: true
  - name: workload-and-oltp-context
    description: The analytical query pattern, current OLTP primary, and evidence that it is actually degraded by analytical load (not just anticipated).
    required: false
  - name: ch-version
    description: The ClickHouse version in use (server, Cloud, or container image tag) — needed for version-correct guidance, notably max_insert_threads behavior.
    required: false
required_context:
  - Evidence that analytical/aggregate load is real and currently degrading (or would clearly degrade) the OLTP primary — not a hypothetical future need.
optional_context:
  - The ClickHouse version in use.
  - Existing table engine, ORDER BY key, and partitioning scheme, if a table already exists.
  - Insert volume/frequency and current batching approach.

outputs:
  - name: schema-or-table-ddl
    kind: edit
    description: MergeTree-family table DDL (engine choice, ORDER BY/primary key, PARTITION BY, skip indices) reflecting version-correct ClickHouse features.
  - name: insert-and-query-changes
    kind: edit
    description: Insert-strategy changes (batch sizing, async_insert config) or query/skip-index adjustments addressing an observed bottleneck.
  - name: analysis
    kind: analysis
    description: Recommendation on whether ClickHouse adoption is warranted yet, with rationale, or ClickHouse-specific design rationale with the version it targets.
  - name: commands-run
    kind: command-run
    description: clickhouse-client/clickhouse-local SQL or CLI invocations executed to diagnose or verify, when shell is available.

depends_on_skills: []
related_skills: [SK-TECH-postgresql, SK-TECH-mysql, SK-DATA-001]
conflicts_with: []
# ClickHouse is positioned as a complementary OLAP store alongside an OLTP
# primary, not a mutually-exclusive alternative to PostgreSQL/MySQL — the
# library's own architecture-patterns research treats "OLTP + separate OLAP"
# as a standard complementary pattern, not a replacement decision.

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Proposing DDL/insert/query changes is advisory (file-only); running
# clickhouse-client, EXPLAIN, or version-upgrade commands needs shell.
# No capability_fallbacks block required (Tier B, not C) — degrades to
# advisory per failure_handling if shell is unavailable.

