covered_versions:
  python: ">=3.12 <=3.14"
version_sensitive_claims:
  - claim: "Free-threaded (no-GIL) builds are disable-at-build (--disable-gil) plus a runtime toggle (-X gil=0 / PYTHON_GIL=0), experimental, in 3.13 (PEP 703); \"officially supported\" as of 3.14 (PEP 779), with single-thread overhead narrowed to roughly 5-10%."
    applies_to: "3.13 (experimental); >=3.14 (officially supported)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/python.md §2, §8
  - claim: "Python 3.14.0-3.14.4 shipped a new incremental GC, then reverted to 3.13's generational GC within the 3.14 bugfix series (3.14.5+) due to memory-pressure reports in production. \"Python 3.14\" alone is not a precise enough version tag for GC-behavior-sensitive claims — the patch version matters."
    applies_to: "3.14.0-3.14.4 (incremental GC); >=3.14.5 (reverted to generational GC)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/python.md §13
  - claim: Sub-interpreters gained their own per-interpreter GIL at the C-API level (PEP 684); exposed at the standard-library level via concurrent.interpreters and concurrent.futures.InterpreterPoolExecutor (PEP 734).
    applies_to: ">=3.12 (C-API); >=3.14 (stdlib)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/python.md §2
  - claim: PEP 695 compact generic syntax (class C[T], def f[T](...), the type statement) was added in 3.12; TypeIs was added in 3.13; the older TypeVar-object-based generic syntax remains supported.
    applies_to: ">=3.12 (PEP 695 syntax); >=3.13 (TypeIs)"
    source_ref: research/technologies/python.md §3
  - claim: distutils was removed from the standard library (PEP 632); the documented migration target is setuptools.
    applies_to: ">=3.12"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/python.md §6, §13
  - claim: The 2to3 tool and lib2to3 module were removed entirely (deprecated since 3.11); the dedicated pyporting.html HOWTO was itself discontinued as of 3.11, with only an archived copy under the 3.10 docs branch.
    applies_to: ">=3.13 (removal); >=3.11 (HOWTO discontinued)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/python.md §11
  - claim: ProcessPoolExecutor's default start method changes from fork to forkserver on non-macOS Unix — a behavior-affecting default for code relying on fork's implicit resource/global-state inheritance without pinning a start method explicitly.
    applies_to: ">=3.14 (non-macOS Unix)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/python.md §13, §17
  - claim: iOS (Tier 3, PEP 730) and Android (Tier 3, PEP 738) support landed; official Android binary releases and Emscripten's re-elevation to Tier 3 (PEP 776) followed, after wasm32-emscripten had lost officially-supported status.
    applies_to: ">=3.13 (iOS/Android Tier 3, Emscripten loses status); >=3.14 (Android binaries, Emscripten Tier 3 restored)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/python.md §10
  - claim: The opt-in tail-call interpreter build (--with-tail-call-interp) requires Clang 19+ on x86-64/AArch64.
    applies_to: ">=3.14"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/python.md §2, §8
  - claim: "PEP 2026 (\"Calendar versioning for Python\") was rejected by the Python Steering Council, reportedly partly over wheel-filename/version-parsing ecosystem compatibility concerns; sequential 3.15, 3.16, ... numbering continues."
    applies_to: "n/a — rejected proposal, informational for any future-version assumption"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/python.md (header note, §12)
last_verified: "2026-09-10"
reverify_triggers:
  - A new Python minor/major release reaches general availability (3.15 was in release-candidate stage at research time, GA expected ~October 2026)
  - Any further GC-behavior change within the 3.14.x (or later) bugfix series
  - Free-threaded builds becoming the default (non-opt-in) CPython build
  - A documented shift in major C-extension free-threading compatibility (an incompatible extension silently re-enabling the GIL is currently the norm to check for)

owned_knowledge:
  - Python GIL mechanics and the free-threaded (PEP 703/779) build/runtime-toggle timeline
  - Python sub-interpreter concurrency model (PEP 684/734)
  - Python virtual-environment/packaging mechanics (venv, pyproject.toml)
  - Python exception-chaining semantics (raise ... from, __cause__/__context__/__suppress_context__)
  # Cross-cutting security/performance/testing depth is NOT owned here — referenced, not restated.

decision_framework_present: true

failure_handling:
  - If the Python version (and, for GC-behavior questions, the patch version) cannot be determined, ask for it or explicitly state the version the guidance assumes — never assume "latest" silently (rule VA-3).
  - If shell is unavailable or denied, degrade to advisory code/config output and state that python/pip/venv/profiler commands were not actually run.
  - If it is unknown whether third-party C-extension dependencies are free-threading-compatible, do not recommend a free-threaded build without flagging that audit as a prerequisite.
escalation:
  - Adopting a free-threaded build in an existing production service is a significant, hard-to-reverse-cheaply decision (requires a C-extension compatibility audit) — presented with trade-offs for explicit confirmation, never applied unilaterally.
  - Pinning PYTHONHASHSEED or disabling isolation flags (-I/-P/-E) in production removes a documented DoS/security mitigation — confirmed explicitly before recommending.
verification:
  - Any claim about GIL/free-threading behavior is tagged with the exact version (and patch, where GC behavior is involved) it holds for.
  - A concurrency-model recommendation matches the workload shape (I/O-bound vs. CPU-bound) rather than defaulting to one model.
  - Exception-handling code uses explicit chaining (raise ... from) or documented implicit chaining rather than swallowing the original exception.
  - A packaging change produces a valid pyproject.toml (or documents why an older setup.py/requirements.txt approach is intentionally retained).
evaluation_criteria:
  - For a seeded CPU-bound workload, recommends multiprocessing or a free-threaded build (with the compatibility-audit caveat) rather than defaulting to threading under the standard GIL.
  - For a seeded I/O-bound workload, recommends asyncio or threading rather than reaching for free-threaded builds or sub-interpreters unnecessarily (anti-overengineering).
  - Any claim about a version-gated 3.12/3.13/3.14 feature (free-threading support level, sub-interpreter stdlib exposure, GC behavior, ProcessPoolExecutor default) is correctly scoped to its version/patch range, not presented as universally true.
  - Does not restate generic backend-structure guidance owned by SK-BE-001, or fabricate LLM/agent-application-specific content that belongs to the not-yet-authored SK-AI-001 (rule QR-2).
  - Recommends venv + pyproject.toml for dependency isolation/packaging rather than a shared/system interpreter, unless the existing project already uses another documented approach.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running python/pip/venv/profilers; abstract shell -> CC tools
  cursor:
    paths: ["**/*.py", "pyproject.toml", "requirements*.txt", "setup.py", "setup.cfg"]
  vscode:
    argument_hint: "<task, e.g. 'is free-threading worth adopting here' or 'set up packaging'>"
