id: SK-TECH-python
slug: python
name: Python
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-001, SK-AI-001]   # backend-architecture (authored); llm-application-engineering (forward reference — research-gap, not yet authored in this library)

purpose: >-
  Apply Python correctly and version-appropriately: the GIL and its
  free-threading evolution, sub-interpreters, concurrency-model selection,
  virtual environments/packaging, and exception chaining.
scope: >-
  Python-language-and-runtime engineering detail — the generic backend
  structure method comes from the parent skill (SK-BE-001); Python's role in
  LLM/agent application engineering is owned by SK-AI-001, a forward
  reference not yet authored in this library (a documented research gap, not
  an oversight).
expertise: Python backend/platform engineer.
description: >-
  Python-specific engineering: the GIL and its free-threading evolution (PEP
  703/779), sub-interpreters (PEP 684/734), concurrency-model choice
  (asyncio/multiprocessing vs. free-threaded builds), venv/pyproject.toml
  packaging, and exception chaining (raise...from). Use when the stack is
  Python (pyproject.toml/requirements.txt/setup.py, a .py entrypoint, or the
  task names Python). Not for the generic backend-structure decision
  (backend-architecture) or LLM/agent-application-specific design.

activation_conditions:
  - A pyproject.toml, requirements.txt, setup.py/setup.cfg, or Pipfile is present
  - A Python interpreter/venv is the runtime target (python3/python command, a .py entrypoint)
  - The task names a Python-specific concern (GIL, free-threaded/no-GIL build, sub-interpreters, venv, pip, asyncio, multiprocessing, unittest, exception chaining)
  - A Python version upgrade or version-gated behavior (e.g. 3.12/3.13/3.14 differences) is in question
non_activation_conditions:
  - The stack uses another language/runtime (Node.js, Go, etc.) with no Python component (route to that technology skill)
  - The question is generic backend structure with no language chosen yet (route to SK-BE-001)
  - The task is LLM/agent-application design itself (prompt engineering, RAG, agent orchestration) rather than Python-the-language mechanics (route to SK-AI-001 once authored; currently a documented research gap)
  - Pure data-science/ML modeling questions with no language-mechanics component
activation_mode: auto

inputs:
  - name: task
    description: The Python task (concurrency design, packaging, version upgrade, exception handling, performance profiling).
    required: true
  - name: python-version
    description: The Python version/interpreter in use (python --version, pyproject.toml, container base image, or CI config).
    required: false
required_context:
  - The Python major.minor (and, for GC-behavior claims, patch) version in use — most claims here are version-gated (rule VA-3).
optional_context:
  - Whether C-extension dependencies are in use (relevant to free-threaded-build adoption risk).
  - The existing concurrency approach (asyncio/threading/multiprocessing) if a concurrency change is being considered.

outputs:
  - name: code-or-config-change
    kind: edit
    description: Version-correct Python code, packaging config (pyproject.toml), or interpreter/runtime flags.
  - name: analysis
    kind: analysis
    description: Concurrency-model or version-upgrade recommendation with rationale and the exact version/patch range it applies to.
  - name: commands-run
    kind: command-run
    description: python/pip/venv invocations executed to diagnose or verify, when shell is available.

depends_on_skills: []
# depends_on_skills is reserved for hard composition (invoking another skill
# as a blocking sub-step of this skill's own execution). The relationship to
# SK-BE-001 and SK-AI-001 above is specialization, already fully captured by
# `parents` -- duplicating it into depends_on_skills would conflate the two
# relationship types (spec §2.5; this exact mistake happened in a prior batch
# of this project, see specification.md §2.5 note).
related_skills: []
conflicts_with: [SK-TECH-nodejs, SK-TECH-go]   # alternative backend runtimes/languages for the same service; do not co-activate for the same runtime decision

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Proposing code/config changes is advisory (file-only); running python/pip/
# venv/profilers needs shell. No capability_fallbacks block required (Tier B,
# not C) — degrades to advisory per failure_handling if shell is unavailable.

