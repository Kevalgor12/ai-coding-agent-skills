id: SK-TECH-redis
slug: redis
name: Redis
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-004, SK-BE-004, SK-DATA-005]   # caching-strategy, search-integration, realtime-communication

purpose: >-
  Apply Redis correctly and version-appropriately across its distinct roles —
  in-memory cache, pub/sub messaging, full-text/vector search, and
  general-purpose in-memory data structures — including eviction policy,
  TTL/key-expiration, pipelining, transactions, Cluster/Sentinel topology,
  and ACL/security configuration.
scope: >-
  Redis-specific engineering detail across all of its roles. The generic
  caching-strategy method, realtime-transport selection, and search-engine
  trade-off analysis belong to the parent Layer-3 skills (SK-DATA-004
  caching-strategy, SK-BE-004 realtime-communication, SK-DATA-005
  search-integration). Not generic
  data modeling (SK-DATA-001, related only for basic key-design framing).
expertise: Redis / in-memory data-layer engineer.
description: >-
  Redis-specific data structures, eviction policies, TTL/key expiration,
  pipelining, transactions (MULTI/EXEC/WATCH), pub/sub, Cluster sharding,
  Sentinel HA, ACLs, and the Redis 8.0 licensing/module-bundling change. Use
  when the stack uses Redis (redis:// URL, a Redis client library, or the
  task names caching/pub-sub/search/vector work backed by Redis). Not for
  generic caching strategy, realtime-transport choice, or search-engine
  choice made independent of Redis.

activation_conditions:
  - A redis:// / rediss:// connection string or a Redis client library (redis-py, ioredis, node-redis, Jedis, Lettuce, go-redis, StackExchange.Redis, hiredis, redis-rs, redis-rb) is present
  - The task names Redis or a Redis-specific feature (MULTI/EXEC/WATCH, pub/sub, Redis Cluster, Sentinel, RDB/AOF, ACL SETUSER, FT.SEARCH/RediSearch, vector sets, HyperLogLog)
  - A caching, pub/sub, or search/vector design question has already committed to Redis as the implementation
non_activation_conditions:
  - No Redis dependency exists and the question is an open store-shape or cache-layer choice (route to SK-DATA-001 data-modeling, or SK-DATA-004 caching-strategy)
  - The question is realtime-transport selection independent of Redis, e.g. choosing WebSocket vs. WebRTC vs. SSE (route to SK-BE-004)
  - The question is search-engine selection independent of Redis, e.g. Redis vs. OpenSearch vs. Postgres FTS (route to SK-DATA-005)
activation_mode: auto

inputs:
  - name: task
    description: The Redis task (cache design, pub/sub channel design, search/vector index, data-structure choice, Cluster/Sentinel topology, ACL/security config, version upgrade).
    required: true
  - name: workload-and-topology
    description: Access pattern, data volume, current Redis version, and topology (standalone, Sentinel, Cluster).
    required: false
required_context:
  - The Redis role actually needed (cache vs. pub/sub vs. search/vector vs. general data-structure store) — Redis's multi-role nature means guidance differs materially by role.
  - The Redis major version in use — required for version-correct ACL/licensing/module guidance.
optional_context:
  - Current maxmemory-policy and hit/miss stats (INFO stats / INFO memory).
  - Whether the deployment is standalone, Sentinel, or Cluster.
  - Existing ACL rules, if any, before an 8.0 upgrade.

outputs:
  - name: data-structure-and-key-design
    kind: analysis
    description: Recommended Redis data type(s), key naming/TTL scheme, and eviction-policy choice for the workload.
  - name: config-or-command-change
    kind: edit
    description: redis.conf directives, ACL rules, or command sequences (pipelining, MULTI/EXEC, Cluster bootstrap) implementing the design.
  - name: analysis
    kind: analysis
    description: Role selection (cache/pub-sub/search/data-structure), topology recommendation (standalone/Sentinel/Cluster), and security posture, with rationale and version scope.
  - name: commands-run
    kind: command-run
    description: redis-cli invocations executed to diagnose, configure, or verify, when shell is available.

depends_on_skills: []
related_skills: [SK-DATA-001]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: proposing config/ACL/key-design is advisory (file-only); running
# redis-cli, CONFIG SET, or a Cluster bootstrap needs shell. No
# capability_fallbacks block required (Tier B, not C) — degrades to advisory
# per failure_handling below if shell is unavailable.

