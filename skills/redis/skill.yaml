covered_versions:
  redis: ">=6.0 <=8.x"
version_sensitive_claims:
  - claim: RESP2 has been standard since Redis 2.0; RESP3 has been opt-in since Redis 6.0 (via the HELLO handshake); from Redis 7 onward both RESP2 and RESP3 clients can invoke all core commands, though a command's reply may be typed differently by protocol version.
    applies_to: ">=2.0 (RESP2 standard); >=6.0 (RESP3 opt-in); >=7.0 (both protocols invoke all core commands)"
    source_ref: research/knowledge-maps/version-matrix.md (Redis row); research/technologies/redis.md §3
  - claim: ACLs were introduced in Redis 6 (named users, fine-grained permissions, replacing single-password auth as the recommended method); subcommand-level allow/block syntax (+config|get) and key-pattern read/write scoping (%R~/%W~) arrived in 7.0; comment lines in external ACL files arrived in 8.8.
    applies_to: ">=6.0 (ACLs exist); >=7.0 (subcommand + read/write key-pattern scoping); >=8.8 (comment lines)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/redis.md §7
  - claim: As of Redis 8.0 (May 2025), "Redis Community Edition" was renamed "Redis Open Source" and the license changed from the prior BSD-3-Clause/dual-license arrangement to a tri-license choice (RSALv2, SSPLv1, or AGPLv3). Versions 7.4 and 7.2 remain on RSALv2/SSPLv1 (no AGPL option); 7.2 and earlier were BSD-3-Clause. Standalone RediSearch/RedisJSON/RedisTimeSeries/RedisBloom modules were bundled into core Redis as of 8.0.
    applies_to: ">=8.0 (naming, tri-license, module bundling); 7.2 and 7.4 (RSALv2/SSPLv1 dual-license only); <=7.2 (BSD-3-Clause)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/redis.md (Naming/licensing note; §1; §13)
  - claim: "Breaking change: as of Redis 8.0, the @read/@write/@dangerous/@admin/@slow/@fast ACL categories now include Redis Search, JSON, time-series, Bloom, Cuckoo, Top-K, count-min-sketch, and t-digest commands that they previously excluded — silently widening rules like +@read (now also grants FT.SEARCH) and narrowing rules like +@all -@write (now also excludes JSON.SET). Existing ACL rules require re-analysis before upgrading."
    applies_to: ">=8.0"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/redis.md §7, §13
  - claim: A minimal working Redis Cluster requires at least 3 master nodes; production deployments are recommended to use 6 nodes (3 masters + 3 replicas).
    applies_to: "documented for current Redis Cluster; no version gate stated in the source research"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/redis.md §2
  - claim: The officially documented Kubernetes path is the Redis Enterprise operator, which targets CNCF-conformant Kubernetes specifically; no official Redis Open Source (non-Enterprise) Kubernetes deployment path was found in the source research.
    applies_to: "current, as of research date 2026-09-09"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/redis.md §10
  - claim: The acl-pubsub-default setting defaulted to allchannels through Redis 6.0 (and for new users created under 6.2, for backward compatibility), then flipped to resetchannels starting in Redis 7.0 "to provide better security" — a security-hardening default change spanning three version boundaries that can silently change Pub/Sub access for newly created ACL users depending on upgrade path.
    applies_to: "<=6.0 and 6.2-created users: allchannels; >=7.0: resetchannels"
    source_ref: research/technologies/redis.md §13
  - claim: Vector sets were introduced as a preview feature in Redis 8.0.0; the LRM (Least Recently Modified) eviction policy (allkeys-lrm) was introduced in Redis 8.6.
    applies_to: ">=8.0 (vector sets, preview status); >=8.6 (allkeys-lrm)"
    source_ref: research/technologies/redis.md §1, §5, summary table
last_verified: "2026-09-09"
reverify_triggers:
  - A new Redis major version release beyond the 8.x line documented here
  - Any change to the documented ACL category-to-command mapping (further widening/narrowing of @read/@write/@dangerous/@admin/@slow/@fast)
  - Redis Open Source gaining an official (non-Enterprise) Kubernetes deployment path
  - Vector sets graduating out of preview status
  - A licensing change superseding the 8.0 tri-license (RSALv2/SSPLv1/AGPLv3)

owned_knowledge:
  - Redis in-memory data-type selection (strings/hashes/sets/sorted sets/streams/probabilistic types/vector sets) for a given access pattern
  - Redis eviction-policy selection (maxmemory-policy) and TTL/key-expiration design
  - Redis transaction (MULTI/EXEC/WATCH) and pipelining mechanics
  - Redis Cluster sharding/hash-slot design and Sentinel HA topology
  - Redis ACL rule syntax and the 8.0 ACL-category-widening upgrade hazard
  # Cross-cutting caching-strategy method, realtime-transport selection, and
  # search-architecture trade-offs are NOT owned here — they are deferred to
  # the parent skills SK-DATA-004/SK-BE-004/SK-DATA-005.

decision_framework_present: true

failure_handling:
  - If the Redis role needed (cache vs. pub/sub vs. search/vector vs. general data-structure store) is unclear, ask rather than assuming cache — Redis's multi-role nature means the wrong assumption produces materially wrong guidance.
  - If the Redis major version cannot be determined, ask for it or explicitly state the version the guidance assumes — never assume "latest" silently (rule VA-3); flag the 8.0 licensing/ACL-widening boundary specifically since it changes both legal and security posture.
  - If shell is unavailable or denied, degrade to advisory redis.conf/ACL/command output and state that nothing was actually run against a live instance.
escalation:
  - Adopting Redis Cluster (rather than a single instance, or single instance plus Sentinel) is confirmed with the user before being treated as decided — it is a materially more complex, harder-to-reverse operational commitment (see Anti-patterns).
  - Upgrading a deployment across the Redis 8.0 boundary while custom ACL rules exist is flagged for explicit user re-analysis of those rules before the upgrade proceeds, per the documented breaking change.
  - A licensing choice among RSALv2/SSPLv1/AGPLv3 (8.0+) that affects legal/compliance posture is presented with the trade-offs for user confirmation, not decided silently.
verification:
  - The recommended Redis role (cache/pub-sub/search/data-structure) matches the actual stated need, not defaulted to "cache" by habit.
  - The chosen eviction policy and TTL scheme are justified against the workload's access pattern, not left at a config default without comment.
  - Every version-specific claim (ACL widening, licensing, RESP, Cluster topology) is tagged with the range it holds for.
  - If Redis Cluster is recommended, the workload actually needs more RAM/throughput than one instance can provide, and the minimum-3-master topology is stated.
  - ACL rules for FLUSHALL/FLUSHDB/SWAPDB are explicitly addressed when a user is scoped to a key pattern (whole-keyspace commands are not covered by pattern scoping).
  - The chosen eviction policy is confirmed by actually running `CONFIG GET maxmemory-policy` (or observing real eviction behavior under load) against the target instance, not assumed from the recommendation alone.
evaluation_criteria:
  - For a seeded workload, selects the correct Redis role(s) (cache vs. pub/sub vs. search/vector vs. plain data structure) and does not recommend Redis Cluster when a single instance (optionally with Sentinel) suffices.
  - For a seeded cache scenario, chooses a defensible maxmemory-policy and TTL scheme with rationale tied to the access pattern.
  - For a seeded pre-8.0-upgrade scenario with custom ACL rules, flags the @read/@write/etc. category-widening breaking change and requires re-analysis before upgrade.
  - Any version-gated claim (ACL syntax, RESP, licensing, eviction policy) is correctly scoped to the range it applies to.
  - Does not restate generic caching-strategy, realtime-transport, or search-architecture method that belongs to the parent skills (anticipates rule QR-2).

