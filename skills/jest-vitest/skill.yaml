covered_versions:
  jest: ">=27 <=30.5"
  vitest: ">=3.2 <=5.0"
version_sensitive_claims:
  - claim: >-
      Default test runner became jest-circus (previously jest-jasmine2);
      testEnvironment default changed jsdom -> node; fake timers default
      changed legacy -> modern.
    applies_to: "jest >=27"
    source_ref: research/technologies/jest.md §2/§4/§13 (jestjs.io/blog/2021/05/25/jest-27)
  - claim: >-
      Dropped Node.js 14, 16, 19, 21 (engines now
      ^18.14.0 || ^20.0.0 || ^22.0.0 || >=24.0.0); minimum TypeScript raised
      to 5.4; jest-environment-jsdom upgraded jsdom 21 -> 26 (spec-compliance
      changes, e.g. window.location mocking behavior); --testPathPattern
      renamed --testPathPatterns (now multi-pattern); removed deprecated
      expect matcher aliases (toBeCalled, toBeCalledWith, etc.) present
      through v29; glob dependency bumped to v10 with stricter
      brace-expansion/extglob handling that can change testMatch/
      moduleNameMapper matching behavior.
    applies_to: "jest v30 (30.0.0-30.5.1)"
    source_ref: research/technologies/jest.md §12/§13 (jestjs.io/blog/2025/06/04/jest-30, registry.npmjs.org/jest); research/knowledge-maps/version-matrix.md
  - claim: >-
      ESM automocking and __mocks__-directory mocks only apply starting at
      Node v24.9+; native ESM support overall remains experimental, gated
      behind Node's --experimental-vm-modules flag.
    applies_to: "jest ecmascript-modules support, current through v30"
    source_ref: research/technologies/jest.md §14 (jestjs.io/docs/ecmascript-modules)
  - claim: >-
      Vitest 5.0 requires Vite >=6.4.0 and Node.js >=22.12.0; older versions
      are "unsupported and may cause unexpected errors."
    applies_to: "vitest 5.0"
    source_ref: research/technologies/vitest.md §1/§11 (vitest.dev/guide/, vitest.dev/guide/migration.html); research/knowledge-maps/version-matrix.md
  - claim: >-
      Security patches are backported only to the current stable minor
      (vitest@5.0) and the immediately preceding minor (vitest@4.1); older
      versions receive no further security fixes.
    applies_to: "vitest 4.1 and 5.0 only, as of the 5.0 release"
    source_ref: research/technologies/vitest.md §7/§12 (vitest.dev/releases.html)
  - claim: >-
      V8 coverage-provider report accuracy is "as good as with Istanbul"
      specifically since v3.2.0 — a version-sensitive parity claim, not
      necessarily true of earlier V8-provider versions.
    applies_to: "vitest >=3.2.0"
    source_ref: research/technologies/vitest.md §8 (vitest.dev/guide/coverage.html); research/knowledge-maps/version-matrix.md
  - claim: The `workspace` config key was deprecated in favor of `projects` (functionally equivalent).
    applies_to: "vitest >=3.2"
    source_ref: research/technologies/vitest.md §11/§13 (vitest.dev/guide/workspace.html)
  - claim: "New APIs: `vi.when()` for conditional mocking with deep-equality/asymmetric-matcher argument matching, and `toHaveBeenExhausted()` to verify all registered vi.when() behaviors were consumed."
    applies_to: "vitest 5.0"
    source_ref: research/technologies/vitest.md §3 (vitest.dev/blog/vitest-5.html)
  - claim: Fake timers also mock the Temporal API, via @sinonjs/fake-timers v15.4.
    applies_to: "vitest 5.0"
    source_ref: research/technologies/vitest.md §11 (vitest.dev/guide/migration.html)
  - claim: >-
      Browser Mode requires ES modules, dynamic imports, and BroadcastChannel
      support; minimum browsers Chrome >=87, Firefox >=79, Safari >=15.4,
      Edge >=88.
    applies_to: "vitest browser mode, current through v5.0"
    source_ref: research/technologies/vitest.md §14 (vitest.dev/guide/browser/)
last_verified: "2026-09-10"
reverify_triggers:
  - A new Jest major release past v30
  - A new Vitest major release past v5.0, or a v5.x/v6.x security-backport-window change
  - A change to Node's --experimental-vm-modules ESM gating in Jest, or to Node's own ESM stability
  - A change to which framework docs (Next.js, Vue, Angular, Nuxt, Mongoose, Prisma) recommend which runner

owned_knowledge:
  - Jest/Vitest mocking, spying, and snapshot-testing API mechanics
  - Jest v27/v30 and Vitest v3.2/v5.0 version-gated breaking changes
  - The Jest-vs-Vitest decision framework grounded in framework-specific official guidance
decision_framework_present: true

failure_handling:
  - If neither the runner nor its version is known, ask, or state the covered_versions range the guidance assumes — Jest's v27/v30 defaults and Vitest's v3.2/v5.0 behavior differ materially enough to make "current" guidance wrong for an older pin.
  - If the task is choosing a runner and the framework already in the stack has documented official guidance (Mongoose, Prisma, Vue, Angular, Nuxt, Next.js), surface that guidance rather than defaulting to a personal preference.
  - If shell is unavailable, degrade to advisory test/config output and say the suite was not actually run.
verification:
  - Any Jest/Vitest API, config key, or CLI flag stated is one that actually appears in a cited source, not inferred from the other tool's equivalent.
  - Any version-specific claim is tagged with the Jest or Vitest range it holds for.
  - Snapshot assertions are paired with deterministic setup (mocked clocks/IDs or property matchers) rather than asserting on non-deterministic output.
evaluation_criteria:
  - For a seeded project with a framework that has documented runner guidance (e.g. Mongoose, Prisma, Vue), recommends the runner consistent with that framework's own official docs, not a blanket default.
  - Given a Jest v29-era suite being evaluated against v30, correctly flags at least the Node/TypeScript floor change, the removed matcher aliases, and the glob-matching behavior change as relevant risks.
  - Given a Vitest config predating v5.0, correctly flags the clearMocks-default change and the vi.mock()/vi.hoisted() module-scope-only restriction as relevant migration risks.
  - Does not restate testing-strategy's general layer-selection, fixture-isolation, or snapshot-tension content — only adds Jest/Vitest implementation depth.

adapter_hints: {}
