id: SK-TECH-jest-vitest
slug: jest-vitest
name: Jest & Vitest
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-QA-001]   # testing-strategy

purpose: >-
  Apply Jest and/or Vitest correctly and version-appropriately for
  unit/component/snapshot testing in JavaScript/TypeScript projects — mocking,
  fake timers, snapshots, coverage, and the choice between the two runners.
scope: >-
  Jest- and Vitest-specific API, configuration, CLI, and version behavior.
  Merged into one skill because they are a choose-one decision with a
  near-identical API surface (Vitest is explicitly designed as a
  Jest-compatible drop-in), not two unrelated tools. Specializes
  testing-strategy (generic layer selection, fixture isolation, the
  snapshot-testing tension — not repeated here). Not test-layer strategy
  itself (testing-strategy) or browser/E2E automation (playwright).
expertise: JavaScript/TypeScript test engineer who has run both runners in production CI.
description: >-
  Jest- and Vitest-specific mocking/spying, snapshot testing, fake timers,
  coverage providers, and the Jest-vs-Vitest choice, including version-gated
  breaking changes (Jest v27/v30, Vitest v3.2/v5.0). Use when the stack uses
  Jest or Vitest, or the task is choosing between them. Not for test-layer
  strategy (testing-strategy) or browser/E2E automation (playwright).

activation_conditions:
  - The `jest` or `vitest` npm package is a dependency, or config files (`jest.config.*`, `"jest"` in package.json, `vitest.config.*`) are present
  - Code imports Jest globals/`@jest/globals` or the Vitest `vi`/`vitest` APIs
  - The task names Jest or Vitest, or asks to choose between them for a project
non_activation_conditions:
  - The task is deciding which test layer(s) to write at all, independent of tool (route to testing-strategy)
  - The task is browser/E2E/visual automation via Playwright with no Jest/Vitest unit layer in question (route to playwright)
  - The project uses Mocha/AVA/node:test/pytest with no Jest/Vitest involvement
activation_mode: auto

inputs:
  - name: task
    description: The Jest/Vitest-mediated task (writing/mocking tests, snapshot config, fake timers, coverage setup, migrating between the two, or choosing one).
    required: true
  - name: runner-and-version
    description: Which runner is (or would be) used and its pinned version/range — needed for version-correct guidance (Jest v27/v30 defaults, Vitest v3.2/v5.0 behavior).
    required: false
required_context:
  - Confirmation of which runner is in use, or that the task is the Jest-vs-Vitest choice itself
optional_context:
  - The framework/ORM already in the stack (Vue/Angular/Nuxt/Next.js/Mongoose/Prisma) — several have documented, framework-specific runner guidance that should inform the choice.

outputs:
  - name: test-code
    kind: edit
    description: Jest/Vitest test files, mocks, fixtures, or config changes.
  - name: runner-choice
    kind: analysis
    description: A Jest-vs-Vitest recommendation grounded in the stack's own official guidance, with rationale and the version it applies to.
  - name: migration-notes
    kind: analysis
    description: Concrete API/config diffs when moving a suite between Jest and Vitest.

depends_on_skills: []
# depends_on_skills is reserved for hard composition (invoking another skill
# as a blocking sub-step of this skill's own execution). The relationship to
# testing-strategy is specialization, already captured by `parents` above --
# duplicating it here would be redundant and would assert a stronger
# (blocking-invocation) claim than specialization actually is. Per spec
# §2.5, left empty.
related_skills: [SK-TECH-playwright]
conflicts_with: []
# Jest and Vitest are merged into this one skill precisely because they are a
# choose-one decision with a near-identical API surface, not two conflicting
# tools -- so conflicts_with stays empty rather than listing either against
# the other.

required_capabilities: [file-read, file-write, shell]
execution_tier: B

