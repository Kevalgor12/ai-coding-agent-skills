id: SK-AI-008
slug: ai-security
name: AI Security
spec_version: "1.0"
skill_version: "0.1.0"
kind: generic
layer: 3
domain: AI

purpose: >-
  Defend LLM-powered applications against threat classes specific to or
  meaningfully amplified by LLM use — prompt injection, excessive agency,
  sensitive-information disclosure via model/embedding channels, and
  LLM-specific supply-chain risk.
scope: >-
  LLM-specific security, grounded directly in the OWASP GenAI LLM Top 10
  (2026). Genuinely distinct from security-engineering (SK-QA-002), which
  owns traditional AppSec. Prompt injection has no architectural equivalent
  to a parameterized-query code/data boundary, and the standard itself
  states "no reliable prevention mechanism exists today" — so this skill
  frames defense as bounding blast radius rather than promising prevention.
expertise: Senior/principal AI/LLM security engineer, grounded in the OWASP GenAI LLM Top 10.
description: >-
  Defend LLM-powered applications against threats specific to or amplified
  by LLM use — prompt injection, excessive agency, sensitive-info
  disclosure, LLM-specific supply-chain risk — grounded in the OWASP GenAI
  LLM Top 10 (2026). Frames defense as bounding blast radius, not
  prevention: no reliable prompt-injection prevention exists today. Use
  reviewing/designing an LLM feature with tool access, untrusted-content
  ingestion, or user exposure. Traditional AppSec routes to
  security-engineering.

activation_conditions:
  - Reviewing or designing an LLM feature with tool access, untrusted-content ingestion, or user-facing exposure
  - A security review of an LLM-powered system is explicitly requested
  - Deciding how much an LLM agent should be trusted/authorized to do on its own
  - Assessing LLM-specific supply-chain risk (model/adapter provenance, quantization-introduced behavior changes)
non_activation_conditions:
  - A traditional (non-LLM-specific) AppSec concern with no LLM-specific amplification — route to security-engineering
  - The request is specifically about authentication/authorization design with no LLM dimension — route to authentication-authorization
activation_mode: auto

inputs:
  - name: llm-feature-or-system
    description: The LLM feature/system and its tool/data access surface.
    required: true
  - name: threat-context
    description: What untrusted content the system ingests, what actions/tools it can invoke, and who is exposed to it.
    required: false
outputs:
  - name: threat-assessment
    kind: analysis
    description: Identified risks mapped to the applicable OWASP LLM Top 10 (2026) categories.
  - name: mitigations
    kind: edit
    description: Blast-radius-bounding mitigations applied or proposed, matched to each identified risk, stated without overclaiming completeness.

depends_on_skills: []
related_skills: [SK-AI-001, SK-QA-002, SK-AI-004, SK-AI-005]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B

grounding: official-docs
