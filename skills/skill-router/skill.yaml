owned_knowledge:
  - Default-deny skill-selection method — a skill is excluded unless its activation matches and the task type needs it
  - The exclusion-record discipline (the explicit complement, with a reason per exclusion class) that makes a minimum-set claim auditable
  - Routing-time task classification — intent, task type, complexity, and risk class as the four values that drive selection, gating, and discovery depth
  - Detection-gated technology activation and conflict-cluster resolution for the artifact under change
decision_framework_present: true

failure_handling:
  - If intent is genuinely ambiguous on a non-trivial task, escalate to requirements-engineering or the user before selecting any build skill — never route on a guess.
  - If a required conflict-cluster choice is undetectable from the repository, activate the generic Layer-3 skill and raise the choice as a decision rather than activating every sibling.
  - If a candidate skill exists only as a taxonomy catalog entry and has not been authored, record the gap and route to the nearest authored skill — never plan an unauthored skill as if it existed.
  - If the repository signal scan is unavailable, route on the request text alone and state that technology detection was not possible rather than assuming a stack.
verification:
  - Every excluded skill or exclusion class carries a stated reason — the complement is produced explicitly, never as a silent omission.
  - No technology skill is activated for a technology absent from the repository and unnamed in the request.
  - Every required stage of the chosen workflow pattern is staffed by some selected skill, and any completeness-backstop addition is recorded with the stage it staffed.
  - No skill is selected whose non-activation conditions match the task's signals.
  - Selection used name, description, and activation/non-activation metadata only — no skill body was loaded to decide whether to select it.
escalation:
  - Genuine intent ambiguity on a non-trivial or high-stakes task escalates to requirements-engineering or the user before any build skill is selected.
  - A required technology choice that cannot be resolved by detection escalates to solution-architecture as an open decision.
  - A dependency cycle or an upward layer edge discovered while ordering escalates as a library defect rather than being silently broken.
evaluation_criteria:
  - On seeded multi-domain tasks, selects the expected skill set with no missing essential skill and no more than a stated bound of spurious selections.
  - Correctly detects the stack in play from dependency manifests, config files, and imports, and activates no technology skill for an undetected technology.
  - Produces an exclusion record with a reason for every exclusion class, including the unrelated-domain skills a naive keyword match would have pulled in.
  - On an ambiguous request, escalates for clarification instead of selecting a speculative skill set.
  - On a trivial single-owner task, selects one skill and suppresses the rest of the orchestration layer.

