id: SK-ORCH-001
slug: skill-router
name: Skill router
spec_version: "1.0"
skill_version: "0.1.0"
kind: generic
layer: 0
domain: ORCH

purpose: >-
  Read an incoming task and determine which skills apply, in what order —
  activating the minimum correct set and recording, with reasons, everything
  it excluded.
scope: >-
  Intent classification, stack detection from repository signals, and
  default-deny skill selection with an explicit exclusion record. Produces a
  routing plan; does none of the domain work itself. Does not choose a
  technology (that is solution-architecture, SK-DISC-002) — it detects which
  one is already in use. Does not decompose work into tasks (technical-planning,
  SK-DISC-003) or stage a multi-skill workflow (workflow-composer, SK-ORCH-003),
  and does not resolve host capabilities (capability-adapter, SK-ORCH-002).
expertise: >-
  Principal engineer with skill-library routing and context-budget discipline.
description: >-
  Select the minimum correct skill set for a task: parse intent, detect the
  stack from repository signals, apply default-deny selection, and record every
  exclusion with its reason. Use when a task spans more than one domain, or the
  right skill set is non-obvious. Not for a task one skill clearly owns
  (routing overhead is waste), and not for choosing a technology or planning
  the work itself.

activation_conditions:
  - A task spans more than one domain
  - The correct skill set for a task is non-obvious
  - A stated task's intent, scope, or risk level needs classifying before work begins
  - Evidence found mid-run suggests the active skill set is wrong or incomplete
non_activation_conditions:
  - A single, unambiguous skill clearly owns the task — let it trigger directly
  - The request is to choose between technologies rather than detect which is in use (route to solution-architecture)
  - The request is to break agreed work into ordered tasks (route to technical-planning) or to stage a multi-skill workflow (route to workflow-composer)
activation_mode: auto

inputs:
  - name: task-statement
    description: The user's request, verbatim.
    required: true
  - name: repository-signals
    description: Dependency manifests, config files, driver imports, connection strings, and file types present — the bounded scan, not a full repository read.
    required: false
  - name: user-constraints
    description: Constraints the user stated on how the work is done, which must survive routing unmodified.
    required: false
outputs:
  - name: routing-plan
    kind: analysis
    description: The selected skills with the reason each was included, ordered by prerequisite, annotated where parallel-safe, with review facets and approval gates surfaced up front.
  - name: exclusion-record
    kind: analysis
    description: The explicit complement — what was not activated and why, by skill or exclusion class — which is what makes the minimum-set claim auditable.

