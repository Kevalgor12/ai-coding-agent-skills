id: SK-TECH-react
slug: react
name: React
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-001, SK-FE-005]   # frontend-architecture; rendering-strategy

purpose: >-
  Apply React correctly and version-appropriately: the hooks API, component
  composition, reconciliation, and React Server Components mechanics — for
  the React version actually in use.
scope: >-
  React-specific implementation detail. The generic component/state-management
  method comes from the parent skill (SK-FE-001, frontend-architecture,
  already authored); the broader SSR/SSG/CSR rendering-mode decision comes
  from SK-FE-005 (rendering-strategy — this
  skill covers the RSC Server/Client Component split once RSC is already in
  scope, not the general rendering-mode choice). The React-vs-Vue-vs-Angular
  framework choice itself is owned by SK-FE-001 and is not repeated here.
expertise: React engineer.
description: >-
  React-specific hooks API, component composition, reconciliation, and React
  Server Components mechanics (RSC, "use client"/"use server", Server
  Functions). Use when the stack is React (react/react-dom in package.json,
  JSX/TSX files, or a React-based meta-framework). Not for the React vs. Vue
  vs. Angular choice (frontend-architecture) or Next.js-specific
  routing/caching (SK-TECH-nextjs).

activation_conditions:
  - react and/or react-dom are dependencies in package.json, or JSX/TSX files are present
  - The task names a React-specific API or concept (hooks, useState/useEffect, Server Components, "use client"/"use server", React Compiler, reconciliation)
  - A React-based meta-framework (Next.js, React Router, Expo, TanStack Start) is in use and the question concerns React itself, not the meta-framework's own routing/caching layer
non_activation_conditions:
  - The framework choice is still open (route to SK-FE-001, frontend-architecture)
  - The stack uses Vue or Angular (route to SK-TECH-vue / SK-TECH-angular)
  - The question is Next.js-specific routing/caching/App Router mechanics with no underlying React question (route to SK-TECH-nextjs)
  - Generic component/state-structure decisions independent of React's own API (route to SK-FE-001)
activation_mode: auto

inputs:
  - name: task
    description: The React task (hooks usage, component composition, Server/Client Component boundary design, performance, migration).
    required: true
  - name: existing-code
    description: Existing React components/hooks, or package.json showing the installed react/react-dom version.
    required: false
required_context:
  - The React major/minor version in use (from package.json) — needed for version-correct guidance, especially the RSC CVE ranges (rule VA-3).
optional_context:
  - Whether React Server Components are in scope (meta-framework with RSC support configured).
  - Whether the React Compiler is adopted (changes manual-memoization guidance).
  - Whether the project uses TypeScript (changes prop-typing and useReducer/useRef typing guidance).

outputs:
  - name: component-or-hook-code
    kind: edit
    description: Component/hook implementation following the Rules of React and idiomatic composition for the version in use.
  - name: rsc-boundary-design
    kind: analysis
    description: Recommendation on Server Component vs. Client Component placement, when RSC is in scope.
  - name: analysis
    kind: analysis
    description: Recommendations (memoization strategy, version-correct API usage, CVE-exposure check) with rationale and the React version they apply to.

depends_on_skills: []
related_skills: [SK-TECH-nextjs, SK-TECH-typescript]
conflicts_with: [SK-TECH-vue, SK-TECH-angular]

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Proposing component/hook code is advisory (file-only); running install/build/
# test commands (e.g. codemods, npm install --save-exact) needs shell. No
# capability_fallbacks block required (Tier B, not C) — degrades to advisory
# per failure_handling if shell is unavailable.

