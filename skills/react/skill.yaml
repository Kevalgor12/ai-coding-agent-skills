covered_versions:
  react: ">=19.0 <=19.2"
version_sensitive_claims:
  - claim: >-
      CVE-2025-55182 (CVSS 10.0, unauthenticated RCE in RSC Server Function
      payload deserialization) affected react-server-dom-webpack,
      react-server-dom-parcel, and react-server-dom-turbopack at versions
      19.0, 19.1.0, 19.1.1, and 19.2.0. Fixed in 19.0.1, 19.1.2, and 19.2.1.
    applies_to: "vulnerable: 19.0(.0), 19.1.0-19.1.1, 19.2.0 — fixed: 19.0.1, 19.1.2, 19.2.1"
    source_ref: research/technologies/react.md §7; research/knowledge-maps/version-matrix.md
  - claim: >-
      Follow-up CVE-2026-23864 (High, CVSS 7.5, DoS) disclosed 8 days later:
      the initial Dec-3 patch was incomplete. Newly vulnerable ranges:
      19.0.0-19.0.3, 19.1.0-19.1.3, 19.2.0-19.2.3 across the same three
      react-server-dom-* packages. Actually fixed in 19.0.4, 19.1.5, 19.2.4 —
      apps already on the Dec-3 patch versions (19.0.3/19.1.4/19.2.3) were
      still vulnerable and needed to update again.
    applies_to: "vulnerable: 19.0.0-19.0.3, 19.1.0-19.1.3, 19.2.0-19.2.3 — fixed: 19.0.4, 19.1.5, 19.2.4"
    source_ref: research/technologies/react.md §7, §13; research/knowledge-maps/version-matrix.md
  - claim: React Compiler works best with React 19; also supports React 17 and 18 via the react-compiler-runtime package plus a minimum-target-version compiler config.
    applies_to: "compiler support: >=17 <=19 (best on 19)"
    source_ref: research/technologies/react.md §4; research/knowledge-maps/version-matrix.md
  - claim: Upgrading to React 19 requires installing react@^19.0.0 react-dom@^19.0.0 plus matching @types/react/@types/react-dom, with --save-exact.
    applies_to: "18 -> 19 migration"
    source_ref: research/technologies/react.md §11; research/knowledge-maps/version-matrix.md
  - claim: The official 18→19 migration first requires upgrading to the final React 18.3 release, specifically to surface 19-relevant deprecation warnings before jumping to 19.
    applies_to: "18.3 -> 19"
    source_ref: research/technologies/react.md §11; research/knowledge-maps/version-matrix.md
  - claim: act() moved from react-dom/test-utils into the react package itself as of React 19 (import {act} from 'react'), with a provided codemod.
    applies_to: ">=19.0"
    source_ref: research/technologies/react.md §9
  - claim: The useId-generated prefix changed from :r:/«r» to _r_ in React 19.2, which can break snapshot tests asserting on generated IDs.
    applies_to: ">=19.2"
    source_ref: research/technologies/react.md §3, §13
last_verified: "2026-09-10"
reverify_triggers:
  - A new React major release (20.x) or a new minor (19.3+) ships
  - Any new react-server-dom-* CVE disclosure, or a further incomplete-patch follow-up to CVE-2025-55182/CVE-2026-23864
  - react.dev changes its official unit-test-runner recommendation (currently none, pointing at @testing-library/react)
  - The React Compiler's stable status, default-on-ness, or SWC-integration status changes

owned_knowledge:
  - React hooks API and the Rules of React (purity, top-level-only call rules, custom-hook composition)
  - React Server Components mechanics (RSC/RSF, "use client"/"use server", client/server boundary semantics)
  - React's reconciliation model (position-in-tree identity, key-based override)
  - React Compiler auto-memoization behavior and incremental-adoption guidance
  # The React-vs-Vue-vs-Angular security/compiler/testing comparison is owned
  # by SK-FE-001 (frontend-architecture) and is referenced, not restated.

decision_framework_present: true

failure_handling:
  - If the installed React version can't be determined, ask or explicitly state the version the guidance assumes — never assume "latest" silently, especially given the RSC CVEs (rule VA-3).
  - If shell is unavailable or denied, degrade to advisory code/diff output and state that install/codemod/build/test commands were not actually run.
  - If it's unclear whether a component needs interactivity, default to treating it as a Server Component and only add "use client" once a documented client-only capability (state, effects, browser-only APIs, event handlers) is actually needed.
escalation:
  - An app found running react-server-dom-* versions inside the CVE-2025-55182 or CVE-2026-23864 vulnerable ranges is flagged immediately as a security issue requiring an upgrade, not treated as a routine version-bump suggestion.
  - A React major-version migration (e.g. 18→19) affecting a production app is presented with the documented breaking-change list for confirmation, not applied unilaterally.

verification:
  - Hooks are called only at the top level — never conditionally, in a loop, or after an early return (Rules of Hooks).
  - Any dangerouslySetInnerHTML usage traces to a trusted or already-sanitized source and is constructed near where the HTML is produced, not inline at the JSX call site.
  - Any react-server-dom-* version referenced is checked against the CVE-2025-55182 / CVE-2026-23864 fixed-version list above.
  - Every version-specific claim carries the React range it holds for.
  - Rules-of-Hooks compliance is confirmed by actually running the linter (`eslint-plugin-react-hooks`) against the code, not just read for conditional call sites.

evaluation_criteria:
  - For a seeded component task, produced hooks usage follows the Rules of React (top-level calls, pure render) and the "You Might Not Need an Effect" decision tree (Effect vs. event handler vs. derived-during-render value).
  - For a seeded RSC-relevant scenario, correctly places the Server/Client Component boundary and does not mark a component "use client" without a documented client-only need.
  - Flags any react-server-dom-* version in the CVE-2025-55182 or CVE-2026-23864 vulnerable ranges as a required upgrade, citing the exact fixed version.
  - Does not restate the React-vs-Vue-vs-Angular comparison owned by SK-FE-001 (rule QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running codemods/npm install/tests; abstract shell -> CC tools
  cursor:
    paths: ["**/*.jsx", "**/*.tsx"]
  vscode:
    argument_hint: "<task, e.g. 'extract this into a custom hook' or 'decide if this needs to be a Client Component'>"
