id: SK-TECH-prisma
slug: prisma
name: Prisma
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-002, SK-DATA-006]   # orm-integration, data-migration

purpose: >-
  Apply Prisma correctly and version-appropriately — schema-driven client
  generation, Prisma Migrate, driver-adapter/Rust-free architecture, and the
  v6/v7/v8(RC) transition, including the current MongoDB support gap.
scope: >-
  Prisma-specific mechanics: the schema file to generated-client model, Prisma
  Migrate CLI/workflow, driver adapters and the Rust-free architecture, and
  version-gated behavior across v6 (MongoDB), v7 (current stable), and v8
  (release-candidate, not GA). Generic ORM patterns (N+1 mitigation,
  transaction handling, ORM selection) are owned by orm-integration; migration
  safety mechanics (expand/contract, backfill batching, rollback discipline)
  are owned by data-migration. This skill assumes Prisma has already been
  chosen and focuses on using it correctly for the pinned major version.
expertise: TypeScript/Node.js engineer who ships and upgrades Prisma-backed services in production.
description: >-
  Prisma's schema-to-generated-client model, Prisma Migrate, driver
  adapters/Rust-free architecture, and the v6-vs-v7-vs-v8(RC) version split —
  critically, MongoDB is unsupported in v7. Use when the stack has a
  schema.prisma/prisma.config.ts file, @prisma/client, or the task names
  Prisma. Not for other ORMs, generic ORM patterns (orm-integration), or
  migration safety mechanics (data-migration).

activation_conditions:
  - A schema.prisma file, a prisma/schema/ directory, or a prisma.config.ts file is present
  - "@prisma/client or a @prisma/adapter-* package is a project dependency"
  - The task names Prisma, Prisma Migrate, Prisma Client, or Prisma Postgres/Accelerate/Compute
non_activation_conditions:
  - The stack uses a different ORM/ODM (Drizzle, TypeORM, Mongoose) with no Prisma present (route to that skill)
  - Generic, ORM-agnostic patterns (N+1 mitigation across ORMs, ORM selection itself) not specific to Prisma's API (route to SK-DATA-002 orm-integration)
  - Migration safety mechanics (expand/contract, backfill batching, rollback discipline) independent of Prisma's own CLI/tooling shape (route to SK-DATA-006 data-migration)
activation_mode: auto

inputs:
  - name: task
    description: The Prisma-specific task (schema design, client query, migration authoring, driver-adapter/config setup, version upgrade).
    required: true
  - name: schema-and-version
    description: The existing schema.prisma/prisma.config.ts and the pinned Prisma major version (from package.json/lockfile).
    required: false
required_context:
  - The Prisma major version in use (v6, v7, or a v8 release candidate) — architecture, CLI shape, config, and MongoDB support all differ materially by major version.
optional_context:
  - Which database provider is targeted (this gates MongoDB-on-v7 eligibility specifically).
  - Deployment target (traditional server vs. serverless/edge) — affects client instantiation and driver-adapter choice.

outputs:
  - name: schema-or-client-code
    kind: edit
    description: schema.prisma/prisma.config.ts changes or Prisma Client query code, version-correct for the pinned major.
  - name: migration-script
    kind: edit
    description: A Prisma Migrate migration (or advisory migration plan) reflecting the pinned major version's CLI/config shape.
  - name: analysis
    kind: analysis
    description: Version/architecture recommendations (e.g. v6-vs-v7 given a MongoDB store, driver-adapter setup) with rationale.

depends_on_skills: []
# Policy fix (2026-09-09, applied consistently with the solution-architecture
# fix from the DISC-domain batch): depends_on_skills is reserved for hard
# composition (invoking another skill as a blocking sub-step of this skill's
# own execution). The relationship to the generic parent skill(s) above is
# specialization, already fully captured by the `parents` field -- duplicating
# it into depends_on_skills was redundant and conflated the two relationship
# types. Cleared here; parents is the single source of truth for this edge.
related_skills: [SK-TECH-postgresql, SK-TECH-mysql, SK-TECH-mongodb]
conflicts_with: [SK-TECH-drizzle, SK-TECH-typeorm, SK-TECH-mongoose]

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: proposing schema/client/migration edits is advisory; running `prisma
# generate`/`migrate`/`db push` needs shell. No capability_fallbacks block
# required (Tier B, not C) — degrades to advisory per failure_handling below.

