covered_versions:
  prisma-v6: "required when the target store is MongoDB — v7 dropped MongoDB support outright"
  prisma-v7: "stable, current production recommendation for every non-MongoDB supported database"
  prisma-v8: "release-candidate only (rc.8 as of 2026-08-26); not GA; architecturally distinct (JSON contract model, chained query-builder DSL) — do not target for production"

version_sensitive_claims:
  - claim: MongoDB is not supported in Prisma ORM v7; official docs instruct MongoDB users to continue using Prisma ORM v6 until v8 restores support.
    applies_to: "v7.x (all releases); MongoDB support returns in v8, but the exact RC it lands at is not confirmed"
    source_ref: research/technologies/prisma.md §11a, §14; research/knowledge-maps/version-matrix.md (Prisma row)
  - claim: "Prisma 8 rc.7 renamed pagination methods take()/skip() to limit()/offset(), which conflicts with the current live orm-client reference docs example still showing take()/skip() — an unresolved contradiction between two official sources pending v8.0.0 GA."
    applies_to: "v8.0.0-rc.7 onward; unresolved as of research date 2026-09-09"
    source_ref: research/technologies/prisma.md §3, §13; research/knowledge-maps/version-matrix.md (Prisma row)
  - claim: v7 requires Node.js ^20.19.0, ^22.12.0, or ^24.0.0 (Active/Maintenance LTS only) and TypeScript >=5.4 (optional, TS-only); v6 required only Node 16.13/18.x/20.x and TypeScript >=4.7.
    applies_to: "v7.0.0+ vs. v6.x — do not apply v7 minimums to a v6-pinned project"
    source_ref: research/technologies/prisma.md §12; research/knowledge-maps/version-matrix.md (Prisma row)
  - claim: The Rust-free architecture (TS/WASM query compiler + driver adapters) was Preview/Early Access under v6, reached GA as a non-default opt-in at v6.16.0, and became the v7.0.0 default (2025-11-19).
    applies_to: "v6.16.0 (opt-in GA) vs. v7.0.0+ (default) — do not assume Rust-free behavior on a v6.x project pinned to the classic engine"
    source_ref: research/technologies/prisma.md §2, §12
  - claim: Multi-file schema (prisma/schema/ directory) requires v6.7.0+; prisma.config.ts reached GA at v6.13.0.
    applies_to: ">=6.7.0 (multi-file schema); >=6.13.0 (prisma.config.ts GA)"
    source_ref: research/technologies/prisma.md §2, §12
  - claim: "Latest stable release is 7.10.0 (2026-08-25); latest overall release is 8.0.0-rc.8 (2026-08-26), still a release candidate with no stable 8.0.0 GA. The official blog states \"Prisma 7 is still the right choice for your production apps,\" with 12 months of continued v7 support committed."
    applies_to: "as of research date 2026-09-09 — re-verify before treating as current"
    source_ref: research/knowledge-maps/version-matrix.md (Prisma row); research/technologies/prisma.md (top section)
last_verified: "2026-09-09"
reverify_triggers:
  - Prisma 8.0.0 GA release
  - MongoDB support returning in v8
  - Resolution of the take()/skip() vs. limit()/offset() pagination-naming conflict at v8.0.0 GA
  - A new Prisma v7 minor/patch that changes documented CLI flags, config shape, or system requirements

owned_knowledge:
  - Prisma schema-file-to-generated-client mechanics (schema.prisma/PSL, generator/datasource blocks, driver adapters)
  - Prisma Migrate CLI mechanics and production-migration discipline (migrate dev/deploy/reset, db push)
  - Prisma's v6/v7/v8 architecture transition and version-gated behavior (Rust-free engine, contract model, MongoDB support)
decision_framework_present: true

failure_handling:
  - If the pinned Prisma major version is unknown, ask or check package.json/lockfile before assuming v7 behavior — v6/v7/v8 differ materially in CLI shape, config, and MongoDB support.
  - If the store is MongoDB, confirm the project is (or will be) pinned to v6 before proceeding; a v7-targeting recommendation against a MongoDB store is wrong regardless of how the task is phrased.
  - If shell is unavailable/denied, produce advisory schema/migration output and state that `prisma generate`/`migrate`/`db push` was not executed.

escalation:
  - Running `prisma migrate reset` or any command that drops/recreates the database requires explicit user confirmation before execution (defer to SK-DATA-006 rollout discipline); `migrate dev`/`db push` must never be proposed against production.

verification:
  - Any Prisma API/CLI/config claim matches the pinned major version (v6, v7, or v8-RC), never assumed "latest" behavior.
  - A MongoDB-backed project's guidance targets v6, never v7.
  - Raw-SQL escape hatches (`$queryRaw`/`$executeRaw`) are parameterized/tagged-template; `$queryRawUnsafe`/`$executeRawUnsafe` never receive unsanitized input.
  - Production migration guidance uses only `prisma migrate deploy`, never `migrate dev`/`db push`.
  - A generated migration is actually run (`prisma migrate dev` locally or `migrate deploy` against staging) and its result inspected, not just generated and reviewed as SQL.

evaluation_criteria:
  - For a seeded MongoDB-backed project, correctly recommends staying on Prisma v6 rather than v7, citing the documented support gap.
  - For a seeded v7 project, produces schema/config using v7's mandatory driver-adapter + prisma.config.ts shape, not v6/pre-v7 patterns.
  - When v8/RC is in scope, flags the take()/skip() vs. limit()/offset() pagination conflict as unresolved rather than asserting one is correct.
  - Does not restate generic ORM N+1/transaction/testing-selection method owned by SK-DATA-002, or generic expand/contract migration mechanics owned by SK-DATA-006 (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running prisma generate/migrate/studio; abstract shell → CC tools
  cursor:
    paths: ["**/schema.prisma", "**/prisma/**", "**/prisma.config.ts"]
  vscode:
    argument_hint: "<task, e.g. 'add a model to schema.prisma' or 'plan the v6 to v7 upgrade'>"
