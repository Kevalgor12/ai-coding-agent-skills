id: SK-TECH-nextjs
slug: nextjs
name: Next.js
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-001, SK-FE-005, SK-GROW-001]   # frontend-architecture, rendering-strategy, seo-optimization

purpose: >-
  Apply Next.js correctly and version-appropriately — App Router vs Pages
  Router mechanics, file-based routing, the Cache Components/Partial
  Prerendering model, Server Actions, and the CLI/upgrade path — including
  the version-critical May 2026 security advisories.
scope: >-
  Next.js-specific implementation depth. The generic frontend-structure
  method comes from SK-FE-001; the rendering-mode decision method comes from
  SK-FE-005 (not yet authored); SEO mechanics come from SK-GROW-001 (not yet
  authored). The Next.js-vs-Nuxt meta-framework comparison is already owned
  by SK-FE-001 and is not repeated here.
expertise: Next.js/full-stack React framework engineer.
description: >-
  Next.js-specific implementation: App Router vs Pages Router mechanics,
  file-based routing conventions, the Cache Components/Partial Prerendering
  model, Server Actions, and CLI/upgrade paths. Use when the stack uses
  Next.js (next.config.js/.mjs/.ts, an app/ or pages/ directory, "next" in
  package.json) or the task names a Next.js feature. Next.js 13-14 have no
  direct patch for the May 2026 security advisories — version-check first.
  Not for open framework selection or generic SEO strategy.

activation_conditions:
  - A next.config.js/.mjs/.ts file, or "next" in package.json/lockfile, is present
  - The project uses Next.js's app/ or pages/ directory routing conventions
  - The task names Next.js, App Router, Pages Router, or a Next.js-specific feature (Server Actions, Cache Components, Turbopack, proxy.ts, Route Handlers)
  - A Next.js version upgrade, security-patch check, or major-version migration is requested
non_activation_conditions:
  - The stack uses a different meta-framework (Nuxt, Remix, SvelteKit, Astro) — route to that skill
  - The framework/meta-framework choice is still open (route to SK-FE-001, or SK-FE-005 once authored)
  - Generic React component/hook/state work with no Next.js-specific mechanism involved (route to SK-TECH-react)
  - Pure SEO/content strategy with no rendering-mechanism question (route to SK-GROW-001 once authored)
activation_mode: auto

inputs:
  - name: task
    description: The Next.js task (routing/rendering, caching config, Server Actions, security upgrade, deployment, testing).
    required: true
  - name: project-context
    description: The project's current Next.js version, router (App/Pages), and next.config.js, if this is not greenfield.
    required: false
required_context:
  - The project's actual installed Next.js version — needed before any version-gated recommendation, especially security guidance.
optional_context:
  - Whether Cache Components (cacheComponents: true) is already enabled.
  - The deployment target (Node server, Docker, static export, a specific Adapter).

outputs:
  - name: nextjs-code-or-config
    kind: edit
    description: App Router/Pages Router code, next.config.js changes, Server Actions, Route Handlers, or proxy.ts.
  - name: version-or-security-analysis
    kind: analysis
    description: Version/upgrade recommendation, explicitly flagging whether the project falls in the no-direct-patch 13-14 window.

depends_on_skills: []
related_skills: [SK-TECH-react]
conflicts_with: [SK-TECH-nuxt]

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: proposing code/config is advisory; running next build/dev, codemods,
# or next upgrade needs shell.

