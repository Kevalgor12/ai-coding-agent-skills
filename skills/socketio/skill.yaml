covered_versions:
  socket.io: ">=4.6 (Node.js server >=10)"
version_sensitive_claims:
  - claim: The 3.x→4.0 breaking changes (immutable io.to()/io.in() broadcast operators, wsEngine option shape, invalid socket.to().broadcast.emit()) are server-side only; v3 and v4 clients remain protocol-compatible with each other.
    applies_to: "3.x→4.0 boundary"
    source_ref: research/technologies/socketio.md (§11 Migration; version-matrix.md "v3↔v4 client/server compatibility")
  - claim: connectionStateRecovery, cleanupEmptyChildNamespaces, and addTrailingSlash server options were added in v4.6.0; io.engine.use() (Express-style HTTP middleware) was also added in v4.6.0.
    applies_to: ">=4.6.0"
    source_ref: research/technologies/socketio.md (§4, §5, §12); version-matrix.md
  - claim: As of v4.1.3, the heartbeat mechanism became server-initiated (server sends PING) to mitigate browser tab-throttling causing spurious disconnects.
    applies_to: ">=4.1.3"
    source_ref: research/technologies/socketio.md (§2); version-matrix.md
  - claim: InterServerEvents typing and serverSideEmit() were added in v4.1.0.
    applies_to: ">=4.1.0"
    source_ref: research/technologies/socketio.md (§5, §12); version-matrix.md
  - claim: SocketData typing and the µWebSockets.js engine binding were added in v4.4.0.
    applies_to: ">=4.4.0"
    source_ref: research/technologies/socketio.md (§5, §8, §12); version-matrix.md
  - claim: WebTransport support was added in v4.7.0.
    applies_to: ">=4.7.0"
    source_ref: research/technologies/socketio.md (§12); version-matrix.md
  - claim: Redis Sharded Pub/Sub as an adapter topology requires Redis 7.0+.
    applies_to: "Redis >=7.0 for sharded Pub/Sub topology"
    source_ref: research/technologies/socketio.md (§10); version-matrix.md
  - claim: The Admin UI is compatible with Socket.IO v4 servers and v3.1.0+ servers.
    applies_to: ">=3.1.0 servers"
    source_ref: research/technologies/socketio.md (§15); version-matrix.md
  - claim: allowEIO3 (default false) enables backward compatibility with Socket.IO v2 clients / Engine.IO v3 protocol.
    applies_to: "opt-in compatibility flag, all v4.x"
    source_ref: research/technologies/socketio.md (§4); version-matrix.md
  - claim: Minimum supported Node.js version for the server package is Node.js 10; older versions are not supported.
    applies_to: "Node.js >=10"
    source_ref: research/technologies/socketio.md (§10); version-matrix.md
last_verified: "2026-09-10"
reverify_triggers:
  - A new Socket.IO major version (5.0) release or its breaking-changes/migration guide
  - Any change to the documented multi-node adapter list or the connection-state-recovery adapter-support matrix (currently: MongoDB and Redis Streams support it, plain Redis Pub/Sub does not)
  - Any change to the Admin UI's documented production-auth requirement
  - Any change to the Node.js/browser support floor

owned_knowledge:
  - Socket.IO event-emitter API surface (Server/Namespace/Socket/Engine classes, emit/broadcast/ack patterns)
  - Socket.IO namespaces and rooms mechanics
  - Socket.IO io.use()/io.engine.use() middleware pattern
  - Socket.IO multi-node adapter selection (Redis vs. MongoDB vs. PostgreSQL) and WS-engine choice (ws vs. µWebSockets.js vs. Bun engine)
  - Socket.IO v2→v3 and v3→v4 breaking-change boundaries

decision_framework_present: true

failure_handling:
  - If the Socket.IO major/minor version in use cannot be determined, ask or explicitly state the version the guidance targets (this skill targets >=4.6); never assume the latest release (4.8.x) silently.
  - If shell is unavailable/denied, produce advisory code/config and state that install/build/test commands were not run.
  - If the actual need is raw-WebSocket-only code or the realtime transport choice itself is still open, defer to SK-TECH-websocket-api or SK-BE-004 respectively rather than assuming Socket.IO is the right fit.
verification:
  - Middleware auth (io.use()) validates handshake.auth/headers/cookies on every connect AND reconnect attempt, not only the initial connect.
  - A recommended multi-node adapter's documented limitations (Redis: no persistence, no connectionStateRecovery support, silently degrades broadcasts to local-only if Redis is unavailable) are stated alongside the recommendation, not omitted.
  - Any version-gated API/option used in generated code is tagged with the version it was added in and checked against the stated covered_versions.
  - If Admin UI instrumentation is added, production auth (not disabled auth) is configured.
  - A test client is actually connected to the running server and bidirectional message exchange is confirmed (not just the event handler registration code reviewed), with the connection observed to close cleanly.
evaluation_criteria:
  - For a seeded auth requirement, proposes an io.use() middleware that validates socket.handshake.auth on connect and reconnect, rejecting via next(new Error(...)), rather than only checking at the initial handshake.
  - For a seeded multi-instance scaling requirement that also needs connection-state recovery, selects MongoDB or Redis Streams (not the plain Redis Pub/Sub adapter) and states why, citing the documented adapter-support differences.
  - Correctly states the v3→v4 breaking changes as server-side only, with v3/v4 client protocol-compatibility preserved.
  - Does not restate the parent skill's WebSocket-vs-Socket.IO-vs-WebRTC comparison table or its generic connection-lifecycle/scaling/auth framework (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  vscode:
    argument_hint: "<task, e.g. 'add room-based auth middleware' or 'pick a scaling adapter'>"
