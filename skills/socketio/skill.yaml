id: SK-TECH-socketio
slug: socketio
name: Socket.IO
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-004]

purpose: >-
  Apply Socket.IO's event-based API, namespaces/rooms, middleware, and
  transport/version specifics correctly, specializing the parent
  realtime-communication skill's transport-selection and
  connection-lifecycle/scaling/auth framework with concrete Socket.IO
  implementation depth.
scope: >-
  Socket.IO-specific implementation: the event-emitter API (Server/
  Namespace/Socket/Engine classes), namespaces and rooms, the io.use()
  middleware pattern, Engine.IO transport negotiation, multi-node adapter
  selection, and the v3→v4 upgrade boundary. Does not repeat the parent
  skill's WebSocket-vs-Socket.IO-vs-WebRTC transport comparison or its
  generic connection-lifecycle/scaling/auth decision framework — see
  SK-BE-004 for that.
expertise: Socket.IO-focused backend/realtime engineer.
description: >-
  Socket.IO-specific event-emitter API, namespaces/rooms, io.use()
  middleware, Engine.IO transport negotiation, multi-node adapters, and the
  v3→v4 upgrade boundary. Use when the stack has a socket.io/socket.io-client
  dependency or the task names Socket.IO, namespaces, or rooms. Not for raw
  WebSocket API code (use websocket-api) or an open realtime-transport choice
  (use realtime-communication).

activation_conditions:
  - A socket.io / socket.io-client dependency, import, or require is present in the stack
  - The task names Socket.IO, namespaces, rooms, io.use() middleware, or a Socket.IO adapter
  - An existing Socket.IO server/client needs a version upgrade, scaling-adapter choice, engine choice, or Admin UI setup
non_activation_conditions:
  - The stack uses only the raw WebSocket API with no Socket.IO dependency (route to SK-TECH-websocket-api)
  - The realtime transport choice itself is still open (route to SK-BE-004)
  - The task is WebRTC peer-to-peer media/data with no Socket.IO involvement (route to the WebRTC technology skill)
activation_mode: auto

inputs:
  - name: task
    description: The Socket.IO task (namespace/room design, middleware auth, multi-node scaling-adapter choice, engine choice, version upgrade, Admin UI setup).
    required: true
  - name: existing-socketio-setup
    description: Existing server/client Socket.IO code, version, and deployment topology (single vs. multi-instance), if not greenfield.
    required: false
required_context:
  - The Socket.IO major/minor version in use (server and client) — several documented options (connectionStateRecovery, io.engine.use(), SocketData typing, WebTransport) only exist from specific minor versions onward.
optional_context:
  - Whether the deployment runs multiple server instances (determines whether an adapter/sticky-session story is needed — design owned by SK-BE-004, adapter choice by this skill).
  - Whether TypeScript is in use (changes how typed events are declared).

outputs:
  - name: socketio-implementation
    kind: edit
    description: Namespace/room design, io.use() middleware, server/client event handlers, or Manager/Socket client configuration.
  - name: scaling-adapter-config
    kind: edit
    description: Multi-node adapter setup (Redis/MongoDB/PostgreSQL) and its Socket.IO-side configuration.
  - name: analysis
    kind: analysis
    description: Version-upgrade guidance, engine-choice recommendation (ws vs. µWebSockets.js), or Admin UI auth configuration review.

depends_on_skills: []
related_skills: [SK-TECH-websocket-api, SK-TECH-redis]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B

