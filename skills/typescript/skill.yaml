id: SK-TECH-typescript
slug: typescript
name: TypeScript
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-CONV-003]

purpose: >-
  Apply TypeScript correctly and version-appropriately — its structural,
  gradually-strict type system, tsconfig configuration, and the 6.0/7.0
  breaking-defaults transition — as a specialization of language-agnostic
  code quality.
scope: >-
  TypeScript-the-language and its compiler (`tsc`): type-system fundamentals,
  tsconfig configuration, module/target selection, declaration-file authoring,
  and the version-specific behavior of TypeScript 5.9 through 7.0. ECMAScript
  language-spec behavior is folded into this skill rather than authored
  separately. Not idiomatic-naming/structure conventions in general (owned by
  the parent, SK-CONV-003), not any single framework's TypeScript usage
  patterns (React/Vue/Angular/Node skills), and not build-tool configuration
  beyond `tsc` itself (Vite/bundler skills).
expertise: TypeScript/JavaScript language and tooling engineer.
description: >-
  TypeScript's type system, tsconfig configuration, declaration files, and the
  TypeScript 6.0/7.0 breaking-defaults and Go-native-compiler transition. Use
  when the codebase has a tsconfig.json, .ts/.tsx files, or the task is about
  TypeScript types, compiler options, or migration/upgrade between TypeScript
  versions. Not for general code-quality conventions independent of language
  (use code-quality), or a specific framework's own TypeScript integration
  patterns (use that framework's skill).

activation_conditions:
  - A tsconfig.json, .ts, .tsx, .mts, or .cts file is present in the task's scope
  - The task asks about TypeScript types, generics, compiler options, or declaration files
  - The task is a TypeScript version upgrade/migration (e.g. adopting 6.0's new defaults, or evaluating a move to 7.0)
  - A JS-to-TS migration is requested
non_activation_conditions:
  - The codebase is plain JavaScript with no TypeScript adoption planned
  - The task is purely about generic naming/structure/readability independent of language (route to SK-CONV-003)
  - The task is a specific framework's own TypeScript integration mechanics with the type system itself not in question (route to that framework's skill, e.g. SK-TECH-react, SK-TECH-vue, SK-TECH-nodejs)
activation_mode: auto

inputs:
  - name: task
    description: The TypeScript task (type-system question, tsconfig change, declaration authoring, version upgrade).
    required: true
  - name: existing-tsconfig
    description: The project's current tsconfig.json and TypeScript version, if one exists.
    required: false
required_context:
  - The TypeScript major/minor version in use (from package.json or `tsc --version`) — needed for version-correct guidance given the 5.9/6.0/7.0 breaking changes.
optional_context:
  - Whether the project embeds the Compiler API programmatically (blocks a 7.0 upgrade until 7.1).
  - The target runtime host (Node/bundler/browser) driving `module`/`moduleResolution` choice.

outputs:
  - name: tsconfig-or-type-change
    kind: edit
    description: A tsconfig.json change, type annotation, or declaration file reflecting version-correct TypeScript behavior.
  - name: migration-plan
    kind: analysis
    description: A sequenced plan for adopting new defaults or upgrading TypeScript major versions, with the version each step targets.
  - name: analysis
    kind: analysis
    description: Recommendations on type-system usage or configuration with rationale and the version they apply to.

depends_on_skills: []
related_skills: [SK-TECH-react, SK-TECH-vue, SK-TECH-angular, SK-TECH-nodejs]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: proposing type/config changes is advisory; running tsc/checking
# compiler output needs shell.

