covered_versions:
  typescript: ">=6.0 <=7.0"
version_sensitive_claims:
  - claim: >-
      TypeScript 6.0 changed long-standing defaults: strict->true,
      module->esnext, target->floating es2025, types->[] (no longer
      auto-including @types/*, so most Node.js projects need explicit
      "types": ["node"]), noUncheckedSideEffectImports->true,
      libReplacement->false.
    applies_to: ">=6.0"
    source_ref: research/technologies/typescript.md (Section 4/13); research/knowledge-maps/version-matrix.md
  - claim: >-
      TypeScript 7.0 ships with no programmatic Compiler API at all, delaying
      tools that embed the compiler (Vue, Angular, Svelte tooling cited by
      the announcement) until a planned TypeScript 7.1.
    applies_to: ">=7.0 <7.1"
    source_ref: research/technologies/typescript.md (Section 3/13); research/knowledge-maps/version-matrix.md
  - claim: The Compiler API wiki page's documented surface is valid only for TypeScript 6.0 and earlier; 7.1 is promised "a completely different API."
    applies_to: "<=6.0 (wiki content); 7.1 unreleased at research time"
    source_ref: research/technologies/typescript.md (Section 3)
  - claim: noUncheckedSideEffectImports was added in 5.6; rewriteRelativeImportExtensions was added in 5.7.
    applies_to: ">=5.6 (noUncheckedSideEffectImports); >=5.7 (rewriteRelativeImportExtensions)"
    source_ref: research/technologies/typescript.md (Section 4)
  - claim: ArrayBuffer is no longer a supertype of typed-array types in lib.d.ts, which can surface new errors around Buffer/typed-array interop.
    applies_to: ">=5.9"
    source_ref: research/technologies/typescript.md (Section 4/13)
  - claim: Stage-3 ECMAScript decorators are available without experimentalDecorators, alongside the older flag-gated legacy decorator implementation.
    applies_to: ">=5.0"
    source_ref: research/technologies/typescript.md (Section 16)
  - claim: --module node20 models Node 20 behavior and implies target es2023, and (unlike nodenext) is not expected to gain new behavior in future releases.
    applies_to: ">=5.9"
    source_ref: research/technologies/typescript.md (Section 4)
  - claim: TypeScript 7.0 deliberately adopts 6.0's new defaults/behavior for compatibility rather than introducing another wave of changes; the intended upgrade path is 6.0 first, then 7.0.
    applies_to: ">=6.0 <=7.0"
    source_ref: research/technologies/typescript.md (Section 11)
last_verified: "2026-09-10"
reverify_triggers:
  - TypeScript 7.1 release (restores a Compiler API)
  - Any new TypeScript major/minor that changes compiler-option defaults again
  - The Architectural-Overview wiki page being confirmed updated (or not) for the Go-native (7.0) implementation

owned_knowledge:
  - TypeScript type-system fundamentals (structural typing, documented unsoundness, type erasure)
  - TypeScript compiler configuration (tsconfig.json, module/target/moduleResolution selection)
  - TypeScript version-transition behavior (5.9 -> 6.0 -> 7.0 breaking changes and migration sequencing)
  # ECMAScript language-spec behavior is folded in here per taxonomy, not owned separately.
  # General code-quality/readability conventions are owned by the parent, SK-CONV-003.

decision_framework_present: true

failure_handling:
  - If the TypeScript major/minor version cannot be determined, ask for it or state the version the guidance assumes; never assume "latest" silently (VA-3) given how much changed across 5.9/6.0/7.0.
  - If shell is unavailable/denied, degrade to advisory tsconfig/type-annotation output and state that `tsc` was not actually run to confirm it compiles.
  - If a project embeds the Compiler API and is being evaluated for a 7.0 upgrade, flag the 7.1-Compiler-API gap explicitly rather than silently recommending the upgrade.
escalation:
  - A tsconfig change that would newly fail the build across a large existing codebase (e.g. enabling strict, or the 6.0 default flip) requires the user's explicit go-ahead before applying, given how disruptive it can be.
verification:
  - Any TypeScript-version-specific claim is tagged with the version range it holds for.
  - "`tsc --noEmit` (or the project's equivalent type-check command) is proposed or run to confirm a change actually type-checks, not just visually plausible."
  - A recommendation to upgrade to TypeScript 7.0 explicitly checks whether the project depends on the programmatic Compiler API.
  - tsc --noEmit (or the project's type-check command) is actually executed and exits with zero errors, confirming the changes compile in the real project environment rather than only appearing visually correct.
evaluation_criteria:
  - For a seeded project on TypeScript <6.0, produces a migration plan that sequences the 6.0 default changes before any 7.0 upgrade, per the documented adoption path.
  - For a seeded question about upgrading to TypeScript 7.0, correctly flags the missing Compiler API as a blocker when the project embeds the compiler programmatically.
  - Does not restate generic naming/structure/readability guidance owned by the parent skill (QR-2).
  - Any type-system, tsconfig, or CLI claim in the output resolves to a `source_references` entry.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "**/tsconfig*.json"]
  vscode:
    argument_hint: "<task, e.g. 'adopt TypeScript 6.0 defaults' or 'evaluate upgrading to TypeScript 7.0'>"
