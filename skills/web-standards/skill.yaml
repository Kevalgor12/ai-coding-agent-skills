id: SK-TECH-web-standards
slug: web-standards
name: Web Standards (HTML & CSS)
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-003, SK-FE-004]   # styling-systems, web-accessibility

purpose: >-
  Apply HTML document structure/DOM APIs and CSS cascade/layout/theming
  mechanics correctly and version-appropriately — the foundational
  web-platform primitives underneath any frontend framework, component
  library, or styling system.
scope: >-
  HTML and CSS as web-platform technologies: document structure, the DOM
  data model and Custom Elements/DOM APIs, HTML's own security surface
  (XSS sinks, sandboxing), the CSS cascade/specificity/box model, modern
  CSS layout and theming at-rules (@container, @property, @layer, native
  nesting), and Baseline-based version awareness for both. Deliberately
  merged (HTML+CSS): both are foundational, almost-always-co-present
  web-platform primitives (see core/taxonomy/taxonomy-analysis.md).
  Accessibility-specific guidance (semantic-HTML-for-a11y, alt text,
  heading hierarchy, table markup) is owned by SK-FE-004 and only
  referenced here, not repeated. Styling-architecture decisions (design
  tokens, utility-first vs. component CSS, CSS-in-JS) are owned by
  SK-FE-003 and only referenced here, not fabricated.
expertise: Web platform engineer (HTML/CSS specialist).
description: >-
  HTML document structure, the DOM data model, and Custom Elements/DOM
  APIs, plus CSS cascade, specificity, box model, layout, custom
  properties, and modern at-rules (@container, @property, @layer, native
  nesting) with Baseline-availability awareness. Use for raw HTML/CSS
  platform mechanics. Not for accessibility semantics (use
  web-accessibility), styling-architecture decisions like design tokens or
  utility-first vs. component CSS (use styling-systems), or Sass/Tailwind
  syntax (use those skills).

activation_conditions:
  - Authoring or reviewing raw HTML document structure/elements/attributes independent of a specific JS framework
  - Authoring or reviewing CSS selectors, cascade, box model, layout, or custom properties independent of a specific CSS framework/preprocessor
  - The task names an HTML/CSS platform primitive (DOM API, Custom Elements, box model, cascade/specificity, @container/@property/@layer/nesting)
  - Deciding whether native CSS Nesting can replace a preprocessor, or whether a modern CSS feature's Baseline status is safe for production
non_activation_conditions:
  - The task is specifically accessibility semantics (alt text, ARIA, heading hierarchy for screen readers) — route to SK-FE-004 (web-accessibility)
  - The task is a styling-architecture/design-system decision (tokens, utility-first vs. component CSS, choosing among Sass/Tailwind/CSS-in-JS) — route to SK-FE-003 (styling-systems)
  - The task is Sass-specific (@use/@forward, mixins) or Tailwind-specific (utility classes, config) syntax — route to SK-TECH-sass / SK-TECH-tailwindcss
  - Backend/non-UI work with no HTML/CSS surface
activation_mode: auto

inputs:
  - name: task
    description: The HTML/CSS task (document structure, a DOM API, a cascade/layout/theming decision, or evaluating a specific modern CSS feature).
    required: true
  - name: existing-markup-or-styles
    description: Existing HTML/CSS in the codebase, if any, to stay consistent with.
    required: false
required_context:
  - The markup or stylesheet (or the structural/styling problem) being worked on
optional_context:
  - Target browser support requirements (informs Baseline-status decisions)
  - Whether the project already uses a CSS preprocessor (informs the native-nesting-vs-preprocessor decision)

outputs:
  - name: markup-or-stylesheet-edit
    kind: edit
    description: HTML structure or CSS rules reflecting correct document/DOM/cascade/layout usage and Baseline-aware feature choices.
  - name: analysis
    kind: analysis
    description: Recommendations on document structure, DOM API usage, or CSS mechanics decisions (e.g. native nesting vs. preprocessor, @property production-readiness), with version/Baseline caveats stated.

depends_on_skills: []
related_skills: [SK-TECH-sass, SK-TECH-tailwindcss, SK-FE-004]
conflicts_with: []

required_capabilities: [file-read, file-write]
execution_tier: A
# Tier A: authoring markup/stylesheets is advisory/file-only, not
# fundamentally shell-execution-dependent (unlike running a service).

