covered_versions:
  html: "WHATWG Living Standard (continuously updated, no version number; last-updated snapshot observed 2026-09-07 per research/technologies/html.md)"
  css: "Module-based, no single version; 2026 CSS Snapshot Group Note used as the reference point for current module status"
version_sensitive_claims:
  - claim: "box-sizing is Baseline widely available."
    applies_to: "since July 2015"
    source_ref: research/technologies/css.md
  - claim: "@container (container queries) is Baseline widely available."
    applies_to: "established February 2023"
    source_ref: research/technologies/css.md
  - claim: "@property is Baseline newly available — expect gaps on older browsers, not yet safe to rely on without a fallback for broad production use."
    applies_to: "since July 2024"
    source_ref: research/technologies/css.md
  - claim: "will-change is Baseline widely available."
    applies_to: "since January 2020"
    source_ref: research/technologies/css.md
  - claim: "CSS Nesting Module Level 1 is comparatively new; MDN's nesting page carries a 'last update November 2025' note. Check current browser-compat tables before production use."
    applies_to: "as of the 2026-09-09/10 research pass — reverify against current MDN compat tables"
    source_ref: research/technologies/css.md
last_verified: "2026-09-10"
reverify_triggers:
  - A new annual CSS Snapshot Group Note publication (module status may have changed)
  - "@property or CSS Nesting Module Level 1 crossing from 'newly available' to 'widely available' Baseline status (changes the production-safety recommendation)"
  - A WHATWG HTML Living Standard change to sections cited here (the spec is continuously updated, unlike versioned technologies)

owned_knowledge:
  - HTML document structure and DOM data model (as distinct from accessibility semantics, owned by SK-FE-004)
  - CSS cascade/specificity/box-model mechanics and Baseline-based version awareness
decision_framework_present: true

failure_handling:
  - If a feature's current Baseline/browser-support status cannot be confirmed as current, state "verify against current Baseline/MDN compat tables" rather than asserting support (SG-3) — this applies especially to @property and native CSS Nesting, both flagged as recent.
  - If the task is actually an accessibility concern (alt text, ARIA, heading semantics), do not duplicate SK-FE-004's content — cite it and defer.
  - If the task is a styling-architecture decision (design tokens, utility-first vs. component CSS, preprocessor/framework choice) beyond raw CSS mechanics, state that SK-FE-003 owns that decision and this skill supplies only the underlying CSS mechanics.
verification:
  - Any Baseline-availability claim is tagged with the date/range it holds for, not stated as a bare fact.
  - HTML output uses a correct DOCTYPE/charset/Content-Type and avoids obsolete non-conforming elements/attributes.
  - CSS output's cascade/specificity reasoning is correct (no unexplained !important reach, no untagged use of a newly-available feature without a fallback).
  - No accessibility-specific or styling-architecture content is restated rather than referenced (QR-2 no-duplication).
evaluation_criteria:
  - Given a seeded document-structure task, produces correct DOM-aware HTML (no obsolete elements, correct DOCTYPE/charset) without restating SK-FE-004's accessibility content verbatim.
  - Given a seeded cascade/specificity conflict, correctly explains and resolves it per the documented cascade order (relevance → origin/importance → specificity → scoping proximity → source order).
  - Given a request to use @property or native CSS Nesting, correctly flags the Baseline-recency caveat and recommends a fallback/compat check rather than asserting unconditional safety.
  - Does not fabricate SK-FE-003 or Sass/Tailwind content when those topics come up — references them instead (QR-1).

adapter_hints: {}
