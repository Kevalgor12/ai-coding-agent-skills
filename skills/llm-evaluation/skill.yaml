    title: "Anthropic Claude API Research — Section 9 Testing: success-criteria design (specific/measurable/achievable/relevant), eval-dimension categories, four grading methods, different-model-grades-than-generates best practice"
    via: research/technologies/anthropic-claude-api.md
    retrieved: "2026-09-10"
  - url: research/technologies/openai-api.md
    title: "OpenAI API Research — Section 9 Testing: Evals API three-step workflow (documented pattern, platform itself deprecating), prompt-change test-before-ship discipline"
    via: research/technologies/openai-api.md
