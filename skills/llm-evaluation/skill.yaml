  - url: research/technologies/owasp-llm-top10.md
    title: "OWASP LLM Top 10 (2026) Research — LLM07:2026 Misinformation: grounding-in-authoritative-sources mitigation, claim-verification workflows, documented hallucination scenario categories"
    via: research/technologies/owasp-llm-top10.md
    retrieved: "2026-09-10"
last_verified: "2026-09-10"

owned_knowledge:
  - Success-criteria design method for LLM output (specific/measurable/achievable/relevant)
  - Grading-method selection (exact-match/cosine-similarity/ROUGE-L/LLM-as-judge) matched to task type
  - Hallucination-mitigation and claim-verification checks for LLM/agentic output
decision_framework_present: true

failure_handling:
  - If the feature's behavioral requirements aren't stated, ask what "correct" output looks like before proposing success criteria rather than inventing them.
  - If asked to build the eval on OpenAI's Evals platform specifically, flag that it is being deprecated (read-only Oct 31 2026, shutdown Nov 30 2026) and frame guidance as the documented pattern (describe the task, run test inputs, analyze/iterate), implementation-tool-agnostic, rather than recommending `v1/evals` for new work.
  - If the request is actually general (non-LLM-output) test authoring, route to testing-strategy (SK-QA-001) rather than answering as if it were LLM-specific grading.
verification:
  - Success criteria are specific, measurable, achievable, and relevant to the feature's actual stakes — not a vague "good performance" bar.
  - The chosen grading method matches the task type (exact-match for categorical, cosine-similarity/ROUGE-L for semantic, LLM-as-judge for subjective) and, when LLM-as-judge is used, the grading model differs from the generating model.
  - Hallucination-mitigation checks require outputs to be grounded in authoritative/current sources and verify claims/tool-call arguments before an agent acts on them, rather than trusting fluent but unverified output.
escalation:
  - A request for general (non-LLM-output) test-suite/CI discipline exceeds this skill's scope — defer to testing-strategy (SK-QA-001).
evaluation_criteria:
  - Given an LLM feature, produces success criteria and a grading method matched to the task type, per the decision framework.
  - Hallucination-mitigation checks require grounding rather than trusting fluent-but-unverified output.
  - Correctly declines a general (non-LLM-output) test-authoring request as outside this skill's scope, routing to testing-strategy.

adapter_hints: {}
