id: SK-AI-007
slug: llm-evaluation
name: LLM Evaluation
spec_version: "1.0"
skill_version: "0.1.0"
kind: generic
layer: 3
domain: AI

purpose: >-
  Build evaluation harnesses for LLM-powered features and detect/mitigate
  hallucination — independent of which model provider or eval platform is
  used.
scope: >-
  LLM-specific evaluation (success-criteria design, grading-method
  selection, golden datasets, eval-before-ship discipline) and
  hallucination mitigation (grounding requirements, claim verification).
  Distinct from testing-strategy (SK-QA-001): LLM output is graded, not
  merely asserted true/false, so this skill owns grading-method selection
  and hallucination-specific verification; ties back to SK-QA-001 for
  surrounding test-suite discipline (fixtures, CI gating). Not general
  (non-LLM-output) test authoring.
expertise: Senior/principal engineer with LLM-evaluation and eval-harness design experience.
description: >-
  Build eval harnesses for LLM features and mitigate hallucination: design
  specific, measurable, achievable success criteria; pick a grading method
  matched to the task (exact-match, semantic-similarity/ROUGE, or
  LLM-as-judge with a different grader model). Maintain golden test cases;
  gate ship-readiness on eval regressions. Use when building/reviewing an
  LLM feature needing quality verification, or investigating suspected
  hallucination. Not general test authoring — route to testing-strategy.

activation_conditions:
  - Building or reviewing an LLM feature that needs quality verification before shipping
  - A feature is exhibiting suspected hallucination
  - Changing a prompt or model and needing a regression gate before shipping
non_activation_conditions:
  - General (non-LLM-output) test authoring — route to testing-strategy (SK-QA-001)
  - The output being tested is deterministic/non-generative code with no grading judgment required
activation_mode: auto

inputs:
  - name: llm-feature
    description: The LLM feature and its stated behavioral requirements.
    required: true
  - name: suspected-failure-mode
    description: Suspected hallucination or quality-regression symptom, if already observed.
    required: false
outputs:
  - name: eval-harness-design
    kind: analysis
    description: Success criteria, grading method, and golden test cases matched to the task type.
  - name: hallucination-mitigation-checks
    kind: analysis
    description: Grounding requirements and claim-verification checks for outputs before an agent acts on them.

depends_on_skills: []
related_skills: [SK-AI-001, SK-QA-001]
conflicts_with: []

required_capabilities: [file-read, file-write]
execution_tier: B

grounding: official-docs
source_references:
