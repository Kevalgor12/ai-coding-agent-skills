covered_versions:
  playwright: ">=1.60 <=1.63"
version_sensitive_claims:
  - claim: >-
      Alpine Linux is unsupported as a Docker base image for Playwright due
      to musl libc incompatibility with the bundled browser builds.
    applies_to: ">=1.60 <=1.63 (architectural constraint, not tied to a specific minor within this range)"
    source_ref: research/technologies/playwright.md §10, §14 (via research/knowledge-maps/version-matrix.md)
  - claim: >-
      Docker image tags must be pinned to the exact Playwright version (e.g.
      v1.63.0-noble) so bundled browser binaries match the automation code's
      Playwright version; a mismatch is a real, common source of flaky/broken CI.
    applies_to: ">=1.60 <=1.63"
    source_ref: research/technologies/playwright.md §10, §17 (via research/knowledge-maps/version-matrix.md)
  - claim: >-
      v1.60 removed several long-deprecated APIs: Locator.ariaRef(), the
      handle option on exposeBinding(), the logger option on connect()/
      connectOverCDP(), and context.videoPath()/legacy video-size options.
    applies_to: ">=1.60"
    source_ref: research/technologies/playwright.md §13 (via research/knowledge-maps/version-matrix.md)
  - claim: >-
      v1.62 introduced the stable component-testing model (stories/galleries
      + fixtures.mount()); v1.63 deprecated the experimental
      @playwright/experimental-ct-react[-17]/-vue packages in its favor.
    applies_to: ">=1.62 <=1.63"
    source_ref: research/technologies/playwright.md §13 (via research/knowledge-maps/version-matrix.md)
  - claim: v1.63 dropped Ubuntu 20.04 support; v1.62 announced Debian 11 end-of-support.
    applies_to: ">=1.62 <=1.63"
    source_ref: research/technologies/playwright.md §13 (via research/knowledge-maps/version-matrix.md)
  - claim: >-
      macOS 13 WebKit support was deprecated and route.continue() lost the
      ability to override the Cookie header. Unresolved: the exact version
      tag is believed to be v1.52 per the source research's summarized
      fetch, but is explicitly unconfirmed — do not state it as settled.
    applies_to: "Unresolved — believed v1.52, not confirmed against the dated release-notes entry"
    source_ref: research/technologies/playwright.md §13
last_verified: "2026-09-10"
reverify_triggers:
  - A new Playwright minor release beyond v1.63 (check for new breaking API removals, OS-support drops, or component-testing model changes)
  - Confirmation or correction of the exact version tag for the macOS 13 WebKit / Cookie-header change, currently unconfirmed
  - Any change to Playwright MCP's documented security guidance beyond the browser_run_code_unsafe tool-naming signal

owned_knowledge:
  - Playwright fixture-based test composition (test-scoped/worker-scoped/auto fixtures, test.extend())
  - APIRequestContext server-only API testing
  - Playwright visual-regression mechanics (pixelmatch diffing, maxDiffPixels tolerance)
  - Playwright component-testing model (stories/galleries, fixtures.mount())
  - Playwright Docker deployment and security posture (non-root+seccomp vs. root, storageState credential risk, Alpine incompatibility, image-tag/version pinning)
decision_framework_present: true

failure_handling:
  - If no browser-automation capability and no MCP browser server is available, degrade to advisory-only: write/review Playwright test code and config without executing it, and state that explicitly rather than claiming a run occurred.
  - If the Playwright version in use can't be determined, ask for it or state the version range (>=1.60 <=1.63) this guidance assumes; never assume "latest" silently.
  - If a request needs test-layer-selection method or role-locator a11y framing, defer to testing-strategy/web-accessibility rather than restating their content.
escalation:
  - Running Chromium as root against untrusted content (scraping/crawling arbitrary sites) disables the OS-level sandbox; flag this to the user and recommend the documented non-root-user + seccomp-profile hardening before proceeding.
  - A storageState file (e.g. under playwright/.auth) found staged for commit is flagged before proceeding — it can carry live, impersonation-capable session credentials.
verification:
  - Tests use web-first, auto-retrying assertions (e.g. expect(locator).toBeVisible()), not manually re-checked isVisible() booleans.
  - Auth/state isolation matches the storageState-reuse or per-worker-account pattern where the suite mutates server-side state.
  - Any Docker deployment pins the image tag to the exact Playwright version installed in the project.
  - Every version-tagged claim in the output carries its applicable range.
evaluation_criteria:
  - For a seeded task needing only server-side verification, proposes APIRequestContext instead of defaulting to full browser automation.
  - For a seeded Docker deployment task involving untrusted content, proposes non-root + seccomp hardening rather than defaulting to root.
  - Does not recommend committing a storageState file to version control.
  - Does not restate testing-strategy's layer-selection method or web-accessibility's role-locator/MCP-accessibility-tree content (QR-2).
  - Flags the macOS-WebKit-version claim as unconfirmed rather than stating it as settled fact.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
    mcp_fallback: "playwright-mcp (@playwright/mcp) when direct browser execution is unavailable"
  vscode:
    argument_hint: "<task, e.g. 'add an E2E test for checkout' or 'harden the Docker image'>"
