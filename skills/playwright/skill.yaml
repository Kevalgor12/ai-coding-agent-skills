id: SK-TECH-playwright
slug: playwright
name: Playwright
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-QA-001, SK-FE-004]

purpose: >-
  Apply Playwright correctly and version-appropriately for browser-based
  end-to-end testing, server-only API testing, visual regression, and
  component testing, including its Docker deployment and security posture.
scope: >-
  Playwright-specific implementation depth: @playwright/test's fixture-based
  composition, APIRequestContext for server-only API testing, visual
  regression via pixelmatch, the stable component-testing model, Docker
  deployment, and security (storageState credential handling, sandbox
  posture). Test-layer selection method belongs to testing-strategy
  (SK-QA-001); role-based-locator accessibility framing and MCP
  accessibility-tree integration belong to web-accessibility (SK-FE-004) —
  neither is repeated here.
expertise: Test automation engineer specializing in Playwright.
description: >-
  Playwright implementation: @playwright/test fixture-based composition,
  APIRequestContext for server-only API testing, visual regression via
  pixelmatch, the stable component-testing model, and Docker deployment
  security (storageState leaks, root-vs-sandboxed posture). Use when the
  stack uses Playwright or the task needs E2E/browser/visual/component/API
  test implementation or Playwright Docker/CI setup. Not for test-layer
  selection (testing-strategy) or role-locator a11y framing.

activation_conditions:
  - A playwright.config.ts/.js or an @playwright/test dependency is present
  - The task needs E2E, browser, visual-regression, component, or server-only API testing implementation
  - Playwright Docker deployment or CI pipeline setup is being configured
  - Playwright MCP integration for agent-driven browser automation is in scope
non_activation_conditions:
  - Deciding which test layer to use at all, tech-neutral (route to testing-strategy, SK-QA-001)
  - Role-based-locator accessibility guidance or MCP accessibility-tree framing as an a11y signal (route to web-accessibility, SK-FE-004)
  - The stack uses a different E2E tool with no Playwright involvement (Cypress/WebdriverIO/Selenium named directly, not as a Playwright-backed runner)
  - No browser-automation capability or MCP browser server is available and the task requires an actual run rather than advisory test authoring (see failure_handling)
activation_mode: auto

inputs:
  - name: task
    description: The Playwright task (writing/fixing E2E tests, API tests, component tests, visual regression, or Docker/CI setup).
    required: true
  - name: existing-playwright-config
    description: Existing playwright.config.ts and test files, if any.
    required: false
required_context:
  - The Playwright major/minor version in use (from package.json/lockfile) — needed for version-correct guidance within the >=1.60 <=1.63 range this skill covers.
optional_context:
  - Whether the suite/automation touches untrusted content (changes the Docker security posture recommendation).
  - Whether a browser-automation capability or an MCP browser server is available in the current agent environment.

outputs:
  - name: test-code
    kind: edit
    description: Playwright test files (E2E, API-only, component, or visual-regression) using fixtures and web-first assertions.
  - name: config-or-docker
    kind: edit
    description: playwright.config.ts changes or Docker deployment configuration (image tag, hardening flags).
  - name: analysis
    kind: analysis
    description: Recommendations (e.g. API-testing vs. full browser automation, Docker security posture, component vs. E2E) with version-tagged rationale.

depends_on_skills: []
related_skills: [SK-TECH-jest-vitest]
conflicts_with: []

required_capabilities: [file-read, file-write, shell, browser]
execution_tier: C
capability_fallbacks:
  browser: >-
    If a direct browser-automation primitive isn't available in the current
    agent environment, fall back to Playwright-via-MCP (accessibility-tree-
    based browser control, e.g. on Claude Code) for driving the browser. If
    neither a direct browser capability nor an MCP browser server is
    available, degrade to advisory-only test authoring — write/review
    Playwright test code and config without executing it, and state that
    explicitly rather than claiming a run occurred.

