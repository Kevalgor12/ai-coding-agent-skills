covered_versions:
  docker: ">=25.0 (API v1.44 floor against Engine 29.0.0+); current stable Engine 29.8 (API v1.56)"
version_sensitive_claims:
  - claim: Docker Engine API minimum supported version is v1.44 as of Engine 29.0.0 (compatible with Engine 25.0+ clients); API versions before v1.40 are deprecated/unsupported against current Engine releases.
    applies_to: ">=29.0.0 (daemon floor); client must be API >=v1.44, effectively Engine 25.0+"
    source_ref: research/knowledge-maps/version-matrix.md (Docker row); docs.docker.com/engine/api/, docs.docker.com/engine/release-notes/29/
  - claim: The github.com/docker/docker Go module is deprecated in favor of github.com/moby/moby/client and github.com/moby/moby/api — a breaking change for Go SDK consumers importing the old module path.
    applies_to: ">=29.0.0"
    source_ref: research/knowledge-maps/version-matrix.md (Docker row); docs.docker.com/engine/release-notes/29/
  - claim: Docker Build Checks (docker build --check) requires Buildx >=0.15.0 and Dockerfile syntax >=1.8, gated independently of the Engine version.
    applies_to: "Buildx >=0.15.0, Dockerfile syntax >=1.8"
    source_ref: research/knowledge-maps/version-matrix.md (Docker row); docs.docker.com/reference/build-checks/
  - claim: Compose V2 added cache_to/no-cache/pull/secrets/tags build fields not present in V1; ssh was added in V2.4.0+; platforms (multi-arch, requires a docker-container Buildx driver) was added in V2.11.0+.
    applies_to: "Compose V2 generally; ssh requires >=V2.4.0; platforms requires >=V2.11.0"
    source_ref: research/knowledge-maps/version-matrix.md (Docker row); docker.com/blog/new-docker-compose-v2-and-v1-deprecation
  - claim: cgroup v1 support is deprecated as of Engine 29.0.0, with support continuing only until May 2029.
    applies_to: "deprecated as of >=29.0.0; supported through May 2029"
    source_ref: research/knowledge-maps/version-matrix.md (Docker row); docs.docker.com/engine/release-notes/29/
  - claim: Enhanced Container Isolation on the WSL2 backend hard-requires WSL >=2.6 and Linux kernel >=6.3.0.
    applies_to: "WSL >=2.6, kernel >=6.3.0"
    source_ref: research/knowledge-maps/version-matrix.md (Docker row); docs.docker.com/security/for-admins/hardened-desktop/enhanced-container-isolation/limitations/
  - claim: Rootless mode's default network driver changed to gvisor-tap-vsock as of Engine 29.5.0, alongside a private time namespace enabled by default for rootless containers.
    applies_to: ">=29.5.0"
    source_ref: research/knowledge-maps/version-matrix.md (Docker row); docs.docker.com/engine/release-notes/29/
last_verified: "2026-09-10"
reverify_triggers:
  - A new Docker Engine major or minor release (re-check the API floor, Go SDK module path, and cgroup v1 support window)
  - A new Buildx or Dockerfile-syntax release changing Build Checks' minimum-version gate
  - A new Docker Compose release changing build-field availability
  - Any change to Enhanced Container Isolation's WSL2/kernel version floor

owned_knowledge:
  - Docker Engine API versioning floor and Go SDK module-path migration
  - Docker Build Checks' Buildx/Dockerfile-syntax version gates
  - Compose V2 build-field version gates (ssh, platforms, and the rest)
  - Enhanced Container Isolation's WSL2/kernel version floor
decision_framework_present: true

failure_handling:
  - If the Docker Engine/API/Buildx/Compose (or WSL2/kernel) version cannot be determined, ask for it or state the version the guidance assumes before making a version-gated claim; never assume "latest" silently.
  - If shell is unavailable/denied, degrade to advisory version-compatibility analysis (state the gate, don't run docker/docker compose/buildx) and say so.
  - If a claim would depend on a consolidated cross-major Engine breaking-changes page that the underlying research did not find (only inline per-release notes were located), say "verify against the current Engine release notes" rather than assert by analogy to Engine 29.0.0's documented changes.
verification:
  - Any Engine API/client-version compatibility claim is checked against the actual daemon's reported API version, not assumed.
  - Any recommended Compose build field (ssh, platforms, etc.) is checked against the project's actual Compose version and, for platforms, that a docker-container Buildx driver is configured.
  - Any Go SDK code targets the current module path (moby/moby/client, moby/moby/api) when the project targets Engine >=29.0.0, not the deprecated docker/docker module.
evaluation_criteria:
  - For a seeded scenario with a stated Engine/API/Buildx/Compose version, correctly determines whether a specific claim (API client compatibility, Build Checks availability, a Compose build field, ECI eligibility) is actually supported.
  - For a seeded Go-tooling task against Engine >=29.0.0, uses the current module path rather than the deprecated github.com/docker/docker.
  - For a seeded untrusted-workload isolation decision, selects a defensible --runtime option (default runc vs. gVisor/Kata) based on the actual threat model, including the simplest "default runc is fine" branch when nothing justifies more.
  - Does not restate general image-authoring/security/performance principles owned by containerization (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["**/Dockerfile*", "**/compose*.yaml", "**/compose*.yml", "**/docker-compose*.yml"]
  vscode:
    argument_hint: "<task, e.g. 'will this Compose platforms field work' or 'pick an isolation runtime for untrusted workloads'>"
