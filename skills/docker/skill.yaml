id: SK-TECH-docker
slug: docker
name: Docker
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-INFRA-001, SK-QA-002]   # containerization; security-engineering (not yet authored)

purpose: >-
  Apply Docker's concrete Engine/CLI/API/BuildKit/Compose mechanics
  correctly and version-appropriately, on top of the engine-agnostic
  image-authoring method the parent skill already supplies.
scope: >-
  Docker-specific implementation depth: Engine API versioning and the Go
  SDK module migration, Build Checks' version gates, Compose V2's
  build-field version gates, cgroup v1's deprecation timeline,
  Enhanced Container Isolation's WSL2/kernel floor, and container-runtime
  selection for isolation. Does not repeat the general image-authoring,
  layer-caching, multi-stage-build, or root-daemon-security-model content
  already owned by containerization (SK-INFRA-001); deep cross-cutting
  threat modeling is owned by security-engineering (SK-QA-002, not yet
  authored in this library).
expertise: Docker/container-platform engineer.
description: >-
  Docker-specific Engine/CLI/BuildKit/Compose mechanics: Engine API version
  floor, the Go SDK module migration, Build Checks' Buildx/syntax gates,
  Compose V2 build-field gates (ssh, platforms), cgroup v1's deprecation
  timeline, Enhanced Container Isolation's WSL2/kernel floor, and
  isolation-runtime selection. Use for Docker Engine/API/Compose/Buildx
  version-compatibility questions. Not general image authoring/layering or
  the root-daemon security model, which containerization already covers.

activation_conditions:
  - The task involves Docker Engine API or Go SDK version compatibility (client vs. daemon API version, or migrating off the deprecated github.com/docker/docker module)
  - The task involves Docker Build Checks (docker build --check) or its Buildx/Dockerfile-syntax minimum-version requirements
  - The task involves whether a specific Compose V2 build field (cache_to, secrets, ssh, platforms, etc.) is available at the project's actual Compose version
  - The task involves selecting or evaluating a container-isolation runtime (default runc vs. gVisor/Kata/Wasmtime via --runtime) for a stated threat model
  - The task involves Enhanced Container Isolation, rootless-mode network-driver specifics, or cgroup v1-vs-v2 targeting for a Docker deployment
non_activation_conditions:
  - General Dockerfile/image authoring, layer-caching order, multi-stage structure, or non-root defaults with no Docker-Engine/API/Compose-version-specific question (route to containerization, SK-INFRA-001)
  - The stack does not use Docker/Docker Engine at all
  - Deep cross-cutting security threat modeling beyond Docker-specific mechanics (route to security-engineering, SK-QA-002, not yet authored)
activation_mode: auto

inputs:
  - name: task
    description: The Docker-specific task (API/SDK compatibility check, Build Checks/Compose version gate, isolation-runtime selection, cgroup/ECI targeting).
    required: true
  - name: environment-versions
    description: Docker Engine version, Engine API version, Buildx/Dockerfile-syntax version, Compose version, and (if relevant) WSL/kernel version in use.
    required: false
required_context:
  - The Docker Engine version (or Engine API version) in use — required for version-correct guidance given the independent API/Buildx/Compose/WSL2-kernel version gates.
optional_context:
  - Whether the target workload is untrusted (affects isolation-runtime choice).
  - Whether multi-platform builds are self-hosted or a Docker Build Cloud subscription is available.

outputs:
  - name: version-compatibility-analysis
    kind: analysis
    description: Whether a given API client, Go SDK import, Build Checks setup, or Compose build field is actually compatible with the project's real Engine/Buildx/Compose/kernel versions.
  - name: runtime-or-build-config
    kind: edit
    description: Compose/build configuration, Buildx invocation, or --runtime selection reflecting the correct version gate and the chosen isolation/build strategy.

depends_on_skills: []
# depends_on_skills is reserved for hard, blocking sub-step composition, not
# specialization of a parent. The relationship to SK-INFRA-001 and SK-QA-002
# is specialization/cross-cutting-reference, already fully captured by
# `parents` (SK-INFRA-001, SK-QA-002) — duplicating them here would assert a
# stronger claim (blocking invocation) than either relationship actually is.
# This exact mistake recurred in an earlier batch of this project; left
# empty deliberately per explicit instruction for this skill.
related_skills: []
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: version-compatibility analysis and config authoring are advisory;
# confirming the actual daemon/Buildx/Compose/kernel version, or running
# docker/docker compose/buildx, needs shell.

