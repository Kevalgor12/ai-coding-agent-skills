covered_versions:
  vue: ">=3.3 <=3.5 (3.6/Vapor Mode still RC, not stable); Vue 2.x is EOL and out of scope except for migration/EOL guidance"
version_sensitive_claims:
  - claim: "Vue 2 reached end of support on 2023-12-31 and receives no new features, fixes, or security patches from the core team; 2.7.16 is the final published Vue 2 line version."
    applies_to: "Vue 2.x (all)"
    source_ref: "research/technologies/vue.md §12; research/knowledge-maps/version-matrix.md (Vue row)"
  - claim: "Vue 2's reactivity used Object.defineProperty() getter/setters exclusively 'due to browser support limitations' on Proxy; Vue 3's reactive() uses native ES Proxy — a core architectural split between majors, not just an API rename."
    applies_to: "Vue 2.x (defineProperty) vs. Vue 3.x (Proxy)"
    source_ref: "research/technologies/vue.md §2; research/knowledge-maps/version-matrix.md (Vue row)"
  - claim: "Reactive Props Destructure (destructuring defineProps()'s return value while retaining reactivity) is available."
    applies_to: "Vue >=3.5"
    source_ref: "research/technologies/vue.md §3, §13"
  - claim: "defineOptions() and defineSlots() compiler macros are available."
    applies_to: "Vue >=3.3"
    source_ref: "research/technologies/vue.md §3, §13"
  - claim: "defineModel() compiler macro is available."
    applies_to: "Vue >=3.4"
    source_ref: "research/technologies/vue.md §3, §13"
  - claim: "Lazy Hydration strategies (hydrateOnIdle/hydrateOnVisible/hydrateOnMediaQuery/hydrateOnInteraction/custom HydrationStrategy) are available for defineAsyncComponent."
    applies_to: "Vue >=3.5"
    source_ref: "research/technologies/vue.md §3"
  - claim: "computed() only re-triggers dependent effects when its return value actually changed, not on every re-evaluation — a within-major behavioral shift not cataloged on the formal breaking-changes page."
    applies_to: "Vue >=3.4"
    source_ref: "research/technologies/vue.md §5, §13"
  - claim: "Vapor Mode is a feature-complete but pre-stable opt-in compilation mode bypassing the Virtual DOM; npm 'latest' still points at 3.5.42 while 3.6.0 sits at rc.7 as of the research date. Do not treat it as production-ready despite some secondary sources calling it 'confirmed stable.'"
    applies_to: "Vue 3.6.0-rc line only, not yet GA"
    source_ref: "research/technologies/vue.md §2, §12, §13"
  - claim: "Pinia support for Vue 2 was discontinued in 2025; Pinia docs now focus on Vue 3 only."
    applies_to: "Pinia, current version, Vue 2 unsupported"
    source_ref: "research/technologies/vue.md §3; research/knowledge-maps/version-matrix.md (Vue row)"
  - claim: "Vue Router v4.x targets Vue 3 and v3.x targets Vue 2; a v5.x is referenced on the intro page but its existence/status was not independently confirmed in the primary research pass."
    applies_to: "Vue Router, current lines; v5.x status Unresolved"
    source_ref: "research/technologies/vue.md §3, Unresolved note; research/knowledge-maps/version-matrix.md (Vue row)"
last_verified: "2026-09-10"
reverify_triggers:
  - Vue 3.6.0 stable release
  - Vue Router v5.x being officially confirmed or released
  - Any change to the Vue 2 EOL/extended-support status (e.g. a third-party extended-support program becoming officially endorsed by vuejs.org)

owned_knowledge:
  - Vue Composition API mechanics (ref/reactive/computed/watch, composables, toValue())
  - Vue SFC and <script setup> compiler-macro API and its version gates
  - Vue 3's Proxy-based reactivity vs. Vue 2's Object.defineProperty-based reactivity
  - Vapor Mode's opt-in scope and pre-stable status (3.6 line)
decision_framework_present: true

failure_handling:
  - If the installed Vue major (2.x vs. 3.x) cannot be determined from package.json/lockfile, ask before applying any version-sensitive API — never assume Vue 3 or "latest" silently (VA-3).
  - If a Vue 2 codebase is detected, state plainly that Vue 2 is EOL (no fixes/security patches from the core team) and default to recommending migration guidance over new Vue-2-specific feature work.
  - If shell is unavailable, produce advisory component/composable/config code and state that it was not run, built, or type-checked.
verification:
  - Every version-gated compiler macro (defineOptions/defineSlots, defineModel, Reactive Props Destructure) matches the confirmed installed Vue 3 minor.
  - Any Vapor Mode usage is flagged as pre-stable (3.6 RC) and not recommended for production without explicit user acceptance of that risk.
  - Any reactivity claim correctly attributes Proxy (v3) vs. Object.defineProperty (v2) to the right major version.
  - v-html usage is checked against the "never on user-provided content" rule before being proposed.
  - The Vue project's dev build is actually run (npm run dev or vite build) and confirmed to compile without errors, not just the component structure reviewed for correctness.
evaluation_criteria:
  - Given a seeded package.json pinning vue to a 3.5.x version, proposes Composition API code using only compiler macros valid at that minor (no 3.6-only or Vapor-only constructs).
  - Given a seeded Vue 2 codebase, states the EOL status explicitly and does not silently apply Vue-3-only reactivity/API assumptions.
  - When asked whether to adopt Vapor Mode for a new project, does not recommend it as the default without flagging its RC status and scoped incompatibilities.
  - Does not restate frontend-architecture's React-vs-Vue-vs-Angular comparison or its own reactivity-model/XSS-escaping/compiler/test-runner table verbatim (QR-2).
  - For a Pinia vs. Vuex/other state-management question, recommends Pinia with the documented rationale (TS inference, Composition-API style, Devtools, SSR) unless the codebase already commits to Vuex.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["**/*.vue", "**/vite.config.*", "**/pinia/**"]
  vscode:
    argument_hint: "<task, e.g. 'convert this component to <script setup>' or 'add a Pinia store'>"
