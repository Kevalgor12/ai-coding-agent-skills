id: SK-TECH-vue
slug: vue
name: Vue
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-001, SK-FE-005]

purpose: >-
  Apply Vue correctly and version-appropriately — Composition API and SFC
  mechanics, Proxy-based reactivity, Pinia/Vue Router integration, and the
  Vue 2 (EOL) to Vue 3 split — specializing the frontend-architecture and
  rendering-strategy parent skills with Vue-specific, cited, version-aware
  detail.
scope: >-
  Vue-specific implementation detail: the Composition API, `<script setup>`
  SFC compiler macros, Proxy-based (v3) vs. Object.defineProperty-based (v2)
  reactivity, the v2-EOL/v3 split, and the pre-stable Vapor Mode (3.6 line).
  Does not repeat the React-vs-Vue-vs-Angular framework-selection comparison
  (owned by frontend-architecture) or the SSR/SSG rendering-mode decision
  (owned by rendering-strategy). Not Nuxt-specific
  meta-framework concerns (owned by the Nuxt technology skill).
expertise: Vue engineer maintaining a Vue 3 codebase, aware of the Vue 2 EOL boundary and the pre-stable Vapor Mode line.
description: >-
  Vue-specific implementation: Composition API vs. Options API, SFC mechanics
  (`<script setup>` compiler macros), Proxy-based reactivity (v3) vs.
  Object.defineProperty (v2, EOL 2023-12-31), Pinia, Vue Router, and the
  pre-stable Vapor Mode (3.6 line). Use when vue/@vue, a .vue SFC,
  @vitejs/plugin-vue, Vue Router, or Pinia is present, or the task names Vue.
  Not for React/Angular, generic framework selection, or the SSR/SSG
  rendering-mode decision (frontend-architecture/rendering-strategy).

activation_conditions:
  - vue and/or @vue/* packages appear in package.json, a lockfile, or an import statement
  - One or more .vue Single-File Component files are present in the repo
  - vue-router, pinia, or @vitejs/plugin-vue is present, or a vite.config with the Vue plugin is present
  - The task names Vue, the Composition API, Options API, SFCs, Pinia, Vue Router, or Vapor Mode specifically
non_activation_conditions:
  - The codebase uses React or Angular instead (route to that technology skill)
  - A framework choice is still open with no framework chosen yet (route to frontend-architecture, SK-FE-001)
  - The question is the SSR/SSG rendering-mode decision itself, independent of Vue specifics (route to rendering-strategy, SK-FE-005)
  - The task is Nuxt-specific meta-framework concern (Nitro, routeRules, universal rendering config) with no Vue-core question (route to SK-TECH-nuxt)
activation_mode: auto

inputs:
  - name: task
    description: The Vue-specific task (component/composable design, reactivity, SFC authoring, state management, migration, Vapor Mode adoption question).
    required: true
  - name: installed-version-line
    description: Which Vue line is pinned — 2.x (EOL), 3.x stable (up to 3.5), or 3.6 RC/Vapor Mode — from package.json/lockfile.
    required: false
required_context:
  - Whether the codebase is Vue 2 or Vue 3 — the reactivity model, SFC compiler-macro surface, and most APIs differ enough between majors that guidance is wrong without this.
optional_context:
  - Whether Pinia or Vuex is already in use for state management.
  - Whether the project targets SSR (via Nuxt) or is a pure SPA.
  - Whether any 3.6/Vapor Mode pre-release is intentionally installed.

outputs:
  - name: component-or-composable-code
    kind: edit
    description: Vue SFC/component or composable code correct for the confirmed version line (Options or Composition API).
  - name: state-or-router-config
    kind: edit
    description: Pinia store definition or Vue Router configuration.
  - name: analysis
    kind: analysis
    description: The determined Vue version line and which v2-vs-v3 or Vapor Mode caveats apply to the task at hand.

depends_on_skills: []
related_skills: [SK-TECH-nuxt, SK-TECH-typescript]
conflicts_with: [SK-TECH-react, SK-TECH-angular]

required_capabilities: [file-read, file-write, shell]
execution_tier: B

