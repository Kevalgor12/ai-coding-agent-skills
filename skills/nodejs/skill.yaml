covered_versions:
  nodejs: "current: 26.x (26.8.2); active LTS: 24.x 'Krypton' (24.21.0); maintenance LTS: 22.x 'Jod'"
version_sensitive_claims:
  - claim: >-
      Node.js is retiring its twice-yearly odd/even release cadence starting
      with v27: a 6-month Alpha channel (Oct–Mar, not for production), then
      6 months as Current (Apr–Oct), then 30 months of LTS — 36 months total
      support, delivered as one continuous line instead of split odd/even
      lines. v26 is the last release under the old six-month/odd-even model.
    applies_to: "v27+ (v27 enters Alpha Oct 2026); v26 is the last release under the prior model"
    source_ref: "research/technologies/nodejs.md §12, https://nodejs.org/en/blog/announcements/evolving-the-nodejs-release-schedule"
  - claim: >-
      CVE-2026-58043 (HIGH): the Permission Model's path-matching logic could
      over-grant filesystem access across radix-tree prefix boundaries under
      `--permission`, patched in a coordinated security release alongside 10
      other CVEs.
    applies_to: "Node.js lines prior to v26.5.1 / v24.18.1 / v22.23.2 (fixed 2026-07-29)"
    source_ref: "research/technologies/nodejs.md §7, https://nodejs.org/en/blog/vulnerability/july-2026-security-releases"
  - claim: >-
      Node.js 26.0.0 enables the Temporal API by default (a new global) and
      fully removes (not merely deprecates) crypto.createCipher()/
      createDecipher(), http.Server.prototype.writeHeader(), and the legacy
      _stream_* internal modules.
    applies_to: ">=26.0.0"
    source_ref: "research/technologies/nodejs.md §13, https://nodejs.org/en/blog/release/v26.0.0"
  - claim: The Permission Model (--permission) is Stable.
    applies_to: ">=23.5.0 / >=22.13.0 (flag renamed from --experimental-permission in v24.0.0)"
    source_ref: "research/technologies/nodejs.md §7/§13, https://nodejs.org/api/permissions.html"
  - claim: The built-in node:test module is available and Stable.
    applies_to: "available >=18.0.0; Stable >=20.0.0"
    source_ref: "research/technologies/nodejs.md §9, https://nodejs.org/api/test.html"
  - claim: >-
      Native TypeScript type-stripping progressed from experimental to
      default-on to Stable, and gained a --no-strip-types opt-out.
    applies_to: "experimental >=22.6.0; default-on >=23.6.0/22.18.0; Stable >=25.2.0/24.12.0; --no-strip-types added in 26.0.0"
    source_ref: "research/technologies/nodejs.md §1/§4/§13, https://nodejs.org/api/typescript.html"
last_verified: "2026-09-10"
reverify_triggers:
  - "Node.js v27 release (Oct 2026)"
  - "Any further coordinated security release touching the Permission Model"
  - "A Node.js release line transitioning between Current / Active LTS / Maintenance LTS / EOL"

owned_knowledge:
  - Node.js event-loop phases and libuv worker-thread-pool internals
  - CommonJS vs ESM module-system mechanics and interop
  - Node.js concurrency-primitive selection (worker_threads vs child_process vs cluster)
  - Node.js Permission Model mechanics and documented limitations
  - Node.js release-line/version-cadence policy (including the v27 annual-release change)

decision_framework_present: true

failure_handling:
  - If the Node.js release line (Current/Active LTS/Maintenance LTS) cannot be determined, ask for it or explicitly state the line the guidance assumes; never assume "latest" silently (VA-3).
  - If shell is unavailable/denied, output advisory config/flag/code changes (package.json, tsconfig, CLI flags) and state that nothing was executed or verified.
verification:
  - Any Node.js version claim is tagged with the release line/range it applies to.
  - Permission Model guidance repeats its official "does not provide security against malicious code" caveat rather than presenting it as a sandbox against adversarial dependencies.
  - CPU-bound work is not routed to worker_threads/child_process/cluster when the actual bottleneck is I/O-bound, and vice versa.
evaluation_criteria:
  - For a seeded module-system decision, chooses CommonJS or ESM based on the project's actual constraints (interop needs, existing "type" field, dependency ecosystem) rather than defaulting to one.
  - For a seeded event-loop-blocking symptom, correctly diagnoses it as blocking (not a memory leak or GC pause) and proposes partitioning/offload per official guidance.
  - Cites the correct Current/Active-LTS/Maintenance-LTS line as of last_verified, and flags the v27 cadence change when the task touches version/upgrade planning.
  - Does not restate backend-architecture's runtime-selection framework or its layering/error-handling/shutdown method (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  vscode:
    argument_hint: "<task, e.g. 'should this be ESM or CommonJS' or 'diagnose event-loop blocking'>"
