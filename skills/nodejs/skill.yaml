id: SK-TECH-nodejs
slug: nodejs
name: Node.js
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-001]

purpose: >-
  Apply Node.js correctly and version-appropriately as the runtime underneath
  a backend service — its module system, event-loop/concurrency model,
  Permission Model, and release-line policy.
scope: >-
  Node.js-runtime specifics: CommonJS/ESM, the event loop and libuv thread
  pool, worker_threads/child_process/cluster, the Permission Model, node:test,
  and release-line/version policy. The generic backend-structure method
  (layering, middleware, DI, centralized error handling, graceful shutdown,
  and the Node-vs-Go-vs-Python runtime choice) comes from the parent skill
  (backend-architecture). Framework-level specifics (Express/Fastify routing,
  middleware ecosystems, schema validation) belong to their own technology
  skills, not here.
expertise: Node.js runtime engineer.
description: >-
  Node.js runtime specifics: CommonJS vs ESM, the event loop and libuv thread
  pool, worker_threads/child_process/cluster, the Permission Model, node:test,
  and release-line/version policy (including the v27 annual-release change).
  Use when the stack runs on Node.js and the question is runtime-level (module
  system, concurrency primitive, sandboxing, version support). Not for
  Express/Fastify framework specifics, generic backend structure (use
  backend-architecture), or other runtimes (Go, Python).

activation_conditions:
  - The project targets Node.js (package.json, .nvmrc, a Node engines field, or the task names it)
  - A CommonJS-vs-ESM, worker_threads-vs-child_process-vs-cluster, or Permission Model decision is open
  - A Node.js version/upgrade/EOL/security-release question is asked
  - An event-loop-blocking, memory, or CPU performance issue is suspected in a Node.js process
non_activation_conditions:
  - The stack runs on Go, Python, or another non-Node runtime (route to that skill)
  - The question is Express- or Fastify-specific routing/middleware/plugin behavior with the runtime itself not in question (route to SK-TECH-express or SK-TECH-fastify)
  - Generic backend layering/middleware/DI/error-handling/shutdown design with no Node.js-specific mechanism involved (route to SK-BE-001)
activation_mode: auto

inputs:
  - name: task
    description: >-
      The Node.js-runtime task (module-system choice, concurrency-primitive
      choice, Permission Model adoption, version/upgrade impact, or
      event-loop/performance diagnosis).
    required: true
  - name: existing-node-target
    description: The Node.js version(s) already targeted (package.json "engines", .nvmrc, CI matrix, Docker base image tag), if not greenfield.
    required: false
required_context:
  - The Node.js release line in use or targeted (Current / Active LTS / Maintenance LTS) — needed for version-correct guidance.
optional_context:
  - package.json ("type", "engines", dependencies, "exports"/"imports").
  - Existing profiling/diagnostic output (flame graph, heap snapshot, diagnostics_channel data) for a performance question.

outputs:
  - name: nodejs-runtime-guidance
    kind: analysis
    description: Version-correct guidance on module system, concurrency-primitive choice, Permission Model adoption, or a diagnosed event-loop/performance issue.
  - name: config-or-flag-change
    kind: edit
    description: package.json/tsconfig/CLI-flag or env-file changes reflecting the chosen module system, Permission Model allowlist, or runtime configuration.

depends_on_skills: []
related_skills: [SK-TECH-express, SK-TECH-fastify]
conflicts_with: [SK-TECH-go, SK-TECH-python]

required_capabilities: [file-read, file-write, shell]
execution_tier: B

