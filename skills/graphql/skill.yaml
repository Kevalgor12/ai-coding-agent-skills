covered_versions:
  graphql-spec: "June 2018 (first edition with formal SDL and subscription definitions, first marked production-suitable) through September 2025 (current ratified edition)"
  graphql-js: "16.x (legacy, still in use) and 17.x (current, released 2026-06-15 — requires Node.js 22/24/25/26+, TypeScript 4.4+)"

version_sensitive_claims:
  - claim: "graphql-js v17 requires Node.js 22, 24, 25, or 26+ and TypeScript typings target TS 4.4+."
    applies_to: "graphql-js >=17.0.0"
    source_ref: research/technologies/graphql.md §4, §12 (via www.graphql-js.org/upgrade-guides/v16-v17/)
  - claim: "graphql-js v17 execute() may return synchronously or as a Promise — callers must handle both return shapes, unlike v16 which always returned a Promise."
    applies_to: "graphql-js >=17.0.0"
    source_ref: research/technologies/graphql.md §13 (via www.graphql-js.org/upgrade-guides/v16-v17/)
  - claim: "graphql-js v17 removes the GraphQLError positional constructor; callers must use (message, options) object form."
    applies_to: "graphql-js >=17.0.0"
    source_ref: research/technologies/graphql.md §13 (via www.graphql-js.org/upgrade-guides/v16-v17/)
  - claim: "graphql-js v17 development mode is no longer implicitly driven by NODE_ENV; it must be enabled explicitly via a package condition or enableDevelopmentMode()."
    applies_to: "graphql-js >=17.0.0"
    source_ref: research/technologies/graphql.md §4, §13 (via www.graphql-js.org/upgrade-guides/v16-v17/)
  - claim: "In the GraphQL September 2025 spec, @skip/@include are disallowed on a root subscription operation's selection set; @deprecated was extended to field arguments, directive arguments, and input object fields."
    applies_to: "GraphQL spec September 2025 edition"
    source_ref: research/technologies/graphql.md §13 (via spec.graphql.org and github.com/graphql/graphql-spec/releases)
last_verified: "2026-09-09"
reverify_triggers:
  - A new graphql-js major release (v18 or later)
  - A new ratified GraphQL specification edition beyond September 2025
  - An official testing guide appearing at www.graphql-js.org/docs/testing/ (currently 404 as of research date)
  - Any change to the graphql-js Node.js minimum version requirement

owned_knowledge:
  - graphql-js SDL and programmatic schema authoring mechanics and version-correct API surface
  - graphql-js v16-to-v17 breaking-change inventory (execute() return shape, GraphQLError constructor, development mode, removed APIs)
  - DataLoader batching pattern as applied to graphql-js resolver context
decision_framework_present: true

failure_handling:
  - If the graphql-js (or Apollo Server) version is unknown, ask or check package.json before giving resolver or API guidance — v17 and v16 differ materially in execute() return type, GraphQLError constructor form, and development-mode configuration.
  - If shell is unavailable, produce advisory schema and resolver code and state explicitly that GraphQL Code Generator, schema introspection, and test execution were not run.
  - If asked for Apollo Server or Apollo Client specifics (datasource API, response-cache directives, InMemoryCache normalization policy) that are not in this library's research (research/technologies/graphql.md covers graphql-js and the spec, not Apollo), state that gap and direct to the official Apollo documentation rather than asserting Apollo-specific API detail.

escalation:
  - Disabling introspection or adding depth/cost limits to an already-public API is a consumer-facing breaking change — surface for explicit confirmation before applying.
  - A subscription architecture requiring horizontal scaling (clients distributed across multiple server instances) is a significant infrastructure choice — surface for explicit confirmation and route to realtime-communication (SK-BE-004) for scaling-topology guidance.

verification:
  - Run at least one representative query via the graphql-js graphql({ schema, source }) function in a test or via npx graphql-inspector introspect <endpoint> and confirm the schema validates without errors and the query returns the expected data shape — not just reviewed for SDL correctness.
  - Any graphql-js API used (execute() return-type handling, GraphQLError constructor form, development-mode flag) matches the version line actually in use (v16 vs. v17).
  - Nested-relationship resolvers use DataLoader-style batching (IDs collected per tick, dispatched as one batch) rather than per-item backend fetches inside the resolver body.

evaluation_criteria:
  - For a seeded schema with an N+1 resolver (per-item child fetch in a loop), identifies the pattern and replaces it with a DataLoader batch function.
  - For a v17 project, applies the correct execute() return-type handling (both sync and async) and uses the (message, options) GraphQLError constructor, not the removed positional form.
  - Correctly distinguishes claims backed by this library's graphql-js/spec research from Apollo-specific claims that require verification against Apollo's own documentation.
  - Does not restate the schema design method (type modeling, pagination shape, field-level auth design) owned by graphql-api-design (SK-BE-003).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running codegen, schema introspection, and graphql-js tests; abstract shell → CC tools
  cursor:
    paths: ["**/*.graphql", "**/*.gql", "**/schema/**", "**/resolvers/**", "**/codegen*", "**/graphql/**"]
  vscode:
    argument_hint: "<task, e.g. 'add a resolver with DataLoader' or 'configure graphql-codegen for typed hooks'>"
