    title: "GraphQL Learn — queries, schema, execution, best practices, security, performance, pagination, authorization, caching, subscriptions"
    via: research/technologies/graphql.md
    retrieved: "2026-09-09"
  - url: https://www.graphql-js.org/docs/
    title: "graphql-js Docs — getting started, constructing types, going to production (v17)"
    via: research/technologies/graphql.md
    retrieved: "2026-09-09"
