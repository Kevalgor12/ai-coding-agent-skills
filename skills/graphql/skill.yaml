id: SK-TECH-graphql
slug: graphql
name: GraphQL
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-003]   # graphql-api-design
# Note: the parent skill (SK-BE-003) owns the design-level decisions (type
# modeling, N+1-safe resolver structure, pagination, field-level auth, schema
# evolution). This skill specializes it with graphql-js implementation
# mechanics and version-correct API detail.

purpose: >-
  Implement GraphQL APIs correctly against the graphql-js reference
  implementation and the GraphQL specification — SDL schema authoring,
  resolver chains, DataLoader N+1 prevention, subscriptions, schema
  evolution, typed codegen, and production hardening.
scope: >-
  graphql-js-specific implementation mechanics: Schema Definition Language
  (SDL) types, resolver chains and context threading, DataLoader-based N+1
  prevention, authorization via context/business-logic layer, subscriptions
  over WebSocket, additive schema evolution via @deprecated, GraphQL Code
  Generator for typed clients, persisted queries for caching, and production
  hardening (depth/cost limits, error masking, introspection posture). The
  REST-vs-GraphQL paradigm decision and design-level concerns (type modeling,
  pagination shape, field-level auth design) are owned by the parent skill
  graphql-api-design (SK-BE-003). Federation/gateway architecture and
  Apollo-specific API details that are not in this library's research
  (research/technologies/graphql.md) require verification against Apollo's
  official docs — this skill does not assert Apollo-specific claims beyond
  what appears in the cited research.
expertise: Senior TypeScript/Node.js engineer specializing in GraphQL API implementation with graphql-js.
description: >-
  Implement GraphQL schemas and resolvers correctly — SDL types, resolver
  chains, N+1 prevention via DataLoader, subscriptions over WebSocket, schema
  evolution, typed codegen via GraphQL Code Generator, persisted queries, and
  production hardening (depth/cost limits, error masking). Use when the tech
  is GraphQL and the task is implementation, not for the REST-vs-GraphQL
  choice (graphql-api-design).

activation_conditions:
  - A .graphql or .gql schema file, or SDL type definitions in a JS/TS module, is present in the project
  - The graphql npm package, Apollo Server, or a GraphQL middleware package is a project dependency
  - The task involves writing or modifying GraphQL resolvers, schema types, subscriptions, or DataLoader batch functions
  - A GraphQL Code Generator config (codegen.ts or codegen.yml) is present or being set up
non_activation_conditions:
  - The REST-vs-GraphQL paradigm choice is still open (route to graphql-api-design, SK-BE-003)
  - A GraphQL schema design question about type modeling, pagination shape, or field-level authorization design with no implementation detail involved (route to graphql-api-design, SK-BE-003)
  - The task is non-GraphQL API work (route to api-design, SK-BE-002)
activation_mode: auto

inputs:
  - name: task
    description: The GraphQL implementation task (schema authoring, resolver writing, subscription setup, codegen config, production hardening, or a v16-to-v17 upgrade).
    required: true
  - name: schema-and-resolvers
    description: Existing .graphql SDL files, resolver modules, and the graphql-js (or Apollo Server) version pinned in package.json.
    required: false
required_context:
  - The graphql-js (or Apollo Server) version in use — resolver API shapes, execute() return type, GraphQLError constructor, and development-mode configuration differ materially between v16 and v17.
optional_context:
  - Whether subscriptions are needed (WebSocket transport adds per-connection state and horizontal-scaling constraints).
  - The client technology (plain HTTP, Apollo Client, Relay) — affects schema conventions such as the Relay cursor-pagination shape and Node interface.
  - Whether GraphQL Code Generator is in use or planned.

outputs:
  - name: schema-or-resolver-code
    kind: edit
    description: SDL type definitions and/or resolver implementations with DataLoader batch functions, version-correct for the pinned graphql-js release.
  - name: codegen-config
    kind: edit
    description: GraphQL Code Generator configuration producing typed TypeScript operation types or client hooks, where applicable.
  - name: analysis
    kind: analysis
    description: Production-readiness assessment covering depth/cost limits, error masking, introspection posture, and caching strategy, with rationale.

depends_on_skills: []
# Policy: depends_on_skills is reserved for hard, blocking sub-step composition.
# The relationship to the parent (SK-BE-003) is specialization, captured by the
# parents field. SK-BE-003 is not a blocking sub-step of this skill's execution.
related_skills: [SK-BE-003, SK-BE-004]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: writing schema/resolver code is advisory; running GraphQL Code
# Generator, schema introspection (graphql-inspector), or the graphql()
# execution function in a test requires shell. No capability_fallbacks block
# required (Tier B, not C) — degrades to advisory per failure_handling below.

grounding: official-docs
