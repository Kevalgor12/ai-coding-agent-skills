    title: "graphql-js — v16 to v17 upgrade guide (breaking changes, new APIs, Node/TS requirements)"
    via: research/technologies/graphql.md
    retrieved: "2026-09-09"
  - url: https://spec.graphql.org/
    title: "GraphQL Specification — September 2025 edition (current ratified)"
    via: research/technologies/graphql.md
    retrieved: "2026-09-09"
