covered_versions:
  sentry-javascript: ">=8.0.0 <=10.74.0 (11.0.0-beta.2 in active beta, not GA)"
  sentry-python: "2.69.1 (current on PyPI; classifiers declare Python 3.6-3.15 support)"
version_sensitive_claims:
  - claim: The previously-shipped custom Metrics API was removed entirely from the JS/Node SDK (not merely deprecated) — the strongest evidence Sentry is not a Prometheus-style metrics platform.
    applies_to: "sentry-javascript >=9.0.0"
    source_ref: research/technologies/sentry.md (Section 13, v8→v9 migration guide)
  - claim: The SDK's internal OpenTelemetry dependency floor was raised to OTel 2.x/0.20x.x; projects unable to adopt OTel v2 are directed to stay on Sentry SDK v9 or adopt @sentry/node-core.
    applies_to: "sentry-javascript >=10.0.0"
    source_ref: research/technologies/sentry.md (Section 13, v9→v10 migration guide)
  - claim: Node.js minimum runtime raised to 18.0.0 (18.19.0+/19.9.0+ recommended for TracingChannel features).
    applies_to: "sentry-javascript >=9.0.0"
    source_ref: research/technologies/sentry.md (Sections 11-13)
  - claim: Node.js minimum runtime raised to 14.18.0, and the require/import-before-any-other-package initialization-ordering requirement was introduced.
    applies_to: "sentry-javascript >=8.0.0"
    source_ref: research/technologies/sentry.md (Section 11/13, v7→v8 migration guide)
  - claim: sendDefaultPii is deprecated on the JS/Node SDK in favor of a dataCollection option (Python SDK's send_default_pii is unaffected).
    applies_to: "sentry-javascript >=11.0.0-beta.2 (deprecation announced; removal targeted for v11)"
    source_ref: research/technologies/sentry.md (Section 4)
last_verified: "2026-09-10"
reverify_triggers:
  - Sentry JavaScript SDK v11.0.0 reaches general availability (currently 11.0.0-beta.2)
  - A new JS/Node SDK major-version migration guide is published (post-v10)
  - The Python SDK publishes an itemized major-version breaking-changes/migration guide (none found as of this research pass)
  - The default server-side data-scrubbing field list becomes documented (currently Unresolved per research)

owned_knowledge:
  - Sentry SDK architecture and initialization-ordering requirement (instrument.js-first)
  - DSN structure and public/secret status
  - Release tracking and source-map/Debug-ID upload workflow
  - Sentry JS/Node SDK major-version breaking-change history (v7→v8→v9→v10→v11-beta)
  - The specific depth of the Sentry↔OpenTelemetry dependency relationship
decision_framework_present: true

failure_handling:
  - If the Sentry SDK/version in use can't be determined, ask or explicitly state the version range the guidance assumes (JS SDK 8.x-10.x current stable, v11 in beta; Python SDK 2.x) rather than assuming "latest" silently (VA-3).
  - If shell is unavailable, output advisory Sentry.init()/sentry_sdk.init() config and CI workflow snippets, and state that no CLI upload, release creation, or migration was executed.
verification:
  - SDK initialization happens before any other module import/require (Node/JS instrument.js-first ordering) per the documented requirement.
  - Any beforeSend/beforeSendTransaction PII-scrubbing hook is present before enabling sendDefaultPii or attaching user/request context.
  - Release/source-map steps produce Debug IDs and run before the corresponding deploy, not after.
  - Every version-specific claim made is tagged with the SDK major-version range it applies to.
evaluation_criteria:
  - For a seeded Node.js/Express or Fastify service, produces an instrument.js-first Sentry.init() with correct ordering and the documented framework error-handler wiring (setupExpressErrorHandler/setupFastifyErrorHandler).
  - Correctly distinguishes when Sentry's own tracing is sufficient vs. when broader OpenTelemetry instrumentation is the right call, per the decision framework.
  - Does not restate observability's signal-selection method, PII-scrubbing pattern, or sampling-tuning guidance already owned by SK-QA-004 (QR-2).
  - Any claim about a v8/v9/v10 breaking change is correctly scoped to the version range it applies to.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["**/instrument.*", "**/sentry.*.config.*", "**/sentry.properties"]
  vscode:
    argument_hint: "<task, e.g. 'wire up Sentry release + source maps in CI' or 'migrate SDK v9 to v10'>"
