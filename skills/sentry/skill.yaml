id: SK-TECH-sentry
slug: sentry
name: Sentry
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-QA-004]

purpose: >-
  Apply Sentry correctly and version-appropriately — SDK architecture and init
  ordering, the four product surfaces (errors, tracing, Session Replay, Logs),
  DSN mechanics, release/source-map workflow, and the JS SDK's deep dependency
  on OpenTelemetry.
scope: >-
  Sentry-specific SDK implementation depth (JS/Node and Python SDKs), release/
  source-map CI workflow, DSN and layered PII-scrubbing architecture, and
  major-version migration history. The generic signal-selection method,
  PII-scrubbing pattern, and sampling-tuning guidance come from the parent
  skill (`SK-QA-004`, observability) and are not repeated here. Not metrics
  storage/PromQL (`SK-TECH-prometheus`), dashboarding (`SK-TECH-grafana`), or
  vendor-neutral instrumentation standards (`SK-TECH-opentelemetry`) — Sentry
  composes with OpenTelemetry rather than replacing it.
expertise: Senior/principal engineer operating Sentry error/trace/session monitoring in production.
description: >-
  Sentry-specific error monitoring, tracing, Session Replay, and trace-connected
  Logs — SDK init ordering, DSN mechanics, release/source-map workflow, layered
  PII scrubbing, and the JS SDK's OpenTelemetry-backed tracing (v8+). Use when
  @sentry/* (Node/browser/framework) or Python sentry-sdk is present, or the
  task names Sentry, fingerprinting, Session Replay, or Sentry Logs. Not for
  generic observability method or metrics/dashboards (use prometheus/grafana).

activation_conditions:
  - An `@sentry/*` package (node, browser, nextjs, react, express, fastify, profiling-node, ...) is present in package.json
  - The Python `sentry-sdk` package is present in requirements/pyproject
  - A Sentry DSN is configured (`SENTRY_DSN` env var, `dsn` init option, or `instrument.(js|mjs)`/`sentry.*.config.ts` files)
  - The task names Sentry, issue fingerprinting, Session Replay, Sentry Logs, release/source-map upload, or a Sentry SDK migration (v7→v8, v8→v9, v9→v10)
non_activation_conditions:
  - Generic signal-selection, PII-scrubbing-pattern, or sampling-tuning guidance with no Sentry SDK involved (route to `SK-QA-004`, observability)
  - Metrics storage, PromQL, or scrape-config work (route to `SK-TECH-prometheus`)
  - Dashboarding/visualization work with no Sentry product surface involved (route to `SK-TECH-grafana`)
  - Vendor-neutral instrumentation-standard design with Sentry not in the stack (route to `SK-TECH-opentelemetry`)
activation_mode: auto

inputs:
  - name: task
    description: The Sentry-specific task (SDK init/config, release/source-map setup, PII-scrubbing hook, alert routing, SDK major-version migration).
    required: true
  - name: sdk-and-version
    description: Which Sentry SDK (JS/Node, Python, framework-specific) and its current version, if known.
    required: false
outputs:
  - name: sdk-config
    kind: edit
    description: Sentry.init()/sentry_sdk.init() configuration, instrumentation-file ordering, beforeSend/beforeSendTransaction hooks.
  - name: release-pipeline-change
    kind: edit
    description: Release/source-map upload wiring (sentry-cli, bundler plugin, Sentry Wizard, or getsentry/action-release CI step).
  - name: analysis
    kind: analysis
    description: Findings on SDK version compatibility, sampling/profiling trade-offs, or migration breaking-change impact, tagged with the version range each claim applies to.

depends_on_skills: []
related_skills: [SK-TECH-opentelemetry]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B

