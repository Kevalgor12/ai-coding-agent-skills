id: SK-TECH-webrtc
slug: webrtc
name: WebRTC
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-004]   # realtime-communication (transport selection + connection/scaling/auth method)

purpose: >-
  Implement WebRTC's peer-to-peer connection mechanics correctly:
  RTCPeerConnection/ICE/STUN/TURN establishment, SDP offer/answer and perfect
  negotiation, RTCDataChannel usage, and the mandatory DTLS-SRTP security
  model — the concrete WebRTC-specific specialization of the parent skill's
  transport method for the peer-to-peer case.
scope: >-
  WebRTC-specific implementation detail only. The transport-selection
  judgment (WebRTC vs. WebSocket/Socket.IO/SSE) and the generic
  connection-lifecycle/scaling/handshake-auth framework are owned by the
  parent skill (SK-BE-004, realtime-communication) and not repeated here.
  This skill covers what's structurally unique to WebRTC's peer-to-peer
  model: out-of-band signaling (which WebRTC does not itself provide),
  ICE/STUN/TURN mechanics, SDP negotiation, RTCDataChannel configuration, and
  WebRTC-specific security/performance/testing depth.
expertise: WebRTC / real-time-media engineer.
description: >-
  WebRTC-specific peer-to-peer implementation: RTCPeerConnection/ICE/STUN/TURN
  connection establishment, SDP offer/answer and the perfect-negotiation
  pattern, RTCDataChannel usage, mandatory DTLS-SRTP security, and the
  Plan-B-to-Unified-Plan SDP history. Use when integrating RTCPeerConnection,
  getUserMedia/getDisplayMedia, or RTCDataChannel for true peer-to-peer
  media/data. Not for choosing among realtime transports (realtime-
  communication) or server-mediated WebSocket/Socket.IO implementation.

activation_conditions:
  - The task integrates RTCPeerConnection, getUserMedia/getDisplayMedia feeding a peer connection, or RTCDataChannel
  - The task names WebRTC mechanics (ICE, STUN, TURN, SDP offer/answer, signaling for a peer connection, DTLS-SRTP)
  - An existing WebRTC integration's negotiation, NAT-traversal/TURN, or data-channel design needs review
non_activation_conditions:
  - The peer-to-peer-vs-server-mediated transport choice is still open (route to SK-BE-004 first)
  - The need is server-mediated realtime (broadcast/discrete events) with no peer-to-peer requirement (route to socketio or websocket-api)
  - Only camera/mic capture UI or permissions (Media Capture and Streams API) are involved with no RTCPeerConnection in play
activation_mode: auto

inputs:
  - name: task
    description: The WebRTC implementation task (peer connection setup, signaling design, ICE/TURN configuration, data channel usage, renegotiation, codec/privacy configuration).
    required: true
  - name: signaling-transport
    description: The out-of-band signaling transport already chosen or available (WebSocket, HTTP polling, etc.) — WebRTC does not define one itself.
    required: false
  - name: existing-peer-connection-code
    description: Existing RTCPeerConnection/signaling code, if this is not greenfield.
    required: false
required_context:
  - Whether an out-of-band signaling transport already exists or needs to be built, since WebRTC does not provide one itself
optional_context:
  - Target browser/platform matrix (for codec-support and legacy Plan-B-SDP concerns)
  - Whether TURN infrastructure is already provisioned or needs deployment
  - Whether IP-address privacy from the remote peer is a hard requirement (drives iceTransportPolicy)

outputs:
  - name: peer-connection-signaling-design
    kind: analysis
    description: RTCPeerConnection configuration (iceServers, iceTransportPolicy), ICE/TURN setup, and the signaling message-flow design.
  - name: code
    kind: edit
    description: RTCPeerConnection/data-channel implementation (perfect-negotiation logic, ICE-restart handling, data-channel configuration).
  - name: analysis
    kind: analysis
    description: Recommendations on iceTransportPolicy, codec selection, and P2P-vs-server-mediated infrastructure trade-offs, with rationale.

depends_on_skills: []
# depends_on_skills is reserved for hard, blocking sub-step composition, not
# specialization. This skill's relationship to SK-BE-004 is "I am the
# WebRTC-specific version of that skill's method" — already fully captured by
# `parents` above. Listing SK-BE-004 here too would be redundant and assert a
# stronger claim (blocking invocation) than specialization actually is — see
# specification.md §2.5, and the explicit warning that this exact mistake was
# made by 7 of 9 technology skills in an earlier batch.
related_skills: []
# No other skill in this library's current catalog has a strong documented
# relationship to WebRTC specifically (source data records no `alternativesTo`
# for it) — left empty rather than forcing one.
conflicts_with: []
# Per technology-decision-matrix.md §6, WebRTC "carries no recorded
# alternativesTo" and appears in the realtime-networking comparison only
# because it shares that category with WebSocket/Socket.IO, not because any
# source frames it as a substitute for a server-mediated transport
# (peer-to-peer vs. server-mediated are structurally different, not
# competing options for the same decision).

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Proposing RTCPeerConnection/signaling code and configuration is advisory
# (file-only); a signaling-server implementation, running a local TURN
# server, or executing the CI/headless fake-media test flags needs shell.
# No capability_fallbacks block required (Tier B, not C) — degrades to
# advisory per failure_handling if shell is unavailable.

