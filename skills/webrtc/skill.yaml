    allowed_tools: [Bash, Read, Edit]   # for a signaling-server implementation and headless/CI test flags
  cursor:
    paths: ["**/*.ts", "**/*.js", "**/signaling/**"]
  vscode:
    argument_hint: "<task, e.g. 'implement peer connection negotiation' or 'add a TURN fallback'>"
