covered_versions:
  webrtc: "1.0 (W3C Recommendation, published 2025-03-13); the living Editor's Draft (w3c.github.io/webrtc-pc/) continues to evolve separately from the fixed Recommendation text; working group chartered through 2026-09-30"
version_sensitive_claims:
  - claim: >-
      Chrome's Plan B → Unified Plan SDP-semantics transition: M65
      (Unified Plan behind an experimental flag) → M69/Sept 2018 (GA,
      default still Plan B) → M72/Jan 2019 (default switched to Unified
      Plan) → M93 (Canary starts throwing on `sdpSemantics: "plan-b"`) →
      M96 (throws across all channels including Stable).
    applies_to: "Chrome-specific milestones M65–M96; binding (plan-b throws) for all Chrome >=M96"
    source_ref: research/technologies/webrtc.md §12-13; webrtc.org/getting-started/unified-plan-transition-guide
  - claim: "AV1 video-codec support at Chrome 113+ and Firefox 136+; HEVC/H.265 support at Chrome 136+."
    applies_to: "point-in-time as captured 2026-09-09 (Chrome >=113/136, Firefox >=136); MDN compatibility tables update continuously and must be re-checked before treating these as current"
    source_ref: research/technologies/webrtc.md §8, §12; MDN WebRTC_codecs
  - claim: "Firefox for Android versions 68–72 lacked H.264 support, due to Google Play store requirements."
    applies_to: "Firefox for Android 68–72"
    source_ref: research/technologies/webrtc.md §14; MDN WebRTC_codecs
  - claim: "Safari VP8 support was added at Safari 12.1+."
    applies_to: ">=12.1"
    source_ref: research/technologies/webrtc.md §12; MDN WebRTC_codecs
last_verified: "2026-09-10"
reverify_triggers:
  - The WebRTC Working Group's charter (through 2026-09-30) is renewed or lapses — confirm status
  - A periodic codec-support-by-browser-version re-check (AV1/HEVC/VP9 gates shift frequently and are explicitly flagged point-in-time)
  - A Chrome/Firefox SDP-semantics-class breaking change comparable to Plan B → Unified Plan is announced
  - The W3C publishes a WebRTC 1.0 errata/new Recommendation revision, or the editor's draft diverges materially from the 2025-03-13 Recommendation text

owned_knowledge:
  - RTCPeerConnection/ICE/STUN/TURN connection-establishment mechanics (candidate gathering/exchange, controlling/controlled agent)
  - SDP offer/answer negotiation and the perfect-negotiation pattern (polite/impolite roles, glare handling)
  - The Plan B → Unified Plan SDP-semantics history
  - RTCDataChannel configuration and limits (negotiated/id, message-size ceiling, head-of-line-blocking mitigation)
  # Cross-cutting security/performance/testing depth is NOT owned here — the
  # generic transport-comparison/DTLS-SRTP/backpressure synthesis is owned by
  # SK-BE-004; referenced, not restated.

decision_framework_present: true

failure_handling:
  - If no out-of-band signaling transport exists yet, treat building one as an explicit task rather than assuming it's already solved — WebRTC does not define signaling itself.
  - If shell is unavailable or denied, degrade to advisory RTCPeerConnection/signaling code and configuration guidance, and state that no signaling server, TURN deployment, or headless test run was actually executed.
  - If the target browser/platform matrix is unknown, do not assert codec-support or Plan-B/Unified-Plan-compatibility claims as universal — state the assumption or ask.
escalation:
  - Deploying dedicated TURN infrastructure (self-hosted, e.g. coturn, vs. a managed provider) is a real cost/operations decision — present the trade-off and get confirmation rather than provisioning unilaterally.
  - "Forcing `iceTransportPolicy` to relay-only for every connection trades connection reliability/latency and TURN bandwidth cost for IP-address privacy — a product-level decision, not defaulted silently either way."
  - "Legacy code still specifying the plan-b `sdpSemantics` value is broken on modern Chrome (throws since M96) — flagged for explicit migration confirmation rather than silently patched around."
verification:
  - Signaling messages carry enough peer identification (target/peer id) to work as a plain message router, independent of whatever transport was chosen for signaling.
  - Perfect-negotiation state (`makingOffer`, polite/impolite role, `isSettingRemoteAnswerPending`) is implemented symmetrically for both peers, not asymmetric caller/callee-specific logic.
  - ICE-restart handling exists for `iceConnectionState === "failed"`.
  - When a data channel is used, message sizing and `bufferedamountlow` monitoring are addressed.
  - Every version-specific claim (Plan-B/Unified-Plan timeline, codec-by-browser-version) is tagged with the range it holds for.
  - A test connection is actually established between two peers (or using a WebRTC emulator with fake media/data) and ICE negotiation is observed to complete, with data or media confirmed to flow between the peers.
evaluation_criteria:
  - For a seeded peer-to-peer feature request, produces a working perfect-negotiation implementation (not ad hoc caller/callee logic) with ICE-restart handling.
  - Configures `iceServers` with both STUN and TURN, and makes an explicit `iceTransportPolicy` recommendation given the stated IP-privacy/latency requirement.
  - "Correctly flags legacy plan-b `sdpSemantics` code as broken on modern Chrome rather than treating it as still viable."
  - Does not restate SK-BE-004's WebSocket-vs-Socket.IO-vs-WebRTC transport comparison or its generic connection-lifecycle/scaling/handshake-auth framework (rule QR-2).
  - Any codec-support-by-browser-version claim is flagged as point-in-time/subject to re-verification, not asserted as permanently current.

