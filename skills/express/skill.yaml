covered_versions:
  express-4x: ">=4.22 (latest-4 dist-tag = 4.22.2, published 2026-05-11; still actively patched, Node.js >=0.10 required)"
  express-5x: ">=5.2 (latest dist-tag = 5.2.1, published 2025-12-01; current npm default, Node.js >=18 required)"
version_sensitive_claims:
  - claim: >-
      Express 5.x's route-matching engine is built on a newer path-to-regexp
      version requiring named wildcards (*splat / {*splat}) and brace-based
      optional segments ({.:ext}), replacing 4.x's /*, :file.:ext?, and [a|b]
      alternation syntax — a real breaking change for non-trivial 4.x routes.
    applies_to: "5.x (breaking vs. all 4.x and earlier)"
    source_ref: research/technologies/express.md §3, §11, §13; research/knowledge-maps/version-matrix.md Part 3 Express
  - claim: >-
      Node.js version floor is version-line-specific, not one Express-wide
      number: 5.x requires Node.js >=18; 4.x requires Node.js >=0.10; 3.x
      (EOL 2015) required Node.js >=0.8.0; 2.x (EOL 2012) required Node.js >=0.4.1.
    applies_to: "per major line, as stated"
    source_ref: research/technologies/express.md §12; research/knowledge-maps/version-matrix.md Part 1, Part 3 Express
  - claim: >-
      app.query(path, callback), which routes the HTTP QUERY method, requires
      Node.js >=20.19.3 or >=22.2.0 — a stricter floor than Express 5.x's own
      Node.js >=18 requirement.
    applies_to: "5.x only"
    source_ref: research/technologies/express.md §3
  - claim: >-
      Native execution of .ts files (node src/app.ts, no build step) requires
      Node.js >=22.18.0 (or >=23.6.0 on the v23 line) with TypeScript >=5.8 —
      a Node.js type-stripping capability, not an Express feature, so it
      applies the same regardless of the Express major version in use.
    applies_to: "any Express version; gated by Node.js/TypeScript version, not Express version"
    source_ref: research/technologies/express.md §4
  - claim: >-
      express.urlencoded()'s extended option default flipped from true (4.x)
      to false (5.x); req.body is undefined (not {}) when no body-parsing
      middleware ran in 5.x; req.query became a read-only getter with default
      parser "simple" (was "extended") in 5.x.
    applies_to: "5.x (changed from 4.x default behavior)"
    source_ref: research/technologies/express.md §11, §13
  - claim: >-
      npm dist-tags: "latest" = 5.2.1 (2025-12-01); "latest-4" = 4.22.2
      (2026-05-11) — the 4.x line continues receiving patches after 5.x
      became the npm default, so both lines are simultaneously live and
      supported, not superseded/abandoned.
    applies_to: "both lines, as of the research snapshot date"
    source_ref: research/technologies/express.md §12; research/knowledge-maps/version-matrix.md Part 3 Express
last_verified: "2026-09-10"
reverify_triggers:
  - A new Express major release (6.x) or publication of its migration guide
  - expressjs.com/en/support/ changing 4.x's status from "Ongoing" to a stated EOL date (a third-party/commercial source already claims an informal maintenance-phase target, unconfirmed officially — see Security/references)
  - A new path-to-regexp major version altering 5.x route-syntax further
  - Official confirmation or correction of the Unresolved CVE-2024-51999 (5.2.0→5.2.1) status on an expressjs.com-hosted security page

owned_knowledge:
  - Express middleware pipeline mechanics and the app/router/request/response API surface
  - Express 4.x-vs-5.x route-syntax and default-behavior migration specifics
decision_framework_present: true

failure_handling:
  - If the Express major version (4.x vs 5.x) cannot be determined, ask or state explicitly which version the guidance assumes — never silently assume "latest"/5.x, since 4.x is still actively maintained and widely deployed (VA-3).
  - If shell is unavailable, output advisory code/config edits and state that install/build/test commands were not run.
verification:
  - Route-path syntax used (wildcards, optional segments, alternatives) matches the project's actual Express major version.
  - Error-handling middleware (4-arg signature) is registered last, after all other app.use()/route registrations.
  - Any security-hardening recommendation cites a specific documented CVE/fixed-version rather than a vague "update your dependencies."
evaluation_criteria:
  - For a seeded Express 4.x app, does not introduce 5.x-only route syntax (named wildcards, brace optional segments) or 5.x-only defaults (urlencoded extended:false) that would break on 4.x.
  - For a seeded Express 5.x migration task, correctly identifies the route-syntax, req.body/req.query, and urlencoded-default changes.
  - For a seeded production-hardening task, recommends helmet, session-cookie renaming, and rate limiting, citing the two named CVEs with their precise fixed versions.
  - Does not restate the Fastify-vs-Express comparison already owned by backend-architecture (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["**/routes/**", "**/middleware/**", "**/app.js", "**/app.ts", "**/server.js", "**/server.ts"]
  vscode:
    argument_hint: "<task, e.g. 'add auth middleware' or 'migrate to Express 5'>"
