id: SK-TECH-express
slug: express
name: Express
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-001, SK-BE-002]

purpose: >-
  Apply Express correctly and version-appropriately — middleware pipeline,
  routing API, error handling, and the 4.x/5.x route-syntax break — as the
  Express-specific specialization of backend structuring and HTTP API design.
scope: >-
  Express implementation detail: middleware/routing API, configuration,
  version-specific behavior (4.x vs 5.x), and Express-specific hardening.
  Not the generic backend-structure method (backend-architecture), the HTTP
  contract method (api-design), or the Fastify-vs-Express framework-choice
  comparison (already owned by backend-architecture) — only Express-specific
  depth is added here.
expertise: Express/Node.js backend engineer.
description: >-
  Express-specific middleware pipeline, routing API (app/router/request/response
  objects), and the 4.x-vs-5.x path-to-regexp route-syntax break. Use when the
  stack is Express (require/import express, express.Router(), app.listen) or
  the task names Express specifically. Not for generic backend structuring
  (backend-architecture), the Fastify-vs-Express framework choice (already
  covered there), or other Node frameworks (Fastify, Koa, Hapi).

activation_conditions:
  - "The stack uses Express (require('express')/import express, app.listen, express.Router())"
  - package.json/lockfile lists express as a dependency
  - The task names Express specifically (e.g. "add Express middleware", "migrate to Express 5")
non_activation_conditions:
  - No framework has been chosen yet / a generic backend-structuring question (route to backend-architecture, SK-BE-001)
  - The Fastify-vs-Express framework choice itself needs making (already owned by backend-architecture, route there)
  - The stack uses Fastify, Koa, Hapi, or a non-Node runtime (route to that technology's skill)
activation_mode: auto

inputs:
  - name: task
    description: The Express-specific task (add middleware/routes, fix error handling, migrate 4.x to 5.x, harden security/config).
    required: true
  - name: express-version-context
    description: The Express major version (4.x or 5.x) and Node.js version in use, ideally from package.json/lockfile.
    required: false
required_context:
  - Whether the project is on Express 4.x or 5.x — route syntax and several defaults differ materially between the two
optional_context:
  - The Node.js version in use (gates app.query, native .ts execution)
  - Whether native TypeScript execution or a build step (tsc/esbuild/tsx) is preferred

outputs:
  - name: middleware-or-route-code
    kind: edit
    description: Express middleware/route/error-handler code correct for the project's major version.
  - name: migration-notes
    kind: analysis
    description: 4.x-to-5.x migration guidance when upgrading, including route-syntax and default-behavior changes.
  - name: hardening-config
    kind: edit
    description: Security middleware/config (helmet, trust proxy, session hardening, rate limiting) appropriate to the deployment.

depends_on_skills: []
related_skills: [SK-TECH-nodejs]
conflicts_with: [SK-TECH-fastify]

required_capabilities: [file-read, file-write, shell]
execution_tier: B

