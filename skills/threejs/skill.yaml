covered_versions:
  threejs: >-
    r-number release scheme, no semver (r186 = npm 0.186.0); WebGL 2
    required (WebGLRenderer) since r163; reference point r186, the current
    stable release per research/technologies/threejs.md §12.
version_sensitive_claims:
  - claim: >-
      WebGLRenderer requires WebGL 2; WebGL 1 support is not available.
      "WebGL 1 is not supported since r163."
    applies_to: ">=r163"
    source_ref: research/technologies/threejs.md §12; threejs.org/docs/pages/WebGLRenderer.html.md
  - claim: >-
      Color-management overhaul: WebGLRenderer.outputEncoding replaced by
      outputColorSpace, Texture.encoding replaced by Texture.colorSpace,
      ColorManagement.enabled defaults to true. The single largest
      visually-breaking change in the migration guide's history.
    applies_to: "r152 onward (multi-release rollout)"
    source_ref: research/technologies/threejs.md §13; github.com/mrdoob/three.js/wiki/Migration-Guide
  - claim: >-
      Non-module global-namespace <script> loading is obsolete; ES-module
      loading (npm+bundler or an import map) is the only supported way to
      load Three.js. Legacy UMD/global build files were removed entirely.
    applies_to: "obsolete since r147; legacy build files removed at r160→r161"
    source_ref: research/technologies/threejs.md §4, §13
  - claim: Clock is deprecated in favor of Timer; Timer moved into core (no longer a separate add-on import).
    applies_to: "Clock deprecated at r182→r183; Timer moved into core at r178→r179"
    source_ref: research/technologies/threejs.md §3, §13
last_verified: "2026-09-10"
reverify_triggers:
  - A new Three.js r-number release that changes WebGLRenderer/WebGPURenderer default behavior or overhauls the color-management system again
  - WebGPURenderer graduating out of its documented "experimental" status in the official manual
  - Confirmation of whether first-party TypeScript types have been added to the `three` package (currently community-maintained per the Installation page)

owned_knowledge:
  - Three.js scene-graph / renderer / camera / geometry / material object model
  - WebGLRenderer-vs-WebGPURenderer architecture and TSL
  - Three.js's r-number versioning scheme and the 10-release deprecation/upgrade policy
  - GPU resource disposal patterns (geometry/material/texture memory lifecycle)
decision_framework_present: true

failure_handling:
  - If the installed r-number cannot be determined, ask for it or explicitly state the r-number range the guidance assumes — never assume "latest" silently, and never infer compatibility from an r-number as if it were a semver string (VA-3).
  - If shell is unavailable, degrade to advisory scene/renderer code edits and state that a build/dev-server run was not performed.
escalation:
  - Upgrading across the r152+ color-management overhaul, the r163 WebGL2 floor, or the r147 module-loading change requires explicit user confirmation before applying, since the Migration Guide documents visual-appearance regressions and hard compatibility breaks, not just renamed properties.
verification:
  - Every version-specific claim (WebGL2 floor, color-space APIs, Clock/Timer, module loading) is tagged with the r-number range it holds for.
  - Geometries/materials/textures created and later replaced or removed are explicitly disposed via .dispose().
  - A renderer choice (WebGLRenderer vs. WebGPURenderer) states its rationale and, if WebGPURenderer is chosen, its documented experimental status.
evaluation_criteria:
  - For a seeded scene that loads/replaces textures or geometry at runtime, flags or adds explicit .dispose() calls rather than leaving GPU resources unreclaimed.
  - For a seeded "which renderer" question, does not default to WebGPURenderer without stating its experimental status and the automatic WebGL2-fallback behavior.
  - For a seeded upgrade scenario crossing r147, r152, or r163, correctly identifies the applicable breaking change (module loading, color-space, or WebGL2 floor) rather than treating the version as a semver-shaped string.
  - Does not restate generic frontend component/state-structure or framework-selection guidance owned by SK-FE-001 (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running a dev server/build; abstract shell → CC tools
  cursor:
    paths: ["**/*.{js,ts,jsx,tsx}", "**/three/**"]
  vscode:
    argument_hint: "<task, e.g. 'set up a WebGLRenderer scene' or 'plan the r-number upgrade'>"
