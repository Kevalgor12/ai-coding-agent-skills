id: SK-TECH-threejs
slug: threejs
name: Three.js
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-001]   # frontend-architecture (authored)

purpose: >-
  Apply Three.js correctly and version-appropriately — the scene-graph/
  renderer/camera/geometry/material object model, WebGLRenderer-vs-
  WebGPURenderer choice, the r-number (non-semver) versioning scheme, and
  GPU resource disposal.
scope: >-
  Three.js-specific facts and mechanics: the scene-graph object model,
  WebGLRenderer/WebGPURenderer architecture and TSL, BufferGeometry/
  Material/Texture lifecycle and disposal, the r-number versioning scheme
  and its module-loading/WebGL2 version floors, and the official upgrade
  cadence. The generic frontend structuring/framework-selection method
  comes from the parent Layer-3 skill (SK-FE-001, frontend-architecture)
  and is not repeated here.
expertise: Frontend engineer specializing in WebGL/WebGPU 3D graphics with Three.js.
description: >-
  Three.js 3D graphics: scene-graph/renderer/camera/geometry/material
  model, WebGLRenderer-vs-WebGPURenderer choice, r-number versioning (no
  semver — e.g. r186), WebGL2 floor since r163, module loading since r147,
  and GPU resource disposal. Use when the stack has a `three` dependency,
  WebGL/WebGPU 3D scene work, or the task names Three.js, a Three.js class,
  or TSL. Not for generic frontend structure (frontend-architecture),
  2D-only Canvas/SVG visualization, or a different WebGL/3D library.

activation_conditions:
  - A `three` npm dependency, or an import from 'three'/'three/webgpu'/'three/addons', is present
  - The task involves building or modifying a WebGL/WebGPU 3D scene, mesh, or rendering pipeline in the browser
  - The task names Three.js, a Three.js class (Scene, Mesh, BufferGeometry, WebGLRenderer, WebGPURenderer), or TSL
  - A Three.js r-number upgrade, WebGLRenderer-vs-WebGPURenderer choice, or GPU-memory/disposal question is being evaluated
non_activation_conditions:
  - No Three.js dependency/import, and the task is generic frontend component/state structure with no 3D rendering involved (route to SK-FE-001)
  - 2D-only visualization using Canvas 2D, SVG, or a charting library with no WebGL/scene-graph involved
  - A different WebGL/3D library (Babylon.js, PlayCanvas, raw WebGL) with no Three.js involved — this skill's content is Three.js-specific, not portable
  - Backend-only or non-browser rendering work
activation_mode: auto

inputs:
  - name: task
    description: The Three.js task (scene/mesh authoring, renderer selection, asset loading, GPU-memory/disposal issue, r-number upgrade).
    required: true
  - name: existing-scene-or-config
    description: Existing scene-graph code, renderer configuration, asset-loading pipeline, and the currently installed Three.js r-number.
    required: false
required_context:
  - The installed Three.js r-number (not a semver string) — required because the API surface, renderer defaults, and color-space behavior differ across r-number ranges and cannot be inferred from a "major.minor.patch" reading of the version.
optional_context:
  - Target browser/device support matrix (WebGL2 vs. WebGPU availability).
  - Whether a build tool (e.g. Vite) is in use vs. the no-build import-map/CDN path.

outputs:
  - name: scene-or-renderer-edit
    kind: edit
    description: Scene-graph, renderer, material, or asset-loading code reflecting version-correct Three.js APIs.
  - name: migration-edit
    kind: edit
    description: r-number upgrade changes (e.g. color-space, Clock→Timer, module-loading) applied per the official Migration Guide.
  - name: analysis
    kind: analysis
    description: A WebGLRenderer-vs-WebGPURenderer, Three.js-vs-simpler-visualization, or upgrade-cadence recommendation with rationale and the r-number range it applies to.

depends_on_skills: []
# Deliberately empty — per spec §2.5, do NOT conflate with `parents`. This
# skill's relationship to SK-FE-001 (frontend-architecture) is specialization
# ("I am a more specific version of that skill's method"), already fully
# captured by `parents` above. Putting SK-FE-001 here too would assert a
# stronger claim (hard, blocking sub-step invocation) than specialization
# actually is. This exact mistake happened in an earlier batch of this
# project (see audits/2026-09-09-data-domain-validation.md) and has not
# recurred since agents were warned explicitly — not repeating it here.
related_skills: []
# Empty: no other skill currently in this library's catalog has a strong,
# documented relationship to Three.js specifically.
conflicts_with: []
# Deliberately empty, not [Babylon.js/PlayCanvas-style entry]: per this
# project's technology-decision-matrix.md §12 (3D graphics section),
# Three.js is the only 3D-graphics technology actually profiled in this
# research. Babylon.js/PlayCanvas are named only via the *absence* of an
# official "migrating from" guide in Three.js's own docs — not as documented
# alternatives — so no conflict is invented against an unresearched
# technology.

required_capabilities: [file-read, file-write]
execution_tier: A
# Tier A: Three.js scene/asset authoring is advisory/file-only — editing
# scene-graph, renderer, and asset-loading code, and reasoning about
# renderer/version-upgrade tradeoffs. It is not fundamentally
# shell-execution-dependent (unlike e.g. running a migration or EXPLAIN
# against a live database), consistent with other authoring-focused
# technology skills in this project.

