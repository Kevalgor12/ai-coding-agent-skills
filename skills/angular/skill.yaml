covered_versions:
  angular: ">=20.0 <=22.1"
version_sensitive_claims:
  - claim: "Angular 22.0.x requires TypeScript >=6.0.0 <6.1.0."
    applies_to: "22.0.x"
    source_ref: "research/technologies/angular.md §12; research/knowledge-maps/version-matrix.md (Angular row)"
  - claim: "Angular 21.0.x-21.2.x requires TypeScript >=5.9.0 <6.0.0."
    applies_to: "21.0.x-21.2.x"
    source_ref: "research/technologies/angular.md §12; research/knowledge-maps/version-matrix.md (Angular row)"
  - claim: "Angular 20.0.x-20.3.x requires TypeScript >=5.8.0 <6.0.0."
    applies_to: "20.0.x-20.3.x"
    source_ref: "research/technologies/angular.md §12; research/knowledge-maps/version-matrix.md (Angular row)"
  - claim: "Angular 22.0.x requires Node.js ^22.22.3 || ^24.15.0 || ^26.0.0."
    applies_to: "22.0.x"
    source_ref: "research/technologies/angular.md §12; research/knowledge-maps/version-matrix.md (Angular row)"
  - claim: "Angular 20.0.x-21.2.x requires Node.js ^20.19.0 || ^22.12.0 || ^24.0.0."
    applies_to: "20.0.x-21.2.x"
    source_ref: "research/technologies/angular.md §12; research/knowledge-maps/version-matrix.md (Angular row)"
  - claim: "RxJS ^6.5.3 || ^7.4.0 is required across the entire 20.x-22.x window."
    applies_to: "20.0.x-22.x"
    source_ref: "research/technologies/angular.md §12"
  - claim: "Zoneless change detection is stable and the default; in v20 it required opt-in via provideZonelessChangeDetection(), renamed from the Experimental-tier provideExperimentalZonelessChangeDetection() as part of the v20.0.0 breaking changes (status became Developer Preview)."
    applies_to: "v20 (opt-in, renamed API) vs v21+ (stable/default)"
    source_ref: "research/technologies/angular.md §2, §13"
  - claim: "The standalone option on @Component defaults to false before Angular 19.0.0; components are standalone by default from 19.0.0 onward."
    applies_to: "<19.0.0 vs >=19.0.0"
    source_ref: "research/technologies/angular.md §1"
  - claim: "Components with an undefined changeDetection property default to OnPush as of v22 (previously the Zone-checked 'Default' strategy); the prior default is retained via changeDetection: ChangeDetectionStrategy.Eager."
    applies_to: ">=22.0.0"
    source_ref: "research/technologies/angular.md §2, §13"
  - claim: "Browser support targets the 'widely available' Baseline standard (a 30-month window from a per-major date) as of v20+; pre-v20 releases targeted a fixed '2 most recent versions' policy instead."
    applies_to: "<20.0 vs >=20.0"
    source_ref: "research/technologies/angular.md §12"
  - claim: "Release cadence changed at v22: prior majors shipped every 6 months with 1-3 minors; v22+ targets a major every 12 months with 4-6 minors."
    applies_to: ">=22.0"
    source_ref: "research/technologies/angular.md §12"
last_verified: "2026-09-10"
reverify_triggers:
  - A new Angular major release (next expected ~June 2027, v23)
  - The TypeScript or Node.js floor changing again for a new major
  - The npm/CLI default test runner or change-detection default changing again
  - Angular's official Agent Skills (angular-developer, angular-new-app) changing scope in a way that overlaps this skill's content

owned_knowledge:
  - "Angular's DI system (inject(), hierarchical injectors, providedIn: 'root', @Service() vs @Injectable())"
  - Standalone-component vs NgModule architecture and the migration path between them
  - Angular's Signals API (signal/computed/effect/resource/httpResource) and zoneless change detection
  - Angular's per-major TypeScript/Node.js/RxJS version-floor coupling
decision_framework_present: true

failure_handling:
  - If the Angular major version cannot be determined, ask for it or state explicitly which major the guidance assumes — never assume "latest" silently, since the TS/Node floor, zoneless default, and OnPush default are all breaking changes gated per major.
  - If shell is unavailable/denied, produce advisory component/service/config code and state explicitly that ng generate/ng update/tests were not run.
verification:
  - Any TypeScript/Node.js/RxJS version claim matches the confirmed Angular major's floor (see version_sensitive_claims).
  - Zoneless-vs-Zone.js guidance matches the codebase's actual provider configuration (provideZonelessChangeDetection vs provideZoneChangeDetection), not assumed.
  - Standalone-vs-NgModule guidance matches the codebase's actual structure, not assumed to be standalone-by-default for a pre-v19 codebase.
evaluation_criteria:
  - For a seeded package.json pinning a specific Angular major (20, 21, or 22), states the correct TypeScript/Node.js/RxJS floor for that major without guessing.
  - Given a v20-era codebase using provideExperimentalZonelessChangeDetection, correctly identifies the v20 rename to provideZonelessChangeDetection and the v21+ default-on-change.
  - Recommends inject() over constructor-parameter injection and standalone components over NgModule for new code, citing the official style guide.
  - Does not restate frontend-architecture's React-vs-Vue-vs-Angular comparison (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["**/*.component.ts", "**/*.service.ts", "angular.json", "**/app.routes*.ts"]
  vscode:
    argument_hint: "<task, e.g. 'migrate to zoneless change detection' or 'add a DI-based service with inject()'>"
