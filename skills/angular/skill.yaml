id: SK-TECH-angular
slug: angular
name: Angular
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-001, SK-FE-005]
# SK-FE-001 (frontend-architecture) is authored. SK-FE-005 (rendering-strategy)
# is not yet authored as of this skill's creation; forward-referenced per the
# taxonomy catalog (core/taxonomy/skill-catalog.md row SK-TECH-angular).

purpose: >-
  Apply Angular correctly and version-appropriately — dependency injection,
  standalone-vs-NgModule component architecture, the Signals API, and
  zoneless change detection — while tracking Angular's unusually strict
  per-major TypeScript/Node.js version coupling.
scope: >-
  Angular-specific implementation detail: DI (inject(), hierarchical
  injectors, @Service()/@Injectable()), standalone components vs NgModules,
  signal()/computed()/effect()/resource()/httpResource(), zoneless change
  detection, and the version-gated TS/Node/RxJS floors per major. The
  generic frontend-structure method and the React-vs-Vue-vs-Angular
  framework-selection decision belong to the parent, frontend-architecture
  (SK-FE-001) — not repeated here. The SSR/SSG rendering-mode decision
  belongs to rendering-strategy (SK-FE-005, not yet authored).
expertise: Senior Angular engineer navigating the v20-v22 signal-first transition.
description: >-
  Angular-specific implementation: dependency injection (inject(),
  @Service()/@Injectable()), standalone-vs-NgModule architecture, the
  Signals API (signal/computed/effect/resource/httpResource), zoneless
  change detection, and per-major TypeScript/Node.js version floors. Use
  when the stack is Angular (angular.json, @angular/core, ng CLI) or the
  task names Angular. Not for an open framework choice or React/Vue
  specifics (route to frontend-architecture or their skills).

activation_conditions:
  - An angular.json workspace file, @angular/core in package.json/a lockfile, or ng CLI usage is present
  - The task names Angular or a specific Angular mechanism (signals, DI, standalone components, zoneless change detection, @defer)
  - An existing Angular codebase needs a DI, change-detection, or component-architecture change, or a version-upgrade question
non_activation_conditions:
  - The stack uses React, Vue, or another frontend framework instead (route to that technology skill)
  - The framework choice is still open, with no Angular commitment yet (route to frontend-architecture, SK-FE-001)
  - Generic component/state-management structure with no Angular-specific mechanism involved (route to SK-FE-001)
activation_mode: auto

inputs:
  - name: task
    description: The Angular-specific task (DI/service design, standalone-vs-NgModule structure, signals/change-detection, template/forms work, version upgrade).
    required: true
  - name: installed-version
    description: The Angular major version in use, from package.json/angular.json.
    required: false
required_context:
  - The Angular major version in use — TypeScript/Node.js floors are raised as a breaking change on each major, so version-specific guidance is wrong without it.
optional_context:
  - Whether zone.js is still present (angular.json polyfills, package.json) vs already removed for zoneless
  - Whether the codebase is standalone-based or still NgModule-based

outputs:
  - name: component-or-service-code
    kind: edit
    description: Component/service/DI code using version-correct Angular APIs (standalone components, inject(), signals).
  - name: change-detection-or-structure-change
    kind: edit
    description: A zoneless-migration step, change-detection configuration, or standalone/NgModule structural change.
  - name: analysis
    kind: analysis
    description: Version-gated recommendations (TS/Node floor, zoneless default, OnPush default) tagged with the Angular major they apply to.

depends_on_skills: []
# Per specification.md §2.5: the relationship to SK-FE-001/SK-FE-005 is
# specialization, already fully captured by `parents` above. It is NOT hard,
# blocking composition, so it does not belong in depends_on_skills too —
# duplicating it there would conflate "I am a more specific version of that
# method" with "I invoke that skill as a sub-step," which the spec explicitly
# calls out as a repeat mistake to avoid (audits/2026-09-09-data-domain-validation.md).
related_skills: [SK-TECH-typescript]
conflicts_with: [SK-TECH-react, SK-TECH-vue]

required_capabilities: [file-read, file-write, shell]
execution_tier: B

