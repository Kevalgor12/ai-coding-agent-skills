covered_versions:
  openapi: "3.0-3.2 (current stable 3.2.0)"
  swagger-tooling: "5.x only (the sole actively patched line; 4.x/3.x/2.x are EOL)"
version_sensitive_claims:
  - claim: OAS 3.2.0 adds the OAuth 2.0 Device Authorization Flow and an oauth2MetadataUrl field for automatic OAuth 2.0 Authorization Server Metadata discovery, narrowing the gap with OpenID Connect discovery.
    applies_to: "OpenAPI 3.2.0"
    source_ref: research/knowledge-maps/technology-decision-matrix.md §7; research/technologies/openapi.md
  - claim: 3.0 → 3.1 is a breaking document migration (nullable removed in favor of JSON Schema type arrays, exclusiveMinimum/exclusiveMaximum become direct numeric values, example → examples, file-upload format changes); 3.1 → 3.2 is explicitly non-breaking.
    applies_to: "OpenAPI 3.0.x → 3.1.x (breaking); 3.1.x → 3.2.0 (non-breaking)"
    source_ref: research/technologies/openapi.md
  - claim: Swagger UI's `?url` query-string spec override is disabled by default following GHSA-qrmm-w75w-3wpx.
    applies_to: "swagger-ui, swagger-ui-dist, swagger-ui-react >= 4.1.3"
    source_ref: research/technologies/swagger.md
  - claim: Only the Swagger UI 5.x line receives security patches; 4.x reached EOL August 2023, 3.x reached EOL November 2021, 2.x reached EOL in 2017.
    applies_to: "Swagger UI 5.x = supported; 4.x/3.x/2.x = unsupported/unpatched"
    source_ref: research/technologies/swagger.md
last_verified: "2026-09-10"
reverify_triggers:
  - A new OpenAPI Specification minor/major release (past 3.2.0), or the OAS 4.0 "Moonwalk" effort reaching a published spec
  - A new Swagger UI/Editor/Codegen major-version EOL announcement or a new Swagger CVE/advisory
  - Official migration guidance appearing between Swagger Codegen and OpenAPI Generator (none exists today)

owned_knowledge:
  - OpenAPI document object model (paths/components/securitySchemes) and design-first vs. code-first authoring trade-offs
  - Swagger UI/Editor/Codegen configuration, plugin architecture, and CVE/EOL history
decision_framework_present: true

failure_handling:
  - If no OpenAPI document exists and the underlying REST contract itself isn't designed yet, hand off to api-design first rather than authoring a spec against assumptions.
  - If the deployed Swagger UI/Editor version is unknown, ask for it before asserting CVE/EOL exposure; never assume it is on a patched line.
  - If shell/network access isn't available to run Codegen or fetch a live spec, degrade to advisory: propose the OpenAPI document and Swagger config as file edits/instructions instead.
escalation:
  - A production Swagger UI deployment found on an EOL line (4.x/3.x/2.x) or with `?url` overrides re-enabled is flagged as a security exposure requiring explicit confirmation before treating a fix as optional.
verification:
  - The OpenAPI document declares security schemes under components.securitySchemes and references them by name (never inline).
  - Any Swagger UI production config omits clientSecret from initOAuth() and leaves `?url` query-string overrides disabled unless a stated, controlled need is documented.
  - The Swagger UI/Editor/Codegen version in use or proposed is on the actively patched line (5.x), or the EOL risk is explicitly flagged.
evaluation_criteria:
  - For a seeded REST contract, produces a valid OpenAPI document with correctly structured paths/components/securitySchemes.
  - Correctly recommends design-first vs. code-first authoring for a seeded scenario (e.g. greenfield API vs. large existing codebase with implicit behavior).
  - Flags an EOL/unpatched Swagger UI version (4.x/3.x/2.x) and the GHSA-qrmm-w75w-3wpx exposure when a deployed version is in scope.
  - Does not restate api-design's REST-vs-GraphQL or OpenAPI-vs-GraphQL comparison content (no-duplication).

