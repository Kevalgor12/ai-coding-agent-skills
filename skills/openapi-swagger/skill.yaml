id: SK-TECH-openapi-swagger
slug: openapi-swagger
name: OpenAPI & Swagger
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-002, SK-CONV-006]

purpose: >-
  Author OpenAPI documents correctly (paths/components/securitySchemes,
  design-first vs. code-first) and configure Swagger's tooling — UI, Editor,
  Codegen — that consumes and visualizes them, safely and version-appropriately.
scope: >-
  OpenAPI document structure/authoring and Swagger UI/Editor/Codegen tooling
  mechanics (configuration, plugin model, CLI, CVE/EOL history). Not the
  REST-vs-GraphQL paradigm decision or REST contract design itself
  (api-design owns both), and not GraphQL schema design (graphql-api-design).
expertise: API spec/tooling engineer.
description: >-
  Author OpenAPI documents (paths/components/securitySchemes) and configure
  Swagger's UI/Editor/Codegen tooling that consumes them — design-first vs.
  code-first authoring, mock-server/SDK/server-stub generation, and safe
  Swagger UI deployment (OAuth config, the documented CVE, EOL policy). Use
  when writing/reviewing an OpenAPI spec or setting up Swagger tooling. Not
  for the REST-vs-GraphQL decision, REST contract design itself, or GraphQL.

activation_conditions:
  - Writing, reviewing, or extending an OpenAPI document (paths/components/securitySchemes)
  - Setting up or configuring Swagger UI, Swagger Editor, or Swagger Codegen
  - Deciding design-first vs. code-first OpenAPI authoring, or whether to self-host Swagger UI at all
  - Generating a mock server, client SDK, or server stub from an existing OpenAPI document
non_activation_conditions:
  - The REST-vs-GraphQL paradigm decision, or REST resource/versioning/pagination contract design with no spec-tooling question (route to api-design)
  - GraphQL schema/resolver design or GraphQL-specific tooling (route to graphql-api-design / SK-TECH-graphql)
  - Prose documentation unrelated to an API spec, e.g. READMEs/ADRs (route to technical-documentation, SK-CONV-006)
activation_mode: auto

inputs:
  - name: task
    description: The OpenAPI/Swagger task (author a spec, configure Swagger UI/Editor, generate a client/server/mock, assess CVE/EOL exposure).
    required: true
  - name: existing-api-contract
    description: An existing REST contract/domain model to describe (ideally from api-design), or an existing OpenAPI document to extend/review.
    required: false
required_context:
  - Whether an OpenAPI document already exists or is being authored from scratch (determines design-first vs. code-first framing)
optional_context:
  - The Swagger UI/Editor/Codegen version currently deployed (needed to assess CVE/EOL exposure)
  - Target languages for Codegen/client-SDK generation

outputs:
  - name: openapi-document
    kind: edit
    description: An OpenAPI document (paths/components/securitySchemes) or a diff to an existing one.
  - name: swagger-tooling-config
    kind: edit
    description: Swagger UI/Editor/Codegen configuration (JS init options, Docker/env vars, CLI invocation).
  - name: analysis
    kind: analysis
    description: Design-first-vs-code-first recommendation, or a CVE/EOL exposure assessment for a deployed Swagger UI version.

