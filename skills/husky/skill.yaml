id: SK-TECH-husky
slug: husky
name: Husky
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-INFRA-002, SK-CONV-001]

purpose: >-
  Install, configure, and troubleshoot Git hooks with Husky — the
  core.hooksPath install mechanism, per-package-manager install wiring,
  and its deliberate scope as a hook trigger rather than a staged-file
  filter.
scope: >-
  Husky's own hook-installation and hook-execution mechanics only. Not
  CI/CD pipeline design (ci-cd-pipeline, SK-INFRA-002) and not
  commit-message/branch-name text conventions (git-conventions,
  SK-CONV-001) — Husky is the mechanism that fires a commit-msg hook
  (e.g. invoking commitlint) to enforce whatever text convention is
  already in place, it does not define that convention itself.
expertise: Git tooling / developer-experience engineer.
description: >-
  Husky-specific Git hooks mechanics: the core.hooksPath install
  mechanism, per-package-manager install wiring (prepare for npm/pnpm/
  Bun vs. Yarn's postinstall), and Husky's scope as a hook trigger, not a
  staged-file filter (pair with lint-staged for that). Use when a repo
  has or needs a .husky/ directory, a husky devDependency, or a
  prepare/postinstall script invoking husky, or when hooks aren't firing.
  Not for CI/CD pipeline design or commit-message/branch-name text
  conventions themselves.

activation_conditions:
  - A `.husky/` directory or a `husky` devDependency is present in the repo
  - The task is to set up, add, or fix a Git hook (pre-commit, commit-msg, pre-push, etc.) in a Node/JS-ecosystem project
  - A `prepare` or `postinstall` script invoking `husky` is present or being added
  - Hooks aren't firing and the cause may be `core.hooksPath`, hook-file naming, or install wiring
non_activation_conditions:
  - The task is CI/CD pipeline design itself (stage sequencing, caching, secrets/OIDC) — route to ci-cd-pipeline
  - The task is commit-message or branch-name text/convention content with no hook-mechanism question involved — route to git-conventions
  - The project uses a different hooks manager (pre-commit, lefthook, simple-git-hooks) and Husky is not present — this library has no researched grounding for those alternatives
  - The task is staged-file-specific linting/formatting filtering logic itself — that is lint-staged's scope, not Husky's
activation_mode: auto

inputs:
  - name: task
    description: The Husky-related task (install hooks, add/fix a hook, wire commitlint, diagnose hooks not firing, skip hooks in CI).
    required: true
  - name: repo-state
    description: Presence of .husky/, relevant package.json scripts (prepare/postinstall), the package manager in use, and the installed Git version.
    required: false
required_context:
  - Which package manager the project uses (npm, pnpm, Yarn, or Bun) — determines prepare-vs-postinstall wiring.
optional_context:
  - Existing `.husky/` hook file contents, especially if migrated from Husky v4.
  - The installed Git version, when hooks aren't firing.

outputs:
  - name: hook-config
    kind: edit
    description: .husky/<hook-name> files and the package.json script wiring (prepare or postinstall) implementing the requested hook behavior.
  - name: analysis
    kind: analysis
    description: Diagnosis of why a hook isn't firing, or a stated decision on Husky-alone vs. Husky+lint-staged, or on v4-era hook-file cleanup ahead of v10.0.0.

