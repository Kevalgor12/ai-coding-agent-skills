covered_versions:
  husky: ">=9.1 (Node >=18, Git >2.9); v10.0.0 announced/unreleased as of research date"
version_sensitive_claims:
  - claim: Husky's core.hooksPath mechanism requires Git > 2.9, the version that introduced core.hooksPath; Husky cannot function on older Git.
    applies_to: "all current Husky versions (v6+ architecture, includes current stable v9.1.7)"
    source_ref: research/technologies/husky.md (Section 14, troubleshoot.html)
  - claim: Installing/running the husky CLI requires Node >=18 (engines.node), but hook execution itself has no Node runtime presence unless the hook script invokes node/npm/npx.
    applies_to: "v9.1.7 (current stable, published 2024-11-18)"
    source_ref: research/technologies/husky.md (package.json engines field; Section 2)
  - claim: v10.0.0 will remove the compatibility shim that currently auto-strips two legacy v4-era hook lines (the shebang and the ". .../husky.sh" sourcing line); those lines "WILL FAIL" once the shim is removed.
    applies_to: "v10.0.0 (announced, unreleased as of research date 2026-09-09)"
    source_ref: research/technologies/husky.md (Section 13, index.js deprecation message)
last_verified: "2026-09-10"
reverify_triggers:
  - Husky v10.0.0 releases
  - A new npm publish changes engines.node away from >=18
  - Official docs change the HUSKY=0 CI-skip pattern or the core.hooksPath install mechanism

owned_knowledge:
  - Husky's core.hooksPath install mechanism and POSIX-sh dispatcher execution model
  - Per-package-manager install wiring (prepare for npm/pnpm/Bun vs. Yarn's postinstall+pinst)
  - Husky's trigger-not-filter scope boundary relative to lint-staged

decision_framework_present: true

failure_handling:
  - If the installed Git version can't be confirmed as >2.9, state that Husky's core.hooksPath mechanism requires it and verify rather than assuming it's met.
  - If shell access is unavailable, degrade to advisory: propose the .husky/<hook> file contents and the package.json script change as edits, and state plainly that install (the git config core.hooksPath mutation) was not actually run.
  - If the package manager can't be determined, ask rather than guessing prepare-vs-postinstall wiring, since Yarn's wiring is genuinely different.
verification:
  - The `.husky/<hook-name>` file uses the exact Git hook name (no `precommit`/`pre-commit.sh`-style typos).
  - "`git config core.hooksPath` is actually run after install and its output confirmed to point to the Husky-managed directory — not assumed from reading `.husky/` or `package.json` alone."
  - "`package.json`'s `prepare` script (or Yarn's `postinstall`) actually invokes `husky`."
  - Any CI workflow that shouldn't install hooks sets `HUSKY=0`.
evaluation_criteria:
  - "For a seeded npm/pnpm/Bun project, wires the prepare script to run husky (prepare: husky); for a seeded Yarn project, wires postinstall instead and does not claim prepare works for Yarn."
  - Correctly states hook execution requires no Node runtime unless the hook script itself invokes node/npm/npx.
  - Given a request for staged-file-specific linting, recommends pairing with lint-staged rather than reimplementing filtering in a raw Husky hook, citing Husky's own "basic" staged-file example.
  - Flags legacy v4-era hook files (shebang + sourcing line) as needing cleanup ahead of v10.0.0 rather than relying on the compatibility shim indefinitely.
  - Does not restate git-conventions' text-convention rules or ci-cd-pipeline's general pipeline-design content (QR-2).

adapter_hints: {}
