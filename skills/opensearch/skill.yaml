id: SK-TECH-opensearch
slug: opensearch
name: OpenSearch
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-005, SK-QA-004]   # search-integration (engine-selection method); observability (log-analytics use case, research gap)

purpose: >-
  Apply OpenSearch correctly and version-appropriately: cluster/node
  architecture, index/mapping/analyzer design, the security plugin's
  authentication and access-control surface, and shard/JVM/thread-pool
  performance tuning.
scope: >-
  OpenSearch-specific implementation depth beyond the generic search-engine
  selection method (SK-DATA-005, already covers DB-native-FTS-vs-dedicated-
  engine-vs-vector decision and the Elasticsearch-research-gap caveat — not
  repeated here) and beyond general observability instrumentation (SK-QA-004,
  a documented research gap in this library — forward-referenced only for
  OpenSearch's own log-analytics use case, not fabricated). Covers cluster
  topology, indices/mappings/analyzers, the security plugin, shard-sizing/
  JVM/thread-pool/circuit-breaker tuning, testing, and deployment.
expertise: OpenSearch search/cluster engineer.
description: >-
  OpenSearch cluster architecture, index/mapping/analyzer design and
  mapping-explosion avoidance, the security plugin's auth surface (basic/
  JWT/OIDC/SAML/LDAP/Kerberos/client-cert) with RBAC/document-/field-level
  security, transport-vs-HTTP TLS and demo-cert replacement, and shard/JVM/
  thread-pool/circuit-breaker tuning. Use when the stack runs OpenSearch.
  Not for choosing a search engine (search-integration) or general
  observability instrumentation (a research gap in this library).

activation_conditions:
  - An OpenSearch client library, connection config, or Docker/Helm/Kubernetes-Operator deployment referencing OpenSearch is present
  - The task names OpenSearch or an OpenSearch-specific feature (k-NN, cluster manager node, security plugin, Data Prepper, OpenSearch Dashboards, ISM, Query DSL)
  - An existing OpenSearch cluster's mapping, security-plugin, or shard/performance configuration needs review
  - The search-integration skill has already selected OpenSearch as the engine and implementation-level depth is now needed
non_activation_conditions:
  - The search-engine choice itself is still open (route to SK-DATA-005 search-integration for the selection decision)
  - The stack uses Elasticsearch and the task expects Elasticsearch-specific guidance — this library has no first-party Elasticsearch research; do not answer as if OpenSearch and Elasticsearch are interchangeable
  - The task is general application logging/metrics/tracing instrumentation unrelated to OpenSearch's own log-analytics role (route to SK-QA-004, a documented research gap — do not fabricate observability guidance here)
  - A simple full-text need already covered by a database already in use (route to SK-TECH-postgresql or SK-TECH-redis)
activation_mode: auto

inputs:
  - name: task
    description: The OpenSearch task (cluster/node setup, index/mapping/analyzer design, security-plugin config, shard/JVM/thread-pool tuning, query design, upgrade).
    required: true
  - name: cluster-and-version
    description: The existing cluster's OpenSearch version, node topology, and current mappings/security config, if not greenfield.
    required: false
required_context:
  - The OpenSearch major.minor version in use — needed for version-correct guidance (e.g. JDK/Lucene requirements changed at 3.0).
optional_context:
  - Expected document/query volume and latency requirements (drives shard-sizing decisions).
  - The deployment's existing identity infrastructure (LDAP/AD, SAML/OIDC IdP, or none) — drives the authentication-method decision.

outputs:
  - name: index-mapping-or-security-config
    kind: edit
    description: Index/mapping/analyzer JSON, or security-plugin role/TLS/auth-backend configuration.
  - name: cluster-or-shard-tuning
    kind: edit
    description: Thread-pool, circuit-breaker/admission-control, or shard-sizing settings addressing an observed workload.
  - name: analysis
    kind: analysis
    description: Recommendations (auth method, shard strategy, benchmark-before-rollout) with rationale and the OpenSearch version they apply to.

depends_on_skills: []
related_skills: [SK-TECH-postgresql, SK-TECH-redis]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Proposing mapping/security/tuning config is advisory (file-only); running
# opensearch-testcontainers, OpenSearch Benchmark, or cluster API calls needs
# shell. No capability_fallbacks block required (Tier B, not C) — degrades to
# advisory per failure_handling if shell is unavailable.

