covered_versions:
  opensearch: ">=2.19 <=3.8 (1.x EOL; 2.x maintenance-only; 3.x actively developed)"
version_sensitive_claims:
  - claim: >-
      Three-tier support lifecycle: 1.x reached end-of-life (maintenance
      ended 2025-05-06) and is unsupported; 2.x is in maintenance-only mode
      until 4.0 reaches GA, with 2.19.x patches scheduled through December
      2026 (latest patch as of the research date: 2.19.6, 2026-07-02); 3.x is
      the actively-developed major line, currently at 3.8.0 (2026-08-04).
    applies_to: "as of research date 2026-09-09/10"
    source_ref: "research/knowledge-maps/version-matrix.md; research/technologies/opensearch.md §12 (opensearch.org/releases)"
  - claim: >-
      Support commitment: versions stay under maintenance until the next
      major enters maintenance, or 1 year passes, whichever is longer;
      medium-or-higher-severity vulnerabilities are patched within 60 days of
      public disclosure in actively-maintained versions.
    applies_to: "all actively-maintained versions"
    source_ref: "research/knowledge-maps/version-matrix.md; research/technologies/opensearch.md §12 (opensearch.org/releases)"
  - claim: >-
      Custom (non-demo) TLS certificates must be stored with private keys at
      file mode 600 and public certificates at 644; replacing the bundled
      demo certificates with trusted ones before production is documented as
      "critical."
    applies_to: "all covered versions (>=2.19 <=3.8) — not version-gated, a standing production requirement"
    source_ref: "research/technologies/opensearch.md §7, §17 (security configuration doc)"
  - claim: >-
      OpenSearch 3.0 raised the minimum supported Java runtime to JDK 21
      (a hard break from the 1.x/2.x baseline), upgraded the search core to
      Apache Lucene 10, permanently disabled the Java Security Manager, and
      moved the transport layer to Apache HttpClient 5.x.
    applies_to: ">=3.0"
    source_ref: "research/technologies/opensearch.md §2, §12, §13 (GitHub issue #3351)"
last_verified: "2026-09-10"
reverify_triggers:
  - 4.0 GA release (changes the 2.x maintenance-until date)
  - A new OpenSearch minor/major release changing the current-stable version or RC schedule
  - Any change to the documented breaking-changes list for a version pair relevant to an upgrade

owned_knowledge:
  - OpenSearch cluster/node-role architecture (cluster manager, data, ingest, coordinating nodes) and shard/replica mechanics
  - OpenSearch index/mapping/analyzer design and mapping-explosion avoidance
  - OpenSearch security-plugin authentication/access-control surface and transport-vs-HTTP TLS configuration
  - OpenSearch shard-sizing, JVM heap, thread-pool, and circuit-breaker tuning parameters
  # Cross-cutting security/performance/testing method is NOT owned here — referenced, not restated.
  # Search-engine selection and index-sync-drift risk are owned by SK-DATA-005, referenced not repeated.

decision_framework_present: true

failure_handling:
  - If the OpenSearch major.minor version cannot be determined, ask for it or explicitly state the version the guidance assumes — never assume "latest" silently (rule VA-3).
  - If shell is unavailable or denied, degrade to advisory mapping/security/tuning config output and state that no cluster/testcontainer command was actually run.
  - If the request is really about choosing a search engine (not yet decided on OpenSearch), route to SK-DATA-005 rather than assuming OpenSearch.
  - If the request is Elasticsearch-specific, state plainly that this library has no first-party Elasticsearch research rather than answering as if the two engines are interchangeable.
escalation:
  - Replacing a production cluster's TLS certificates or disabling the security plugin (`plugins.security.disabled: true`) is flagged and confirmed before applying — both are trust-boundary changes.
  - A shard-count/topology change on an existing populated index (requires reindexing) is presented with trade-offs for explicit confirmation, not applied unilaterally.
verification:
  - The proposed shard size/count matches the workload shape (10-30GB for search-latency-sensitive, 30-50GB for write-heavy/analytics), not a default guess.
  - Every version-specific claim is tagged with the OpenSearch range it holds for.
  - A production-bound security config does not leave demo TLS certificates or `plugins.security.disabled: true` in place.
  - A mapping/query change proposed for production is checked against a benchmark or explicit rationale for skipping one.
evaluation_criteria:
  - For a seeded workload description (search-latency-sensitive vs. write-heavy), proposes a shard-sizing strategy in the documented 10-30GB / 30-50GB ranges with rationale, not a default.
  - For a seeded identity-infrastructure scenario (existing LDAP/AD vs. SAML/OIDC IdP vs. none), recommends a defensible authentication method from the security plugin's documented backends.
  - Flags a production deployment still on demo TLS certificates as a finding requiring remediation, citing the "critical to replace" guidance.
  - Any claim about a 3.0-gated feature (JDK 21, Lucene 10) is correctly scoped to ">=3.0" and not presented as universally true.
  - Does not restate the search-engine-selection decision framework or the Elasticsearch-research-gap caveat owned by SK-DATA-005 (rule QR-2).

