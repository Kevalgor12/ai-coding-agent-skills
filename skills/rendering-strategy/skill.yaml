id: SK-FE-005
slug: rendering-strategy
name: Rendering strategy
spec_version: "1.0"
skill_version: "0.1.0"
kind: generic
layer: 3
domain: FE
parents: []   # Layer-3 generic — specializes nothing; specialized BY react/nextjs/vue/nuxt/angular

purpose: >-
  Choose the rendering mode for a page or app — CSR, SSR, SSG, ISR, or
  streaming SSR with partial/selective hydration — weighing SEO need,
  time-to-interactive, personalization, and infrastructure complexity,
  independent of which framework ends up implementing the choice.
scope: >-
  Tech-neutral rendering-mode selection and its trade-offs. Specialized by
  the React/Next.js/Vue/Nuxt/Angular technology skills, which own each
  framework's concrete mechanics for implementing the chosen mode (RSC
  Server/Client Component boundaries, Next.js's Cache Components/ISR APIs,
  Nuxt's routeRules, Angular's Server/Client/Prerender route config). Not
  component/state architecture itself (frontend-architecture owns that) and
  not SEO implementation depth beyond the rendering-mode/indexability tie
  (seo-optimization owns structured data, canonicalization, sitemaps, and
  Core Web Vitals implementation depth).
expertise: Senior/principal frontend engineer specializing in rendering architecture.
description: >-
  Choose how a page or app renders — CSR, SSR, SSG, ISR, or streaming SSR
  with partial/selective hydration — weighing SEO need, time-to-interactive,
  personalization, and infrastructure complexity. Use when deciding or
  reviewing how a page/app should render in a framework capable of more than
  one mode, or when a rendering choice has SEO/TTI consequences. Not for
  component/state architecture (frontend-architecture) or a specific
  framework's rendering-mode API/config mechanics once the mode is already
  decided (its own technology skill).

activation_conditions:
  - Deciding how a page or app should render (CSR/SSR/SSG/ISR/streaming) in a framework capable of more than one mode
  - A rendering-mode choice has SEO, time-to-interactive, or personalization consequences that need weighing
  - Reviewing an existing app's rendering mode for a mismatch against its actual content-volatility/interactivity/SEO needs
non_activation_conditions:
  - A pure client-only SPA with no SEO/SSR concern and no rendering-mode choice actually open (nothing to decide)
  - The framework/meta-framework itself hasn't been chosen yet (route to frontend-architecture)
  - A specific framework's rendering-mode API/config mechanics with the mode already decided (route to that framework's technology skill: react, nextjs, vue, nuxt, or angular)
  - Backend-only work with no rendered page involved
activation_mode: auto

inputs:
  - name: page-requirements
    description: Per-page/app requirements — SEO need, content volatility, personalization level, interactivity, target infrastructure.
    required: true
  - name: framework-context
    description: The chosen framework/meta-framework, if any, and which rendering modes it actually supports.
    required: false
required_context:
  - Whether the page/app needs to be indexed by search engines
  - How often the content changes (static, periodically revalidated, per-request dynamic, per-user personalized)
optional_context:
  - The chosen framework/meta-framework and its supported rendering modes
  - Target deployment infrastructure (CDN/static host vs. a server runtime)

outputs:
  - name: rendering-mode-decision
    kind: analysis
    description: The recommended rendering mode (or a per-route mix) with rationale and the SEO/TTI/infrastructure trade-offs, handed off to the relevant framework technology skill for implementation.

depends_on_skills: []
