owned_knowledge:
  - Rendering-mode (CSR/SSR/SSG/ISR/streaming) selection decision framework
  - Cross-framework rendering-mode vocabulary and the SEO/TTI/infrastructure trade-offs between modes
decision_framework_present: true

failure_handling:
  - If per-page requirements (SEO need, content volatility, interactivity) aren't stated, ask rather than assuming a mode.
  - If the framework/meta-framework choice is still open, hand off to frontend-architecture first — a rendering mode can't be chosen independent of what the target framework actually supports.
  - If the target framework's exact rendering-mode API isn't known, state the recommended mode and rationale, and hand off the implementation specifics to that framework's technology skill rather than guessing its API.
verification:
  - The recommended mode is justified against the page's actual SEO/content-volatility/interactivity needs, not chosen by default or by framework-marketing preference.
  - A CSR-only recommendation for a page with a real SEO requirement explicitly flags the indexability consequence.
  - The simplest-sufficient mode is recommended before reaching for ISR/streaming machinery a page doesn't need.
evaluation_criteria:
  - For seeded page types (marketing page, dashboard, blog/content page), recommends a defensible rendering mode and correctly flags the SEO consequence of a CSR-only choice.
  - Does not recommend SSR/ISR/streaming infrastructure for a page with no SEO, TTI, or personalization need that would justify it (QR-4 anti-overengineering).
  - Does not restate a specific framework's rendering-mode implementation mechanics already owned by that framework's technology skill (QR-2).

