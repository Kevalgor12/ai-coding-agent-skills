covered_versions:
  fastify: ">=5.0 <6.0 (v6 in alpha, not yet stable)"
  node: ">=20 (Fastify v5's floor; v18 dropped)"
version_sensitive_claims:
  - claim: "Fastify v4 is past its supported LTS window (retired 2025-06-30) — running it in production is documented as unsupported."
    applies_to: "v4.x"
    source_ref: "research/technologies/fastify.md §12; research/knowledge-maps/version-matrix.md (Fastify row)"
  - claim: "The `logger` factory option no longer accepts a pre-built logger instance; use the new `loggerInstance` option instead. This is a real breaking change on upgrade from v4."
    applies_to: ">=5.0"
    source_ref: "research/technologies/fastify.md §4, §11, §13"
  - claim: "v6.0.0-alpha.0 removes deprecated APIs and raises the minimum Node.js version further, but the exact new floor is not confirmed in the source research."
    applies_to: "6.0.0-alpha.0–alpha.3 (pre-release)"
    source_ref: "research/technologies/fastify.md §12, §13 — marked Unresolved in the source"
  - claim: "`useSemicolonDelimiter` defaults to `false` (RFC 3986-compliant), a change from a more permissive v4 default."
    applies_to: ">=5.0"
    source_ref: "research/technologies/fastify.md §4, §13; research/knowledge-maps/version-matrix.md (Fastify row)"
  - claim: "Node.js v20+ is required (v18 support dropped), justified by v20's node:test support and v18 nearing Node's own LTS end."
    applies_to: "Fastify >=5.0"
    source_ref: "research/technologies/fastify.md §11, §12; research/knowledge-maps/version-matrix.md (Fastify row)"
  - claim: "Reference-type (Array/Object) Request/Reply decorators are rejected outright, not merely discouraged."
    applies_to: ">=5.0"
    source_ref: "research/technologies/fastify.md §6, §13"
  - claim: "Plugins can no longer mix async/callback styles within a single plugin function."
    applies_to: ">=5.0"
    source_ref: "research/technologies/fastify.md §6, §11, §13"
  - claim: "The TypeScript reference docs build corresponds to v5.12.1; tsconfig target should be es2017+ to avoid deprecation warnings."
    applies_to: "v5.12.1 docs snapshot"
    source_ref: "research/technologies/fastify.md §12, §16; research/knowledge-maps/version-matrix.md (Fastify row)"
last_verified: "2026-09-10"
reverify_triggers:
  - Fastify v6.0.0 stable release
  - Any change to the confirmed v6 Node.js minimum version (currently Unresolved)
  - Fastify v5 entering its own security-only support window (12 months after v5's release per the documented LTS policy)

owned_knowledge:
  - Fastify plugin/register() mechanics and encapsulation-context rules
  - Fastify's schema-compilation model (Ajv v8 + fast-json-stringify) and its decorator API
  - Fastify's fixed request lifecycle and hook ordering
  - Fastify's v4-to-v5 breaking-change surface
decision_framework_present: true

failure_handling:
  - If the installed Fastify major (v4/v5/v6-alpha) cannot be determined, ask or explicitly state which version the guidance assumes — never silently assume "latest" (VA-3); default assumption when truly unknown is the current stable v5 line, stated explicitly.
  - If shell is unavailable, produce advisory route/plugin/schema code and state that fastify.inject()-based verification was not run.
verification:
  - Any version-sensitive API used (loggerInstance vs. logger, useSemicolonDelimiter default, jsonShortHand absence) matches the confirmed installed major.
  - Response schemas are defined for routes handling sensitive fields, not left to serialize the full object.
  - A custom setErrorHandler is present (or its absence is explicitly flagged) before any route can leak >=500 error detail to clients.
  - A custom setErrorHandler's behavior is confirmed by actually triggering an error in the running server and observing the client-facing response, not inferred by reading the handler registration alone.
evaluation_criteria:
  - Given a seeded package.json pinning fastify to ^4, does not suggest loggerInstance, the v5 useSemicolonDelimiter default, or other v5-only APIs.
  - Given a seeded package.json pinning fastify to ^5, correctly flags that a custom logger instance must go through loggerInstance, not logger.
  - For a route accepting untrusted JSON, proposes a JSON Schema for validation and, where the response includes sensitive fields, a response schema — not just app-level validation.
  - Does not restate backend-architecture's Fastify-vs-Express comparison (benchmarks, error-handler-default contrast, testing-gap framing) verbatim (QR-2).
  - When asked about v6, explicitly surfaces it as alpha/pre-release and flags the Node-floor detail as unresolved rather than guessing a number.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["**/*.js", "**/*.ts", "**/plugins/**", "**/routes/**"]
  vscode:
    argument_hint: "<task, e.g. 'add a response schema to this route' or 'migrate this plugin to v5'>"
