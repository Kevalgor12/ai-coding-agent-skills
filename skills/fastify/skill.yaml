id: SK-TECH-fastify
slug: fastify
name: Fastify
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-001, SK-BE-002]

purpose: >-
  Apply Fastify correctly and version-appropriately — the plugin/encapsulation
  system, schema-driven validation and serialization, decorators, lifecycle
  hooks, and the v4-to-v5 breaking-change surface.
scope: >-
  Fastify-specific API, configuration, and architectural detail. The generic
  backend-structure method (layering, DI, error handling, graceful shutdown,
  the Fastify-vs-Express framework decision) belongs to backend-architecture
  (SK-BE-001); the generic HTTP/REST contract method belongs to api-design
  (SK-BE-002). This skill supplies what's Fastify-specific: register()/plugin
  mechanics and encapsulation contexts, the Ajv/fast-json-stringify
  schema-compilation model, the decoration API, the fixed request lifecycle,
  and the documented v5 breaking changes. The Fastify-vs-Express comparison
  itself (benchmarks, error-handler defaults, testing-story gap) is already
  covered by backend-architecture and is not repeated here.
expertise: Node.js backend engineer building on Fastify.
description: >-
  Fastify-specific plugin system (register()/encapsulation), schema-driven
  validation/serialization (Ajv + fast-json-stringify), decorators
  (decorate/decorateRequest/decorateReply), the fixed request lifecycle/hooks,
  and the v4-to-v5 breaking changes. Use when fastify appears in
  package.json/imports or the task names Fastify specifically. Not for the
  Fastify-vs-Express choice itself (backend-architecture), generic HTTP
  contract design (api-design), or Node.js runtime mechanics (nodejs).

activation_conditions:
  - fastify appears in package.json, a lockfile, or an import/require statement
  - The task names Fastify, a Fastify plugin (@fastify/*), or a Fastify-specific API (register, decorate, addHook, fastify.inject)
  - Reviewing or extending an existing Fastify route/plugin/schema for correctness
non_activation_conditions:
  - The stack uses Express, Koa, Hapi, or another Node framework instead (route to that technology skill, or to Express's when authored)
  - The Fastify-vs-Express framework decision itself, with no framework chosen yet (route to backend-architecture, SK-BE-001)
  - Generic HTTP/REST contract design (resource modeling, versioning, pagination) with no Fastify-specific mechanism in question (route to api-design, SK-BE-002)
  - Pure Node.js runtime/event-loop questions with no Fastify API involved (route to nodejs, SK-TECH-nodejs)
activation_mode: auto

inputs:
  - name: task
    description: The Fastify-specific task (route/plugin design, schema validation/serialization, hooks, decorators, error handling, testing, migration to v5).
    required: true
  - name: installed-version
    description: The pinned fastify version/range from package.json or lockfile.
    required: false
required_context:
  - The installed Fastify major version (v4 vs v5, or the v6 pre-release) — the v5 breaking-change surface (logger→loggerInstance, jsonShortHand removal, Node floor) makes guidance version-dependent.
optional_context:
  - Existing plugin structure and encapsulation boundaries.
  - Whether the app is deployed serverless (Lambda/Cloud Functions/Cloud Run) vs. as a long-running container.

outputs:
  - name: route-or-plugin-code
    kind: edit
    description: Fastify route, plugin, schema, decorator, or hook code correct for the confirmed major version.
  - name: error-handling-or-validation-config
    kind: edit
    description: setErrorHandler / onProtoPoisoning / onConstructorPoisoning / response-schema configuration.
  - name: analysis
    kind: analysis
    description: Version-specific findings (e.g. v4→v5 migration items) and which caveats apply to the task at hand.

depends_on_skills: []
# depends_on_skills is reserved for hard, blocking sub-step composition, not
# specialization of a parent (spec.md §2.5). This skill specializes SK-BE-001
# and SK-BE-002 via `parents` above; it does not invoke either as a sub-step
# of its own execution, so this list stays empty.
related_skills: [SK-TECH-nodejs]
conflicts_with: [SK-TECH-express]

required_capabilities: [file-read, file-write, shell]
execution_tier: B

