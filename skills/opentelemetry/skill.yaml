id: SK-TECH-opentelemetry
slug: opentelemetry
name: OpenTelemetry
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-QA-004]

purpose: >-
  Instrument code with the OpenTelemetry API/SDK and operate the
  OpenTelemetry Collector correctly for the specific per-language,
  per-signal stability level actually in use.
scope: >-
  OpenTelemetry-specific implementation depth: API/SDK/Collector
  architecture, OTLP wire protocol, context propagation, semantic
  conventions, and the per-language/per-signal stability matrix. The
  generic signal-selection method, cardinality/PII discipline, and
  alert-design method come from the parent skill (observability,
  SK-QA-004) and are not repeated here.
expertise: Observability/instrumentation engineer specializing in OpenTelemetry.
description: >-
  OpenTelemetry-specific instrumentation via the API/SDK and Collector —
  OTLP protocol, W3C Trace Context propagation, semantic conventions, and
  the per-language/per-signal stability matrix (e.g. JS/Python logs still
  Development). Use when instrumenting code with OpenTelemetry or
  configuring/deploying the Collector. Not for signal-selection method or
  cardinality/PII/alerting synthesis (use observability), or
  backend-specific config (use prometheus/grafana/sentry).

activation_conditions:
  - The task involves instrumenting code with the OpenTelemetry API/SDK (traces, metrics, or logs)
  - Configuring, deploying, or troubleshooting the OpenTelemetry Collector
  - OTLP endpoints, exporters, or `@opentelemetry/*` / `opentelemetry-*` packages are present in the codebase
  - Migrating instrumentation from OpenTracing or OpenCensus to OpenTelemetry
non_activation_conditions:
  - Deciding which observability signal to use for a diagnostic need, or designing alerting/cardinality/PII discipline in the abstract (route to observability, SK-QA-004)
  - Prometheus-specific PromQL/scrape-config work with no OpenTelemetry SDK/Collector involved (route to prometheus)
  - Grafana dashboard/alerting-rule authoring with no OTLP ingestion involved (route to grafana)
  - Sentry SDK configuration/issue-triage work not going through OpenTelemetry (route to sentry)
activation_mode: auto

inputs:
  - name: task
    description: The instrumentation or Collector task (add tracing/metrics/logs to a service, configure/deploy a Collector, migrate from OpenTracing/OpenCensus).
    required: true
  - name: language-and-stack
    description: The language/runtime and framework being instrumented — package names, auto-instrumentation availability, and signal stability all differ per language.
    required: true
  - name: existing-otel-version
    description: Currently pinned OpenTelemetry API/SDK/Collector versions, if any (for accurate migration/breaking-change guidance).
    required: false
outputs:
  - name: instrumentation-code
    kind: edit
    description: API/SDK instrumentation (auto- and/or manual) added to the target service, using correct semantic-convention attribute names.
  - name: collector-config
    kind: edit
    description: Collector YAML configuration (receivers/processors/exporters/pipelines) for the chosen deployment topology.
  - name: analysis
    kind: analysis
    description: Stability/version-applicability assessment and, if relevant, a migration plan (OpenTracing/OpenCensus bridge, major-version upgrade).

depends_on_skills: []
related_skills: [SK-TECH-prometheus, SK-TECH-grafana, SK-TECH-sentry]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B

