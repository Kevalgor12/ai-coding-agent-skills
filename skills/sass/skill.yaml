covered_versions:
  dart-sass: ">=1.80 <=1.104 (must migrate off Node Sass/LibSass/Ruby Sass — all EOL/deprecated, no supported version range)"
version_sensitive_claims:
  - claim: The legacy JS API (render()/renderSync()) is deprecated but "will continue to be supported until the release of version 2.0.0 of the sass package" (not yet released).
    applies_to: "current Dart Sass releases, until a future sass npm package 2.0.0 ships"
    source_ref: research/technologies/sass.md §3; research/knowledge-maps/version-matrix.md
  - claim: "@import began emitting deprecation warnings at Dart Sass 1.80.0; the deprecation period runs until Dart Sass 3.0.0, which will not release sooner than two years after 1.80.0. @import still works today but is on a long, dated deprecation track."
    applies_to: ">=1.80.0, through the deprecation window ending no earlier than two years post-1.80.0 at Dart Sass 3.0.0"
    source_ref: research/technologies/sass.md §11, §13; research/knowledge-maps/version-matrix.md
  - claim: The tar-permissions security bug (incorrect Unix file permissions on release archives) affected the sass-embedded npm package before 1.54.5 and the RubyGems non-native package before 1.56.2. npm `sass`, Homebrew, and Chocolatey installs were unaffected.
    applies_to: "sass-embedded npm <1.54.5; RubyGems non-native package <1.56.2"
    source_ref: research/technologies/sass.md §7; research/knowledge-maps/version-matrix.md
  - claim: Node Sass reached end-of-life 2024-07-24 (npm package deprecated, GitHub repo archived); LibSass and Ruby Sass were both declared deprecated 2020-10-26.
    applies_to: "Node Sass: EOL as of 2024-07-24; LibSass/Ruby Sass: deprecated as of 2020-10-26"
    source_ref: research/technologies/sass.md §11-12; research/knowledge-maps/version-matrix.md
  - claim: The current Dart Sass reference target is 1.104.0 (as of the 2026-09-09 research date), with recent releases shipping roughly every 1-4 weeks — treat "latest" as a moving target, not a fixed version.
    applies_to: "as of research date 2026-09-09; re-check before citing a specific current version"
    source_ref: research/technologies/sass.md §12; research/knowledge-maps/version-matrix.md
  - claim: The breaking-changes catalogue lists 25+ dated entries pinned to specific releases (e.g. adjacent compound selectors at 1.100.0, the legacy if() function at 1.95.0, @import at 1.80.0, legacy JS API/Color API deprecations at 1.79.0).
    applies_to: "cumulative through 1.104.0; new entries are added on an ongoing basis"
    source_ref: research/technologies/sass.md §13
last_verified: "2026-09-10"
reverify_triggers:
  - Dart Sass 3.0.0 releases (removes @import support, treating it as plain-CSS @import only)
  - A future sass npm package 2.0.0 releases (removes the legacy render()/renderSync() JS API)
  - A new dated entry is added to the official Breaking Changes index
  - LibSass's exact EOL date is confirmed (currently unresolved/unconfirmed per research)
  - SK-FE-003 (styling-systems) is authored, to re-check parent-relationship accuracy

owned_knowledge:
  - Sass module system (@use/@forward) semantics, namespacing, and !default + with(...) configuration
  - Sass built-in sass:* modules (math/string/color/list/map/selector/meta) and their role vs. legacy global functions
  - Sass CLI compilation flags and Sass Migrator subcommands (module, division, color, if())
  - Sass implementation history and deprecation timeline (Dart Sass vs. LibSass/Node Sass/Ruby Sass)
  # Cross-cutting security/performance/testing depth is NOT owned here — referenced, not restated.

decision_framework_present: true

failure_handling:
  - If it is unclear whether a codebase can tolerate the @import deprecation-warning noise from a bulk migration, default to recommending @use/@forward for new code and leave existing @import in place pending a scheduled migration — never silently rewrite the whole tree (rule VA-3, no silent "latest" assumption).
  - If the project's Sass build-tool integration (CLI, bundler loader, JS/Dart API) cannot be determined, ask or state the assumption rather than guessing.
  - If shell is unavailable, produce advisory .scss/.sass edits and configuration recommendations and state explicitly that compilation was not verified.

escalation:
  - Bulk-migrating a large legacy @import codebase to @use/@forward via sass-migrator is flagged for confirmation before running — namespacing changes are a breaking, repository-wide edit.
  - A still-present node-sass/libsass/ruby-sass dependency is flagged to the user as EOL/deprecated with a recommended Dart Sass migration path, rather than silently left in place.

verification:
  - New Sass code uses @use/@forward, not @import, unless there's a stated reason to match existing legacy code pending a scheduled migration.
  - Every version-specific claim (deprecation timelines, EOL dates, the tar-permissions bug range) is tagged with the range it holds for.
  - Proposed built-in module usage (sass:math, sass:color, sass:list, etc.) matches documented function names, not invented ones.
  - Any remaining Node Sass/LibSass/Ruby Sass dependency is identified and flagged, not silently treated as equivalent to Dart Sass.

evaluation_criteria:
  - For a seeded new-stylesheet task, produces @use/@forward-based code, not @import.
  - For a seeded "should I use Sass with Tailwind CSS" question, correctly states they are not mutually exclusive at the project level, while accurately noting Tailwind v4's own stance on Sass as a preprocessing step.
  - Correctly identifies a node-sass/libsass/ruby-sass dependency found in a repo as EOL/deprecated and recommends migrating to Dart Sass, citing the specific EOL/deprecation dates.
  - For a seeded question about the tar-permissions incident, states the precise affected/fixed version ranges (sass-embedded npm <1.54.5; RubyGems non-native <1.56.2) rather than a vague "old versions were affected."
  - Does not restate generic styling-architecture guidance owned by the parent SK-FE-003.

adapter_hints:
  claude-code:
    allowed_tools: [Read, Edit]
  cursor:
    paths: ["**/*.scss", "**/*.sass"]
  vscode:
    argument_hint: "<task, e.g. 'migrate @import to @use' or 'add a themeable mixin'>"
