id: SK-TECH-sass
slug: sass
name: Sass
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-003]   # styling-systems

purpose: >-
  Apply Sass correctly and version-appropriately: the @use/@forward module
  system, mixins, selector inheritance, built-in sass:* modules, and migrating
  off the deprecated @import syntax and the end-of-life LibSass/Node
  Sass/Ruby Sass implementations onto Dart Sass.
scope: >-
  Sass-language and Dart-Sass-specific engineering detail — the module
  system, built-in functions, CLI/build integration, and
  implementation/version migration. The generic styling-architecture method
  (design tokens, scoping strategy, utility-vs-authored-CSS choice) comes
  from the parent skill SK-FE-003 (styling-systems).
expertise: Sass/CSS-preprocessing engineer.
description: >-
  Sass-specific stylesheet authoring: the @use/@forward module system,
  mixins, functions, selector inheritance (@extend), control flow, and
  built-in sass:* modules, using Dart Sass (the only actively maintained
  implementation). Use when .scss/.sass files, a sass/sass-embedded
  dependency, or a Sass-specific construct is present, or the task names
  Sass/SCSS. Not for Less/Stylus/plain CSS, framework component-styling
  APIs, or Tailwind-only utility-class work with no Sass files involved.

activation_conditions:
  - .scss or .sass files are present in the project
  - A sass or sass-embedded devDependency, or a bundler's Sass-preprocessing config (e.g. a "scss"/"sass" loader or plugin option), is present
  - The task names Sass/SCSS or a Sass-specific construct (@use, @forward, @mixin, @extend, sass:math, sass:color, etc.)
  - A legacy node-sass, libsass, or ruby-sass dependency is found and needs migrating
non_activation_conditions:
  - The stack uses another preprocessor/methodology (Less, Stylus, plain CSS, CSS Modules) with no Sass files present (route to that tool or SK-TECH-web-standards)
  - The question is about a UI framework's own component-styling API (CSS-in-JS, styled-components-style theming) rather than Sass language mechanics (route to that framework's skill)
  - The question is purely about Tailwind CSS utility classes with no Sass files, @use, or Sass dependency present (route to SK-TECH-tailwindcss)
  - Generic styling-architecture decisions (tokens, scoping strategy, picking a styling approach at all) with no Sass in play yet (route to SK-FE-003)
activation_mode: auto

inputs:
  - name: task
    description: The Sass task (new stylesheet architecture, @import migration, mixin/function authoring, module configuration, build-tool integration, legacy-implementation migration).
    required: true
  - name: existing-stylesheets
    description: Existing .scss/.sass files and their @use/@import dependency graph, if any.
    required: false
  - name: build-tool-context
    description: The bundler/build tool compiling Sass (CLI, Vite/webpack loader, a Dart/JS API integration) and its Sass package (sass vs. sass-embedded vs. a legacy Node Sass/LibSass install).
    required: false
required_context: []
optional_context:
  - The Dart Sass version in use (CLI --version or package.json), for version-gated guidance.
  - Whether the project still depends on node-sass, libsass, or ruby sass (all EOL/deprecated).

outputs:
  - name: stylesheet-edit
    kind: edit
    description: New or modified .scss/.sass files using the module system, mixins, functions, selector inheritance, or control flow as appropriate.
  - name: migration-edit
    kind: edit
    description: "@import-to-@use/@forward conversions (ideally via sass-migrator), or a Node Sass/LibSass-to-Dart Sass dependency migration, with namespacing resolved."
  - name: analysis
    kind: analysis
    description: Recommendations (module system vs. legacy @import, Dart Sass vs. any remaining legacy implementation, sass vs. sass-embedded package choice, Sass vs. plain modern CSS) with rationale and the version they apply to.

depends_on_skills: []
# Specialization of SK-FE-003 is already captured by `parents` above; this is
# not a hard blocking sub-step invocation, so it does not belong here too
# (spec §2.5 — do not conflate parents with depends_on_skills).
related_skills: [SK-TECH-web-standards]
conflicts_with: []
# Deliberately empty, not [SK-TECH-tailwindcss]: Sass and Tailwind CSS are a
# styling-APPROACH choice a project makes independently, not a hard mutual
# exclusion. They can and do coexist (utility classes plus authored
# preprocessor CSS). Tailwind v4 itself declines to support using Sass as a
# PostCSS-style preprocessing *step* ahead of it, but that is a build-order
# constraint on one specific integration pattern, not a same-decision
# conflict at the skill-composition level this field governs.

required_capabilities: [file-read, file-write]
execution_tier: A
# Sass compilation is normally a build step (CLI/bundler-driven), not an
# interactive shell judgment call the way running a service or DB migration
# is. This skill's own outputs are .scss/.sass edits, module/config
# structure, and migration analysis — advisory, file-only work. Actually
# running `sass --watch`, `sass-migrator`, or a build to verify compiles is
# the surrounding build-tool skill's/user's job, not this skill's.

