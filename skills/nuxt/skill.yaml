id: SK-TECH-nuxt
slug: nuxt
name: Nuxt
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-001, SK-FE-005, SK-GROW-001]   # frontend-architecture, rendering-strategy, seo-optimization

purpose: >-
  Apply Nuxt correctly and version-appropriately — the Nitro server engine,
  file-based routing, auto-imports, and routeRules caching — specializing
  the frontend-architecture, rendering-strategy, and seo-optimization parent
  skills with Nuxt-specific, cited, version-aware detail.
scope: >-
  Nuxt implementation specifics only: Nitro, module/auto-import mechanics,
  routeRules, the Nuxt 3→4 migration, and the v4.5 security advisories
  (especially the cross-user payload-disclosure GHSA). The Next.js-vs-Nuxt
  selection decision and the general React/Vue/Angular comparison belong to
  frontend-architecture (SK-FE-001); Vue-the-base-framework specifics belong
  to SK-TECH-vue.
expertise: Nuxt/Nitro application engineer.
description: >-
  Nuxt-specific implementation: Nitro server engine, file-based routing from
  app/pages/, auto-imports/module system, routeRules caching, Nuxt 3→4
  migration, and the GHSA-wm8w-6qjm-cv43 cross-user payload-disclosure
  advisory. Use when the repo has a nuxt.config.ts, depends on "nuxt", or
  the task names Nuxt/Nitro. Not for the Next.js-vs-Nuxt framework choice
  (frontend-architecture) or generic Vue questions (SK-TECH-vue).

activation_conditions:
  - A nuxt.config.ts/.js file is present in the repo
  - package.json declares a dependency on "nuxt" or the task uses the nuxi CLI
  - The task explicitly names Nuxt, Nitro, or a Nuxt-specific API (useFetch, useAsyncData, routeRules, server/api, definePageMeta)
non_activation_conditions:
  - No Nuxt manifest/config is present and the task doesn't name Nuxt (route to SK-TECH-vue or SK-FE-001)
  - The task concerns Next.js or another React meta-framework (route to SK-TECH-nextjs)
  - The framework/meta-framework choice is still open (route to SK-FE-001 frontend-architecture)
activation_mode: auto

inputs:
  - name: task
    description: The Nuxt-specific task (routing, data-fetching, server route, routeRules/caching config, security remediation, Nuxt 3→4 upgrade, deployment).
    required: true
  - name: existing-nuxt-app
    description: Existing nuxt.config.ts, directory structure, and the Nuxt/Node version currently in use.
    required: false
required_context:
  - The Nuxt major version in use (3.x vs 4.x) and, when relevant, the exact patch version — needed for version-correct and security-correct guidance.
optional_context:
  - Whether any route serves authenticated/per-user data and whether cache/swr/isr route rules are applied to it.
  - The deployment target (Node server, static, serverless/edge) and its Nitro preset.

outputs:
  - name: nuxt-code-or-config
    kind: edit
    description: Version-correct Nuxt code, server routes (Nitro), or nuxt.config.ts changes (routeRules, modules, experimental/future flags).
  - name: security-or-upgrade-analysis
    kind: analysis
    description: GHSA-aware route-rules/caching safety assessment, or a Nuxt 3.x(EOL)→4.x upgrade plan with the version-gated breaking changes that apply.

depends_on_skills: []
related_skills: [SK-TECH-vue]
conflicts_with: [SK-TECH-nextjs]

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: proposing config/code is advisory; running nuxi build/typecheck/analyze
# or purging CDN caches needs shell. No capability_fallbacks needed (not Tier C).

