covered_versions:
  nuxt: ">=4.4 <=4.5 (3.x past EOL as of 2026-07-31)"
version_sensitive_claims:
  - claim: Node.js 22.x or newer (even-numbered LTS lines recommended) is required for the current Nuxt 4.x line — stricter than Nuxt 3's original requirement.
    applies_to: "Nuxt 4.x"
    source_ref: research/technologies/nuxt.md §12; version-matrix.md (Nuxt row)
  - claim: Node 22.19+ is specifically required on the 3→4 upgrade path once the bundled jiti dependency is removed, since config/modules then load via native Node TS/ESM support.
    applies_to: "Nuxt 3→4 upgrade"
    source_ref: research/technologies/nuxt.md §11; version-matrix.md
  - claim: hydrate-on-visible lazy-hydration is available.
    applies_to: ">=3.16"
    source_ref: research/technologies/nuxt.md §5/§8; version-matrix.md
  - claim: future.compatibilityVersion:5 (Nuxt 5 preview behaviors) requires Nuxt 4.2+.
    applies_to: ">=4.2"
    source_ref: research/technologies/nuxt.md §4/§11; version-matrix.md
  - claim: experimental.ssrStreaming (SSR streaming for TTFB) was introduced.
    applies_to: ">=4.5.0"
    source_ref: research/technologies/nuxt.md §8/§12; version-matrix.md
  - claim: GHSA-wm8w-6qjm-cv43 cross-user payload disclosure — apps using cache/swr/isr route rules on authenticated pages could serve a cached _payload.json response to a different user; remediation requires purging CDN/edge caches after upgrading, not just bumping the package.
    applies_to: "Nuxt >=4.4.0 (fixed in 4.5.1); the 3.21.x maintenance line was also affected (fixed in 3.21.10)"
    source_ref: research/technologies/nuxt.md §7/§17; version-matrix.md
  - claim: Nuxt 3.x reached end-of-life and no longer receives bug/security fixes.
    applies_to: "3.x, as of 2026-07-31"
    source_ref: research/technologies/nuxt.md §12; version-matrix.md
last_verified: "2026-09-10"
reverify_triggers:
  - Nuxt 5.x release (~Q4 2026)
  - A new Nuxt security advisory (GHSA) blog post
  - A change to the Node.js minimum-version requirement or LTS schedule affecting Nuxt's stated minimum

owned_knowledge:
  - Nitro server engine specifics (server/api vs server/routes, lifecycle, presets)
  - Nuxt auto-import/auto-registration mechanics and module system
  - routeRules caching mechanics and the GHSA-wm8w-6qjm-cv43 advisory's precise scope
decision_framework_present: true

failure_handling:
  - If the Nuxt major/patch version cannot be determined from nuxt.config.ts/package.json/lockfile, ask or explicitly state the version the guidance assumes — never assume "latest" silently (VA-3).
  - If shell is unavailable/denied, degrade to advisory config/code output and state that nuxi commands (build/typecheck/analyze) or a cache purge were not executed.
  - If a repo is still on Nuxt 3.x, state explicitly that the line is past EOL (2026-07-31) and receiving no further fixes, rather than treating it as a currently supported option.
verification:
  - Any cache/swr/isr route rule proposed for a route touches only non-authenticated data, or the GHSA-wm8w-6qjm-cv43 exposure and its purge-the-cache remediation step were explicitly addressed.
  - Auto-import/file-based-routing conventions (app/pages/, server/api, server/routes) are used instead of a hand-rolled router or duplicate backend framework.
  - Every version-specific claim in the output is tagged with the range it holds for.
  - The cache/swr/isr route-rule behavior is confirmed by actually building and requesting the route (`nuxi build`/`nuxi preview`) and observing whether cached content leaks across users, not assumed from reading `nuxt.config` alone.
evaluation_criteria:
  - For a seeded route serving authenticated/per-user data, refuses or flags a cache/swr/isr route rule unless the GHSA-wm8w-6qjm-cv43 patch level and cache-purge step are confirmed.
  - For a seeded Nuxt 3.x repo, states the 3.x EOL date and does not silently treat 3.x as an actively maintained option.
  - Correctly distinguishes server/api (auto-/api-prefixed) from server/routes (unprefixed) Nitro route placement for a seeded server-route task.
  - Does not restate the Next.js-vs-Nuxt comparison already owned by frontend-architecture (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["nuxt.config.*", "app/**", "server/**", "**/*.vue"]
  vscode:
    argument_hint: "<task, e.g. 'add a cached route rule' or 'plan the Nuxt 3-to-4 upgrade'>"
