covered_versions:
  shadcn_cli: ">=4.0 <=4.21"
version_sensitive_claims:
  - claim: >-
      As of July 2026, newly scaffolded projects default to Base UI (v1.6.0,
      6M+ weekly downloads) as the underlying headless-primitive library
      instead of Radix UI, which was the default from the project's earlier
      history through early 2026. Radix remains fully supported and is not
      deprecated; opt back in with `shadcn init -b radix`.
    applies_to: ">=2026-07 for the default; Radix remains available at any version via -b radix"
    source_ref: research/technologies/shadcn-ui.md §1, §11; research/knowledge-maps/version-matrix.md
  - claim: >-
      The "new-york" component style is current; the "default" style is
      deprecated. components.json's style, tailwind.baseColor, and
      tailwind.cssVariables fields cannot be changed after init without
      reinstalling components.
    applies_to: "current across the shadcn 4.x CLI line"
    source_ref: research/technologies/shadcn-ui.md §4, §14; research/knowledge-maps/version-matrix.md
  - claim: >-
      CLI major version 4 (March 2026) added shadcn/skills, the Presets
      system, --dry-run/--diff/--view flags, init --template scaffolding, a
      --base primitive-choice flag, "shadcn info"/"docs", registry:base
      items, font registry items, and --monorepo support.
    applies_to: ">=4.0 <=4.21"
    source_ref: research/technologies/shadcn-ui.md §3, §12; research/knowledge-maps/version-matrix.md
  - claim: >-
      The current, actively maintained CLI package on npm is named "shadcn"
      (no "-ui" suffix), currently 4.21.0 (2026-09-04). The legacy
      "shadcn-ui" package name is deprecated/unmaintained (last published
      roughly two years prior) — do not `npm install shadcn-ui`.
    applies_to: "current as of 2026-09-04"
    source_ref: research/technologies/shadcn-ui.md §0; research/knowledge-maps/version-matrix.md
  - claim: >-
      Tailwind v3 + React 18 projects continue to work unchanged
      (non-breaking); only newly scaffolded projects default to Tailwind v4 +
      React 19.
    applies_to: "existing projects unaffected; new-project default only"
    source_ref: research/technologies/shadcn-ui.md §11, §13; research/knowledge-maps/version-matrix.md
  - claim: >-
      React 19 + Next.js 15 with npm may surface peer-dependency resolution
      errors for packages not yet declaring React 19 compatibility. Recharts
      specifically needs a package.json "overrides" entry pinning react-is to
      a 19.0.0-rc build, then `npm install --legacy-peer-deps`.
    applies_to: "React 19 projects installed with npm"
    source_ref: research/technologies/shadcn-ui.md §11, §14; research/knowledge-maps/version-matrix.md
  - claim: >-
      The dedicated "cn" utility package (September 2026) is a no-breaking-
      change release for existing projects — old lib/utils.ts (clsx +
      tailwind-merge) keeps working unmodified; migration via `migrate cn` is
      opt-in.
    applies_to: ">=2026-09; opt-in migration, no forced cutover"
    source_ref: research/technologies/shadcn-ui.md §11, §13; research/knowledge-maps/version-matrix.md
last_verified: "2026-09-10"
reverify_triggers:
  - A new shadcn CLI major version release (current is v4, 4.21.0)
  - Any further change to the default headless-primitive library (Base UI vs. Radix)
  - A new Base UI or Radix UI major release that changes prop names/behavior shadcn components depend on
  - Official publication of a general (non-AI-SDK) component-testing guide, which would fill the currently documented gap
  - A disclosed CVE or security advisory affecting shadcn-distributed component code, Base UI, or Radix primitives

owned_knowledge:
  - shadcn/ui's copy-in-source distribution model and its supply-chain/patch implications
  - shadcn CLI command surface (init/add/build/migrate/apply/view/search/docs/info/preset/eject/mcp)
  - components.json configuration and its init-time-immutable fields (style, tailwind.baseColor, tailwind.cssVariables)
  - Base UI vs. Radix UI primitive selection for shadcn/ui projects
  # Cross-cutting security/testing depth is NOT owned here where it belongs to
  # SK-QA-002/SK-QA-001 — the registry-auth and copy-in-source-patch facts
  # above are shadcn-specific and stay here; general injection/secrets/CSP
  # threat modeling is referenced from SK-QA-002, not restated.

decision_framework_present: true

failure_handling:
  - If it's unknown whether the project already has components.json (and what style/primitive it declares), inspect the repo or ask before running init — re-initializing can silently target the wrong primitive/style, and both are immutable post-init (rule VA-3: never assume "latest defaults" silently).
  - If shell is unavailable or denied, degrade to advisory output (which CLI commands would run, what files would change) and state that the CLI was not actually invoked.
  - If asked to install a package literally named "shadcn-ui", stop and flag it as the deprecated/unmaintained legacy package name; use "shadcn" instead.

escalation:
  - Re-running `add --overwrite` over hand-edited components requires explicit user confirmation — it can silently discard local customizations, since the CLI does not diff against a VCS baseline on its own.
  - A Radix-to-Base-UI primitive migration on an existing production project is presented for confirmation before running the documented AI-driven, component-by-component migration tool, since it changes imports/behavior per component.

verification:
  - Confirm which style ("new-york" vs. deprecated "default") and which primitive (Base UI vs. Radix) the project's components.json already declares before adding new components, since both are immutable post-init.
  - Any CLI command proposed is checked against the documented v4 command surface (init/add/apply/view/search/docs/info/build/preset/migrate/eject/mcp) rather than an invented flag.
  - Any version-specific claim carries the range it holds for.

evaluation_criteria:
  - For a seeded "add a component" task, uses `shadcn add` (never the deprecated `shadcn-ui` package) and does not silently overwrite an existing hand-edited component without flagging the risk.
  - For a seeded "new project" task, correctly identifies whether Base UI (current default, >=July 2026) or Radix (opt-in via `-b radix`, or a pre-July-2026 project) is the intended primitive and states which.
  - Correctly frames a shadcn/ui-vs-MUI recommendation using the structural distribution-model difference (copied source vs. versioned dependency), not a generic "shadcn is better" claim.
  - Does not restate the general styling-system or UI/UX-design decision owned by SK-FE-003/SK-FE-002 (rule QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running the shadcn CLI (init/add/build/migrate)
  cursor:
    paths: ["components.json", "**/components/ui/**", "**/*.tsx"]
  vscode:
    argument_hint: "<task, e.g. 'add a shadcn dialog component' or 'decide Base UI vs Radix for a new project'>"
