id: SK-TECH-shadcn-ui
slug: shadcn-ui
name: shadcn/ui
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-FE-003, SK-FE-002]   # styling-systems, ui-ux-design (neither yet authored in this library)

purpose: >-
  Apply shadcn/ui correctly as a copy-in-source component distribution system
  for React + Tailwind CSS projects — CLI usage, registry/config mechanics,
  Base UI vs. Radix primitive choice, and the code-ownership implications
  this model creates — not as if it were an installed npm component-library
  dependency.
scope: >-
  shadcn/ui-specific CLI, registry, configuration, and theming mechanics, and
  the version-specific defaults (Base UI vs. Radix, "new-york" style,
  init-time-immutable config) a project locks in at init. The general
  styling-system choice (Tailwind vs. Sass vs. plain CSS) and UI/UX design
  method come from the parent Layer-3 skills SK-FE-003 (styling-systems) and
  SK-FE-002 (ui-ux-design) — neither is yet authored in this library; both are
  forward-referenced here, not fabricated.
expertise: Frontend engineer working with shadcn/ui component distribution.
description: >-
  shadcn/ui-specific CLI usage (init/add/build/migrate), the copy-in-source
  component distribution model (not an installed npm package), Base UI vs.
  Radix UI primitive selection, components.json configuration, registry
  protocol, and theming. Use when components.json is present, the shadcn CLI
  is invoked, or @/components/ui imports appear. Not for MUI (SK-TECH-mui),
  the general styling-system choice (SK-FE-003), or UI/UX design method
  (SK-FE-002).

activation_conditions:
  - A components.json file is present in the project
  - The shadcn (or legacy shadcn-ui) CLI is invoked, or @/components/ui-style imports appear
  - The task names shadcn/ui, or asks to add/customize a shadcn component, registry item, or theme token
  - A React + Tailwind CSS project needs copy-in-source UI components rather than an installed component-library dependency
non_activation_conditions:
  - The stack uses MUI or another installed component-library package instead (route to SK-TECH-mui)
  - The general styling-system choice (Tailwind vs. Sass vs. plain CSS) hasn't been made yet (route to SK-FE-003)
  - Pure UI/UX design method with no specific technology chosen (route to SK-FE-002)
  - The project has no Tailwind CSS + React (or another shadcn-supported framework) foundation at all
activation_mode: auto

inputs:
  - name: task
    description: The shadcn/ui task (init a project, add/customize a component, configure theming, choose Base UI vs. Radix, set up a private registry, migrate cn/icons/base-color).
    required: true
  - name: existing-project
    description: Existing components.json, package.json (shadcn/tailwindcss/react/react-dom versions), or already-installed components under components/ui.
    required: false
required_context:
  - Whether components.json already exists and what style/primitive it declares — determines init vs. add workflow and whether a primitive/style choice is already locked in.
optional_context:
  - Whether the project targets a monorepo (Turborepo) layout with a shared packages/ui workspace.
  - Whether a private/internal registry (with auth) is in use.
  - The React and Tailwind CSS major versions in use (affects the React-19 peer-dependency and Tailwind-v4 data-slot guidance).

outputs:
  - name: component-source
    kind: edit
    description: Component .tsx source files copied/customized under components/ui (or a workspace-aliased path), plus components.json.
  - name: cli-invocation
    kind: command-run
    description: shadcn CLI commands run (init/add/build/migrate/etc.) to scaffold or update components.
  - name: analysis
    kind: analysis
    description: Recommendations on primitive choice (Base UI vs. Radix), style/theme configuration, and upgrade/patch strategy given the copy-in-source model.

depends_on_skills: []
related_skills: [SK-TECH-tailwindcss]
conflicts_with: [SK-TECH-mui]

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# The shadcn CLI is a shell-invoked scaffolding tool (init/add/build/migrate
# copy and modify files in the project) — unlike a plain npm-install-only
# component library, Tier B (shell) is appropriate, not Tier A.

