id: SK-ORCH-003
slug: workflow-composer
name: Workflow composer
spec_version: "1.0"
skill_version: "0.1.0"
kind: generic
layer: 0
domain: ORCH

purpose: >-
  Sequence a multi-skill effort into an ordered, gated workflow, carry state
  between stages, and refuse to mark the run complete while a required gate is
  unrun.
scope: >-
  Cross-skill orchestration of a run: stage order, the handoff artifact each
  stage passes on, parallelism where it is safe, loop budgets with declared exit
  criteria, approval-gate placement and lifecycle, recovery-rung selection when a
  stage does not succeed, and the final-validation checklist. Not the work of any
  one stage. Not skill selection (skill-router, SK-ORCH-001) or host-capability
  resolution (capability-adapter, SK-ORCH-002). Distinct from technical-planning
  (SK-DISC-003), which decomposes the work itself into ordered tasks; this skill
  stages the skills that will do it.
expertise: >-
  Principal engineer with multi-stage agent-workflow and release-gate discipline.
description: >-
  Stage a multi-skill effort into an ordered, gated workflow — sequence,
  parallelize, loop with declared exit criteria, carry a named handoff artifact
  between stages, and refuse to mark completion while a required gate is unrun.
  Use when a task needs several skills across build and verify phases. Not for
  single-stage tasks or pure Q&A, and not for decomposing the work itself into
  tasks (technical-planning).

activation_conditions:
  - A task requires several skills across build and verify phases
  - A run needs explicit stage ordering, gates, and handoff artifacts before execution begins
  - A stage did not succeed and the run needs a recovery decision rather than an ad hoc retry
  - A run is approaching completion and needs final validation against what was actually asked
non_activation_conditions:
  - A single-stage task, or pure question-and-answer with no change requested
  - The request is which skills apply (route to skill-router) or whether the host can execute a step (route to capability-adapter)
  - The request is to break agreed work into ordered implementation tasks (route to technical-planning)
activation_mode: auto

inputs:
  - name: routing-plan
    description: The selected skills and their reasons, from skill-router — the hard input this skill always consults before staging anything.
    required: true
  - name: task-goal
    description: The objective and the verbatim task statement the finished run is validated against.
    required: true
  - name: capability-decisions
    description: Per-step execute, fallback, advisory, or not-possible-here decisions, where a Tier B/C step is involved.
    required: false
  - name: repository-conventions
    description: The detected conventions every stage's output is judged against.
    required: false
outputs:
  - name: staged-workflow
    kind: analysis
    description: Ordered stages with their execution semantics, the handoff artifact each passes on, declared loop budgets and exit criteria, and every approval gate surfaced up front with its denied-branch.
  - name: run-record
    kind: analysis
    description: The append-only record of stage outcomes, gate requests and responses, degradations, and recovery decisions — the evidence the final validation is checked against.
  - name: completion-report
    kind: analysis
    description: The final validation result — complete, or incomplete with an explicit statement of residuals, degradations, deferred findings, and open questions.

depends_on_skills: [SK-ORCH-001]
related_skills: [SK-ORCH-002, SK-DISC-003, SK-CONV-007, SK-QA-001]
conflicts_with: []

required_capabilities: [file-read]
execution_tier: A

