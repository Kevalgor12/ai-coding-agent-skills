owned_knowledge:
  - Stage composition — establishing stage order and the named handoff artifact each stage passes to the next
  - Approval-gate placement and lifecycle (declared, armed, requested with a specific proposal, awaiting a real user response, recorded, consumed) including the denied-branch requirement
  - Loop-budget discipline — no loop without a declared exit criterion, budgets declared before the loop starts, and non-convergence surfaced rather than silently continued or abandoned
  - Recovery-rung selection — matching an agent-workflow failure class to the cheapest adequate response rather than retrying blindly or escalating reflexively
  - The completion rule and final-validation checklist — a run is complete only on recorded evidence, and no required gate may be left unrun
decision_framework_present: true

failure_handling:
  - If a stage returns anything other than success, select a recovery rung from the failure class rather than retrying identically or dropping the stage.
  - If a loop's exit criterion cannot be stated in advance, do not start the loop — escalate for a criterion instead.
  - If a loop exhausts its budget, escalate with what was tried and what was ruled out; never continue past the budget and never silently give up.
  - If the host cannot deliver requested parallelism, run the stages sequentially — a workflow's correctness must never depend on parallelism.
  - If a gate is denied, take the plan's declared denied-branch and record the denial; never re-request the same approval as if it had not been answered.
verification:
  - Every planned stage has a recorded terminal outcome — no stage is silently dropped so that completion can be claimed.
  - Verification and convention stages are ordered after implementation, never skipped at the end.
  - Every approval gate was surfaced before work started and, where triggered, was answered by an actual user response before the action ran.
  - Every loop had a declared exit criterion and budget before it started.
  - The completion report distinguishes complete from incomplete-with-residuals, and every degradation and deferred finding appears in it.
escalation:
  - A denied gate ends that branch; the run continues on its declared denied-branch or stops with a residual statement, never by proceeding anyway.
  - A non-converging loop escalates to the user with the narrowest remaining hypothesis rather than consuming further budget.
  - Evidence that invalidates the plan escalates as a replan through skill-router rather than being patched into the running stage order.
  - A finding outside the running stage's scope is handed to its owning skill as a separate change, never fixed opportunistically inside the current stage.
evaluation_criteria:
  - For a seeded feature task, produces a stage order that places verification and conventions after implementation and never marks completion with an unrun required gate.
  - Declares an exit criterion and a budget for every loop before the loop starts, and surfaces non-convergence rather than looping indefinitely.
  - Selects a recovery rung matching the failure class, and never repeats an identical failed attempt without a stated correction.
  - Produces a completion report that names every degradation, deferred finding, and open question rather than reporting unqualified success.
  - Runs correctly when parallelism is unavailable, producing the same result sequentially.

