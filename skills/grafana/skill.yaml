id: SK-TECH-grafana
slug: grafana
name: Grafana
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-QA-004]

purpose: >-
  Apply Grafana correctly and version-appropriately as the visualization/
  dashboarding/alerting layer over external data sources, specializing the
  observability parent skill with Grafana's dashboard/panel/variable model,
  data-source plugin architecture, unified alerting, and provisioning-as-code.
scope: >-
  Grafana-specific implementation: dashboards, panels, template variables,
  the data-source plugin model (no universal query language), unified
  alerting and its relationship to Prometheus Alertmanager, exemplars,
  dashboards-as-code/provisioning, RBAC, secret encryption, and version/
  breaking-change history. Does not cover signal-selection method, alert-
  design method, or cardinality/PII discipline — owned by the observability
  parent (SK-QA-004). Does not cover PromQL/Prometheus internals
  (SK-TECH-prometheus) or OTLP instrumentation (SK-TECH-opentelemetry).
expertise: Grafana dashboard/alerting engineer.
description: >-
  Grafana-specific dashboard/panel/variable mechanics, data-source plugin
  model, unified alerting vs. Prometheus Alertmanager, and dashboards-as-
  code/provisioning. Use when the stack includes Grafana (grafana.ini,
  docker image grafana/grafana(-enterprise), provisioning/ dashboards,
  Grafana data-source config) or the task names Grafana dashboards/alerts.
  Not for generic observability method (use observability), PromQL/
  Prometheus internals, or OpenTelemetry instrumentation.

activation_conditions:
  - A Grafana config file, Docker image (grafana/grafana or grafana/grafana-enterprise), or provisioning/ directory is present in the repo
  - The task names Grafana dashboards, panels, variables, alerting, or data sources
  - A dashboard JSON file or Terraform/Ansible/Grizzly/Operator config targeting Grafana is being authored or reviewed
non_activation_conditions:
  - No Grafana instance, config, or dashboard artifact is present and the task doesn't name Grafana
  - The task is about PromQL query authoring or Prometheus server/scrape config with no Grafana visualization/alerting concern (route to SK-TECH-prometheus)
  - The task is about OpenTelemetry instrumentation/collection with no Grafana visualization concern (route to SK-TECH-opentelemetry)
  - The task is signal-selection, alert-design method, or cardinality/PII discipline in the abstract, not Grafana-specific mechanics (route to SK-QA-004)
activation_mode: auto

inputs:
  - name: task
    description: The Grafana task (dashboard/panel design, variable setup, alert rule/routing, data-source config, provisioning, upgrade).
    required: true
  - name: grafana-version
    description: The Grafana major.minor version in use (from grafana.ini, Docker image tag, or Grafana Cloud), needed for version-correct guidance.
    required: false
outputs:
  - name: dashboard-or-provisioning-change
    kind: edit
    description: Dashboard JSON, provisioning YAML, or as-code (Terraform/Ansible/Grizzly) config for dashboards/data sources.
  - name: alert-rule-or-routing-change
    kind: edit
    description: Grafana-managed alert rule or notification-policy/Alertmanager routing config.
  - name: analysis
    kind: analysis
    description: Recommendations on data-source choice, variable design, alerting-engine routing, or upgrade risk, with the version they apply to.

depends_on_skills: []
related_skills: [SK-TECH-prometheus, SK-TECH-opentelemetry]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B

