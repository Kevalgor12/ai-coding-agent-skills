id: SK-TECH-go
slug: go
name: Go
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-001]   # backend-architecture

purpose: >-
  Apply Go correctly and version-appropriately — goroutine/channel
  concurrency, explicit multi-value error handling, the module system,
  generics, and version-gated toolchain/runtime behavior across Go's
  rolling two-major support window.
scope: >-
  Go-specific language, runtime, and toolchain facts: concurrency primitives
  (goroutines, channels, select), the (value, error) idiom, go.mod/go.sum/
  go.work module mechanics, generics since 1.18, GC/GOMEMLIMIT/PGO
  performance tuning, and standard-library testing. The generic
  service-structuring method (layering, middleware, DI, shutdown) comes from
  the parent Layer-3 skill (backend-architecture).
expertise: Go backend engineer.
description: >-
  Go-specific concurrency (goroutines/channels), explicit multi-value error
  returns, the module system (go.mod/go.sum/go.work), generics (since Go
  1.18), GOMEMLIMIT/PGO performance tuning, and standard-library testing
  (go test, benchmarks, fuzzing). Use when the stack is Go (go.mod present,
  .go files, or the task names Go/goroutines/channels). Not for Node.js or
  Python backends (use those skills), or generic service structuring (use
  backend-architecture).

activation_conditions:
  - A go.mod file or .go source files are present in the repo
  - The task names Go, goroutines, channels, or a Go-specific tool (go test, go build, go mod, govulncheck)
  - A Go version/toolchain upgrade or module dependency change is being planned
non_activation_conditions:
  - The stack uses Node.js or Python (route to that runtime's skill)
  - Generic backend layering/middleware/DI decisions with no runtime chosen yet (route to SK-BE-001 backend-architecture)
  - Database-specific SQL/schema design unrelated to Go's database/sql usage (route to the relevant data skill)
activation_mode: auto

inputs:
  - name: task
    description: The Go task (concurrency design, error-handling pattern, module/dependency change, generics usage, performance tuning, test/fuzz authoring).
    required: true
  - name: existing-code
    description: Existing go.mod, module layout, and any profiling/benchmark output.
    required: false
required_context:
  - The Go version/toolchain in use (go.mod's `go` directive or `go version`) — needed for version-correct guidance given the ~6-month major-release cadence and rolling two-major support window.
optional_context:
  - CPU/heap pprof profiles or an existing default.pgo file.
  - go test -race / -bench output.

outputs:
  - name: code-or-module-change
    kind: edit
    description: Go source or go.mod/go.sum/go.work changes reflecting version-correct Go idioms.
  - name: concurrency-or-error-handling-design
    kind: analysis
    description: Goroutine/channel or worker-pool design, and explicit error-handling pattern, for the task at hand.
  - name: analysis
    kind: analysis
    description: Recommendations (concurrency approach, FIPS-mode applicability, performance tuning) with rationale and the version they apply to.

depends_on_skills: []
related_skills: []
conflicts_with: [SK-TECH-nodejs, SK-TECH-python]   # alternative backend runtimes/languages for the same service

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: proposing code/module changes is advisory; running go build/go
# test/govulncheck/pprof needs shell. No capability_fallbacks block required
# (Tier B, not C) — degrades to advisory per failure_handling below.

