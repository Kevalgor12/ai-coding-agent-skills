id: SK-TECH-mongodb
slug: mongodb
name: MongoDB
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-001, SK-DATA-005]   # data-modeling, search-integration (not yet authored)

purpose: >-
  Apply MongoDB correctly and version-appropriately — document schema design
  (embedding vs. referencing), the aggregation pipeline, sharding, ESR-rule
  indexing, transactions, and RBAC/field-level encryption.
scope: >-
  MongoDB-specific implementation detail. Specializes the generic method from
  data-modeling (SK-DATA-001) with MongoDB's concrete document-model API,
  aggregation framework, sharding/replication architecture, indexing rules,
  and security/deployment specifics. Not the generic store-shape decision or
  entity/relationship design method (data-modeling), not ODM/driver usage
  mechanics (orm-integration / mongoose), not full-text/vector search
  integration depth (search-integration, not yet authored in this library).
expertise: MongoDB database engineer.
description: >-
  MongoDB-specific document modeling (embedding vs. referencing), aggregation
  pipeline, sharding, the ESR indexing rule, multi-document transactions, and
  RBAC/field-level encryption. Use when the stack uses MongoDB
  (mongodb://+mongodb+srv:// URI, an official MongoDB driver, Mongoose/another
  ODM, or the task names MongoDB). Not for generic schema design
  (data-modeling), ODM usage mechanics (orm-integration/mongoose), or other
  database engines (postgresql/mysql).

activation_conditions:
  - A mongodb:// / mongodb+srv:// connection string or an official MongoDB driver is present
  - Mongoose or another MongoDB ODM is configured in the project
  - The task names MongoDB or a MongoDB-specific concept (aggregation pipeline, sharding, WiredTiger, replica set, $lookup, BSON)
non_activation_conditions:
  - The stack uses PostgreSQL, MySQL, or another engine (route to that engine's technology skill)
  - Purely generic schema design with no engine chosen yet (route to SK-DATA-001 data-modeling)
  - ODM/driver usage mechanics independent of MongoDB-specific behavior (route to SK-DATA-002 orm-integration or SK-TECH-mongoose)
activation_mode: auto

inputs:
  - name: task
    description: The MongoDB task (schema/document design, aggregation pipeline, indexing, sharding, transaction design, security hardening).
    required: true
  - name: schema-and-workload
    description: Existing collections, sample documents, access patterns, and (ideally) explain() or aggregation pipeline output.
    required: false
required_context:
  - The MongoDB major version and deployment form in use (self-managed Community/Enterprise vs. Atlas) — needed for version-correct guidance.
optional_context:
  - explain() output or the database profiler's slow-op log for a slow query/pipeline.
  - Existing index definitions and their usage stats.
  - Whether the deployment is a single replica set or a sharded cluster.

outputs:
  - name: schema-or-validator
    kind: edit
    description: Document/collection schema (embedding vs. referencing decision) and/or a $jsonSchema validator reflecting version-correct MongoDB features.
  - name: index-or-pipeline-change
    kind: edit
    description: Index definitions (ESR-ordered) or aggregation pipeline changes addressing an observed access pattern or slow op.
  - name: analysis
    kind: analysis
    description: Recommendations (embed/reference, sharding, transactions) with rationale and the version they apply to.

depends_on_skills: []
# Policy fix (2026-09-09, applied consistently with the solution-architecture
# fix from the DISC-domain batch): depends_on_skills is reserved for hard
# composition (invoking another skill as a blocking sub-step of this skill's
# own execution). The relationship to the generic parent skill(s) above is
# specialization, already fully captured by the `parents` field -- duplicating
# it into depends_on_skills was redundant and conflated the two relationship
# types. Cleared here; parents is the single source of truth for this edge.
related_skills: [SK-TECH-mongoose, SK-TECH-postgresql, SK-TECH-mysql, SK-DATA-002, SK-DATA-006]
conflicts_with: []
# MongoDB is a decision-matrix alternative to relational stores, not a hard
# mutual exclusion — polyglot persistence (e.g. PostgreSQL + MongoDB for
# different purposes) is a legitimate pattern in this library.

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Tier B: proposing schema/aggregation/index changes is advisory; running
# mongosh/aggregate/explain or creating indexes needs shell.

