covered_versions:
  mongodb: ">=7.0 <=8.3"
version_sensitive_claims:
  - claim: MongoDB 5.0+ requires AVX CPU instruction-set support (Intel Haswell+ / AMD Bulldozer+ / ARMv8.2-A+).
    applies_to: ">=5.0"
    source_ref: research/knowledge-maps/version-matrix.md (MongoDB section)
  - claim: MongoDB is incompatible with Linux kernel 6.19–7.0.13 (TCMalloc incompatibility causing crashes, across all package forms including Docker images); fix is upgrading to kernel 7.0.14+.
    applies_to: "all currently-supported MongoDB versions running on kernel 6.19–7.0.13"
    source_ref: research/knowledge-maps/version-matrix.md (MongoDB section)
  - claim: Multi-document ACID transactions are available on replica sets since 4.0 and on sharded clusters since 4.2.
    applies_to: ">=4.0 (replica sets); >=4.2 (sharded clusters)"
    source_ref: research/knowledge-maps/version-matrix.md (MongoDB section)
  - claim: featureCompatibilityVersion (FCV) must be fully raised to the current version before upgrading binaries to a new major version; restarting with a newer binary before FCV finishes upgrading can crash nodes.
    applies_to: "all major-version upgrades"
    source_ref: research/knowledge-maps/version-matrix.md (MongoDB section)
  - claim: Drivers released more than 3 years after a server version's EOL date will not be compatible with that server version.
    applies_to: "all versions"
    source_ref: research/knowledge-maps/version-matrix.md (MongoDB section)
  - claim: Transparent Hugepages should be enabled as of MongoDB 8.0+, but disabled on MongoDB 7.0 and earlier.
    applies_to: "8.0+ (enable); <=7.0 (disable)"
    source_ref: research/knowledge-maps/version-matrix.md (MongoDB section)
  - claim: Field names may contain dots (.) and dollar signs ($), with restrictions, as of MongoDB 5.0.
    applies_to: ">=5.0"
    source_ref: research/knowledge-maps/version-matrix.md (MongoDB section)
  - claim: As of MongoDB 8.3, DDL operations and applyOps run only on mongos for all sharded clusters (tightening a restriction already introduced in 8.0).
    applies_to: ">=8.3"
    source_ref: research/knowledge-maps/version-matrix.md (MongoDB section)
  - claim: Since MongoDB 8.2, minor releases (8.2, 8.3, …) are production-suitable but may not support Atlas Live Migration/mongosync; upgrades through minor releases must be sequential, no skipping.
    applies_to: ">=8.2"
    source_ref: research/knowledge-maps/version-matrix.md (MongoDB section)
  - claim: A dynamic algorithm auto-tunes storage-engine concurrent-transaction tickets (capped at 128 read / 128 write) as of MongoDB 7.0.
    applies_to: ">=7.0"
    source_ref: research/technologies/mongodb.md (§2 Architecture, WiredTiger)
last_verified: "2026-09-09"
reverify_triggers:
  - A new MongoDB major release reaches General Availability (e.g. 9.0 GA — unconfirmed as of this skill's research date).
  - Any change to the minor-release (8.2+) production-suitability or Atlas Live Migration/mongosync support matrix.
  - Any change to the FCV upgrade mechanics or direct-to-shard DDL restrictions in official docs.
  - A new documented schema anti-pattern or design pattern added to MongoDB's official data-modeling docs.

owned_knowledge:
  - MongoDB document-model API specifics (BSON, _id, dot notation, document/field limits)
  - MongoDB aggregation pipeline mechanics and stage limits
  - MongoDB sharding and replica-set architecture, and the ESR indexing rule
  - MongoDB version-specific upgrade/FCV mechanics and breaking-change history
  # Generic embedding-vs-referencing/store-shape reasoning is owned by SK-DATA-001
  # and referenced, not restated, here.
decision_framework_present: true

failure_handling:
  - If the MongoDB major version and deployment form (self-managed vs. Atlas) cannot be determined, ask for them or state the version the guidance assumes — never assume "latest" silently (VA-3).
  - If shell is unavailable/denied, degrade to advisory schema/pipeline/index output and say that indexes, aggregation, or explain() were not actually run.
  - If the underlying store-shape decision (document vs. relational) is still open, hand off to SK-DATA-001 rather than assuming MongoDB is already the right choice.

escalation:
  - A sharding-topology decision, or moving a $jsonSchema validationAction from warn to error on a populated collection, requires explicit user confirmation before being treated as decided (defer to SK-DATA-006 rollout discipline).
  - Raising FCV as part of a major-version upgrade removes the easy downgrade path within that major — confirm with the user before doing so.
  - A change to authentication/authorization configuration (enabling/relaxing RBAC) on a production deployment requires explicit confirmation.

verification:
  - Compound indexes follow the ESR rule (Equality, Sort, Range) unless deliberately deviated from, with a stated reason.
  - The embedding-vs-referencing choice is justified by the access pattern and by MongoDB's own limits (16 MiB document size, unbounded-array anti-pattern), not chosen by default.
  - Any version-gated claim is tagged with the range it holds for.
  - For a schema-validation change, a staged rollout path exists (warn before error) rather than a hard cutover on a populated collection.
  - A proposed transaction is justified against MongoDB's own guidance to prefer denormalized/embedded design over multi-document transactions where feasible.

evaluation_criteria:
  - For a seeded access pattern, proposes embed vs. reference per MongoDB's own documented design patterns (Computed, Bucket/Group, Polymorphic, Schema Versioning, Archive, Single Collection), not a guess.
  - Flags excessive cross-collection $lookup as a denormalization signal when the seeded pipeline exhibits it, per MongoDB's documented anti-patterns.
  - Orders a seeded compound index per the ESR rule and explains the ordering.
  - Any claim about a version-gated MongoDB feature (FCV, sharding DDL routing, Transparent Hugepages guidance, AVX requirement, minor-release sequencing) is correct for the stated MongoDB version.
  - Does not restate the generic schema-design/store-shape method owned by SK-DATA-001 (QR-2); references it instead.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running mongosh/aggregate/explain/createIndex; abstract shell → CC tools
  cursor:
    paths: ["**/*.js", "**/*.ts", "**/models/**", "**/schemas/**"]
  vscode:
    argument_hint: "<task, e.g. 'design the schema for this aggregate' or 'add a compound index for this query'>"
