id: SK-TECH-drizzle
slug: drizzle
name: Drizzle ORM
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-002, SK-DATA-006]

purpose: >-
  Apply Drizzle ORM correctly and version-appropriately — schema-as-TypeScript,
  SQL-proximity query building, Relational Queries, drizzle-kit migrations, and
  RLS — while navigating the live split between the stable 0.x line most
  production code runs and the 1.0.0-rc line the current docs describe.
scope: >-
  Drizzle-specific API, configuration, and migration-tooling detail. The
  general ORM method (N+1 avoidance across ORMs, transaction handling,
  ORM-selection) belongs to orm-integration (SK-DATA-002); general migration
  safety mechanics (expand/contract, backfill batching, destructive-op
  guarding) belong to data-migration (SK-DATA-006). This skill supplies what's
  Drizzle-specific: the headless/SQL-proximity model, the relations()/RQBv1
  vs. defineRelations()/RQBv2 version split, drizzle-kit workflows, the RLS
  API, and PGlite-based testing.
expertise: TypeScript/SQL engineer maintaining a Drizzle data layer across the v0.x-to-v1 transition.
description: >-
  Drizzle ORM-specific schema (pgTable/mysqlTable/sqliteTable), the query
  builder and Relational Queries API, drizzle-kit migrations, and RLS
  (withRLS()+pgPolicy()). Use when drizzle-orm/drizzle-kit or a
  drizzle.config.ts is present, or the task names Drizzle. Critical: npm
  "latest" is 0.45.2 but the live docs already target v1.0.0-rc — confirm the
  installed line before trusting current docs. Not for other ORMs (route to
  their skill) or ORM-neutral method (orm-integration).

activation_conditions:
  - drizzle-orm and/or drizzle-kit appear in package.json, a lockfile, or an import statement
  - A drizzle.config.ts file is present in the repo
  - The task names Drizzle ORM, drizzle-kit, Drizzle Studio, or PGlite-based Drizzle testing specifically
non_activation_conditions:
  - The codebase uses Prisma, TypeORM, or Mongoose instead (route to that technology skill)
  - The question is generic ORM/ODM method with no specific ORM chosen yet (route to orm-integration)
  - The task is migration safety mechanics (expand/contract, backfill batching) with no Drizzle-specific tooling question (route to data-migration)
activation_mode: auto

inputs:
  - name: task
    description: The Drizzle-specific task (schema definition, query, relation, migration, RLS policy, test setup).
    required: true
  - name: installed-version-line
    description: Which Drizzle line is actually pinned — 0.x stable or 1.0.0-rc/beta — from package.json/lockfile.
    required: false
required_context:
  - Which Drizzle line is pinned (0.x vs 1.0.0-rc/beta) — the v0/v1 API surface differs enough (defineRelations vs relations(), withRLS vs enableRLS(), migration folder format) that guidance is wrong without this.
optional_context:
  - Target dialect (PostgreSQL/MySQL/SQLite) and driver (node-postgres, postgres.js, Neon, PGlite, etc.)
  - Existing drizzle.config.ts content

outputs:
  - name: schema-or-query-code
    kind: edit
    description: Drizzle schema (pgTable/mysqlTable/sqliteTable) or query-builder/Relational-Queries code correct for the confirmed version line.
  - name: migration-or-policy
    kind: edit
    description: drizzle-kit migration files/config, or an RLS policy definition (withRLS()/pgPolicy() or legacy enableRLS()).
  - name: analysis
    kind: analysis
    description: The determined version line and which v0-vs-v1 caveats apply to the task at hand.

depends_on_skills: []
# Policy fix (2026-09-09, applied consistently with the solution-architecture
# fix from the DISC-domain batch): depends_on_skills is reserved for hard
# composition (invoking another skill as a blocking sub-step of this skill's
# own execution). The relationship to the generic parent skill(s) above is
# specialization, already fully captured by the `parents` field -- duplicating
# it into depends_on_skills was redundant and conflated the two relationship
# types. Cleared here; parents is the single source of truth for this edge.
related_skills: [SK-TECH-postgresql, SK-TECH-mysql]
conflicts_with: [SK-TECH-prisma, SK-TECH-typeorm, SK-TECH-mongoose]

required_capabilities: [file-read, file-write, shell]
execution_tier: B

