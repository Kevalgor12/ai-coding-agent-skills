covered_versions:
  drizzle-orm: "0.x (stable/production — where the npm 'latest' dist-tag and most deployed codebases sit, at 0.45.2) and 1.0.0-rc (pre-release — active RC line, newest tagged release 1.0.0-rc.4; the live docs already describe this line, not 0.x)"
  drizzle-kit: "coupled to drizzle-orm's line for the v1 transition — 0.x paired with drizzle-orm 0.x; the rc tag installs both together during beta/rc"
  postgresql: ">=15 for unique()'s NULLS NOT DISTINCT option"
version_sensitive_claims:
  - claim: "defineRelations() (RQB v2) is the relation-declaration API; the legacy relations() function and RQBv1 are removed entirely."
    applies_to: "1.0.0-rc / v1 line only"
    source_ref: "research/technologies/drizzle.md §3, §13"
  - claim: "relations() + Relational Queries v1 (RQBv1) is the relation-declaration and relational-query API."
    applies_to: "0.x stable line"
    source_ref: "research/technologies/drizzle.md §1, §13"
  - claim: "RLS is enabled via pgTable.withRLS(); the standalone .enableRLS() method is deprecated."
    applies_to: "1.0.0-rc / v1 line only (0.x uses .enableRLS())"
    source_ref: "research/technologies/drizzle.md §13"
  - claim: "Migration folder structure uses the v3 format: journal.json eliminated, SQL files and snapshots grouped per-migration folder, drizzle-kit drop removed."
    applies_to: "1.0.0-rc / v1 line only"
    source_ref: "research/technologies/drizzle.md §11, §13; research/knowledge-maps/version-matrix.md (Drizzle ORM row)"
  - claim: "unique()'s NULLS NOT DISTINCT option is available."
    applies_to: "PostgreSQL >=15"
    source_ref: "research/knowledge-maps/version-matrix.md (Drizzle ORM row)"
  - claim: "getColumns() is the utility function name (renamed from getTableColumns())."
    applies_to: "1.0.0-rc / v1 line only (0.x uses getTableColumns())"
    source_ref: "research/technologies/drizzle.md §13"
  - claim: "drizzle-kit versioning is coupled to drizzle-orm and both are installed together via the rc tag."
    applies_to: "1.0.0-beta/rc transition period only"
    source_ref: "research/technologies/drizzle.md §12"
last_verified: "2026-09-09"
reverify_triggers:
  - Drizzle v1.0.0 GA release
  - The npm latest dist-tag for drizzle-orm moving off the 0.x line
  - orm.drizzle.team/docs/latest-releases being reconciled with the GitHub releases page (a documented staleness gap existed at research time)

owned_knowledge:
  - Drizzle schema-as-TypeScript API (pgTable/mysqlTable/sqliteTable, column builders, index/constraint builders)
  - Drizzle query builder and Relational Queries API, both the v0.x (relations()/RQBv1) and v1 (defineRelations()/RQBv2) forms
  - drizzle-kit CLI and migration workflow (generate/push/pull/migrate/studio/check) including the v1 migration-folder-format change
  - Drizzle's RLS API (withRLS()/enableRLS(), pgPolicy(), Neon/Supabase integrations)
  - Drizzle's v0-to-v1 breaking-change surface and upgrade path
decision_framework_present: true

failure_handling:
  - If the installed Drizzle line (0.x vs 1.0.0-rc/beta) cannot be determined from package.json/lockfile, ask before applying any version-sensitive API — never assume the live-docs (v1) surface applies by default (VA-3).
  - If shell is unavailable, produce advisory schema/migration/RLS-policy code and state explicitly that drizzle-kit was not run to generate or apply it.
verification:
  - Every version-sensitive API used (defineRelations vs. relations(), withRLS() vs. enableRLS(), getColumns() vs. getTableColumns()) matches the confirmed installed line.
  - Any migration output assumes the folder format (pre-v1 journal.json vs. v1 per-migration folders) matching the installed drizzle-kit version.
  - Any sql.raw() usage is confirmed to carry only trusted, non-user-controlled input, never interpolated user data.
evaluation_criteria:
  - Given a seeded package.json pinning drizzle-orm to a 0.x version, produces schema/query code using v0.x-correct APIs (relations(), enableRLS(), getTableColumns()), not v1 APIs.
  - Given a seeded package.json pinning drizzle-orm to 1.0.0-rc.x, produces code using v1 APIs (defineRelations(), withRLS(), getColumns()).
  - When the installed line is ambiguous or unstated, proactively flags the v0-vs-v1 discrepancy rather than silently defaulting to whichever the live docs currently show.
  - For a production migration scenario, recommends generate + migrate rather than push, citing the official production guidance.
  - Does not restate orm-integration's cross-ORM N+1/selection framework or data-migration's expand/contract method verbatim (QR-2).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["**/schema.ts", "**/drizzle.config.ts", "**/drizzle/**"]
  vscode:
    argument_hint: "<task, e.g. 'add a pgPolicy for tenant isolation' or 'upgrade RQBv1 to defineRelations'>"
