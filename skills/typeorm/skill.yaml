id: SK-TECH-typeorm
slug: typeorm
name: TypeORM
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-002, SK-DATA-006]   # orm-integration, data-migration

purpose: >-
  Apply TypeORM correctly and version-appropriately: its Active Record and
  Data Mapper duality, DataSource/EntityManager/Repository/QueryRunner
  architecture, and the live, simultaneously-maintained 0.3.x/1.0 version
  split.
scope: >-
  TypeORM-specific architecture, API surface, configuration, and
  version-boundary detail. The generic ORM method (N+1 avoidance, transaction
  discipline, ORM/ODM selection) comes from orm-integration (SK-DATA-002);
  migration safety mechanics (expand/contract, backfill batching) come from
  data-migration (SK-DATA-006). This skill supplies TypeORM's concrete,
  version-correct specifics on top of both.
expertise: TypeORM-focused Node.js/TypeScript backend engineer.
description: >-
  TypeORM's DataSource/EntityManager/Repository/QueryRunner architecture,
  Active Record vs Data Mapper choice, decorator-driven entities, per-driver
  isolation levels, and the live 0.3.x-vs-1.0 version split (Node>=20,
  mysql2-only, better-sqlite3 default, Mongo driver v7+). Use when the stack
  uses TypeORM specifically. Not for ORM/ODM selection or cross-ORM
  N+1/transaction method (orm-integration), and not for migration safety
  mechanics (data-migration).

activation_conditions:
  - The `typeorm` package, `@Entity`/`@Column` decorators, or a `DataSource` configuration file is present in the codebase
  - The task names TypeORM specifically, or asks about Active Record vs Data Mapper, EntityManager/Repository/QueryRunner, or its 0.3.x-to-1.0 version boundary
  - A TypeORM-specific driver, decorator, migration-CLI, or DataSource-configuration question is in play
non_activation_conditions:
  - The stack uses a different ORM/ODM (Mongoose, Prisma, Drizzle) or no ORM at all — route to that technology skill, or to orm-integration if no ORM is chosen yet
  - The question is ORM/ODM selection itself, or cross-ORM N+1/transaction method with no TypeORM-specific API involved — route to orm-integration (SK-DATA-002)
  - The task is migration safety mechanics (expand/contract sequencing, backfill batching) with no TypeORM-specific API/driver question — route to data-migration (SK-DATA-006)
activation_mode: auto

inputs:
  - name: task
    description: The TypeORM-specific task (entity/relation design, DataSource/transaction/isolation-level handling, migration-CLI mechanics, or a 0.3.x-to-1.0 upgrade assessment).
    required: true
  - name: version-line
    description: Which TypeORM line (0.3.x or 1.x) and Node.js major version the codebase is pinned to.
    required: false
required_context:
  - Which TypeORM version line (0.3.x or 1.x) the codebase is pinned to — Repository/QueryBuilder method names and driver requirements differ materially between the two live lines.
optional_context:
  - Whether Active Record or Data Mapper is already the codebase's convention.
  - The specific database driver and its version (mysql2, better-sqlite3, the MongoDB driver, mssql, etc.).

outputs:
  - name: entity-or-repository-code
    kind: edit
    description: Entity classes, decorators, and Repository/EntityManager/QueryBuilder usage correct for the pinned TypeORM version line.
  - name: datasource-or-migration-config
    kind: edit
    description: DataSource configuration or migration-CLI-compatible code, version-correct for the line in use.
  - name: version-line-analysis
    kind: analysis
    description: Assessment of whether/when to move from 0.3.x to 1.x, naming the concrete breaking changes and driver swaps that would apply.

