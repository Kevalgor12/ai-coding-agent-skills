covered_versions:
  typeorm-0.3x: "0.3.20-0.3.31+ (still actively backported in parallel with the 1.x line; no announced end-of-support date)"
  typeorm-1x: ">=1.0.0 (new major, released 2026-05-19; requires Node.js >=20, ES2023 minimum compile target)"
version_sensitive_claims:
  - claim: MySQL driver support is limited to `mysql2`; the legacy `mysql` package is dropped.
    applies_to: ">=1.0.0"
    source_ref: research/technologies/typeorm.md §13 (via typeorm.io/docs/releases/1.0/release-notes/)
  - claim: SQLite's default driver switches to `better-sqlite3`; `sqlite3` is no longer supported.
    applies_to: ">=1.0.0"
    source_ref: research/technologies/typeorm.md §13 (via typeorm.io/docs/releases/1.0/release-notes/)
  - claim: MongoDB driver v7+ is required; v5/v6 support is dropped.
    applies_to: ">=1.0.0"
    source_ref: research/technologies/typeorm.md §13 (via typeorm.io/docs/releases/1.0/release-notes/)
  - claim: Node.js >=20 is required (16/18 unsupported); ES2023 is the minimum compile target.
    applies_to: ">=1.0.0"
    source_ref: research/technologies/typeorm.md §13 (via typeorm.io/docs/releases/1.0/release-notes/)
  - claim: "`findOneById()`, `findByIds()`, and `exist()` are removed; use `findOneBy()`, `findBy()`+`In()`, and `exists()`."
    applies_to: ">=1.0.0"
    source_ref: research/technologies/typeorm.md §3, §13 (via typeorm.io/docs/releases/1.0/upgrading-from-0.3/)
  - claim: "`invalidWhereValuesBehavior` defaults to `throw`; `null`/`undefined` in a `where` condition now errors instead of being silently ignored."
    applies_to: ">=1.0.0"
    source_ref: research/technologies/typeorm.md §4, §13
  - claim: TypeScript >=4.5 with `experimentalDecorators`+`emitDecoratorMetadata` is the stated minimum, but the source itself flags this figure as potentially stale given the pace of 2026 changes around the v1.0 line.
    applies_to: "0.3.x and 1.x (currency unverified)"
    source_ref: research/technologies/typeorm.md §1; research/knowledge-maps/version-matrix.md (TypeORM row)
  - claim: The 0.3.x line continued receiving parallel backports (e.g. 0.3.31 on 2026-07-13) after 1.0.0 shipped, with no documented end-of-support date — both lines are simultaneously live.
    applies_to: "0.3.x, ongoing as of 2026-09-09"
    source_ref: research/technologies/typeorm.md §12
  - claim: NativeScript requires 4.x+; Webpack bundling is compulsory since the raw `typeorm/browser` package is unbundled ES7 that won't run without it.
    applies_to: "NativeScript integration, both lines"
    source_ref: research/technologies/typeorm.md §14
last_verified: "2026-09-09"
reverify_triggers:
  - A new TypeORM 1.x minor/major release (potential further breaking changes)
  - Any official statement of a 0.3.x end-of-support date
  - A change to the stated TypeScript minimum-version requirement on the official Getting Started page
  - A new officially assigned CVE against TypeORM, or a change to the security policy's stated scope

owned_knowledge:
  - TypeORM DataSource/EntityManager/Repository/QueryRunner architecture
  - TypeORM v1.0 breaking-change inventory (removed APIs, driver changes, behavioral defaults)
  - TypeORM per-driver isolation-level support matrix
  - TypeORM decorator API catalog and entity feature set (composite keys, generated/vector/spatial columns, inheritance)
decision_framework_present: true

failure_handling:
  - If the TypeORM version line (0.3.x vs 1.x) is unknown, ask or check package.json before giving Repository/QueryBuilder/driver guidance — the two lines have materially different API surfaces.
  - If shell is unavailable, produce advisory entity/DataSource/migration code and state that it was not run against a real DataSource.
escalation:
  - Recommending an upgrade from 0.3.x to 1.x is a codebase-wide breaking change (Node floor, driver swaps, removed APIs) — surface the concrete diff and get explicit confirmation before applying the codemod or hand-editing.
verification:
  - Any Repository/QueryBuilder API named (e.g. `findOneBy` vs. `findOneById`) matches the version line actually in use.
  - "The relation-loading strategy avoids N+1 without setting `eager: true` on both sides of the same relation."
  - "A DataSource config never leaves `synchronize: true` or `dropSchema: true` enabled for a production target."
  - A migration is actually run against the target database (npm run migration:run or equivalent) and the resulting schema change is observed, or at minimum the TypeScript compilation against the entity files completes without errors.
evaluation_criteria:
  - Given a codebase pinned to 0.3.x, does not apply v1.0-only API/driver requirements (or the reverse) without flagging the mismatch.
  - Correctly follows the existing codebase's Active Record or Data Mapper convention, or gives a reasoned recommendation when greenfield.
  - For a seeded transaction requiring a non-default isolation level, selects one the active driver actually supports (per the per-driver isolation matrix) rather than an unsupported level that would throw.
  - Flags the v1.0 security-hardening scope boundary (parameterization covers data values via documented APIs only, not identifier/SQL-expression-position input) rather than overclaiming blanket injection immunity.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  cursor:
    paths: ["**/*.entity.ts", "**/migrations/**", "**/data-source.ts", "**/ormconfig*"]
  vscode:
    argument_hint: "<task, e.g. 'model this relation' or 'assess moving to TypeORM 1.0'>"
