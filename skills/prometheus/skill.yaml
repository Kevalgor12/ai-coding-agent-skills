covered_versions:
  prometheus: ">=3.5 <=3.14 (LTS lines 3.5 and 3.13 currently supported)"
version_sensitive_claims:
  - claim: >-
      A Prometheus v3 TSDB can only be read by Prometheus v2.55 or newer;
      downgrading below v2.55 loses persistent TSDB data. Upgrade to 2.55
      first and confirm stability before jumping to v3.
    applies_to: "TSDB read-compatibility boundary at v2.55; relevant for any upgrade crossing the v2.x -> v3.0 boundary"
    source_ref: research/technologies/prometheus.md (Section 13, "TSDB on-disk format compatibility")
  - claim: >-
      PromQL's "." regex metacharacter began matching newlines (affecting
      any ".*"/".+" pattern in queries or relabel rules), and range-selector
      /lookback boundary semantics changed from closed-closed to open-closed.
    applies_to: ">=3.0.0 (breaking change from pre-3.0 PromQL semantics)"
    source_ref: research/technologies/prometheus.md (Sections 11 and 13)
  - claim: >-
      Prometheus's log output switched from go-kit/log to Go's standard
      log/slog, changing the on-disk/stdout log line format — breaking for
      anything parsing Prometheus's own log output.
    applies_to: ">=3.0.0"
    source_ref: research/technologies/prometheus.md (Section 13, "Log format change")
last_verified: "2026-09-10"
reverify_triggers:
  - A new Prometheus major release (4.0)
  - A new LTS line designated beyond 3.13 (next slated ~2027-06 per the release-cycle doc)
  - Any change to the OTLP receiver's documented stable/experimental status
  - Any change to native TLS/basic-auth's documented "experimental" status

owned_knowledge:
  - PromQL syntax and evaluation mechanics (selectors, modifiers, duration expressions, subqueries, staleness)
  - Prometheus's four metric types' precise semantics, including native vs. classic histograms and Summary's non-aggregatable client-side quantiles
  - Prometheus config-level cardinality guardrails (sample_limit/label_limit/label_value_length_limit/target_limit) and promtool cardinality analysis
  - Prometheus's local-storage/non-HA architecture stance and its federation/remote-write scaling paths
  - Alertmanager HA operational configuration (all instances configured directly in Prometheus, never a load balancer)
decision_framework_present: true

failure_handling:
  - If the Prometheus major/minor version in use is unknown, ask or explicitly state the version the guidance assumes — never assume "latest" silently — and flag the v2.55/v3.0 TSDB-read-compatibility boundary before recommending any upgrade.
  - If shell is unavailable, degrade to advisory config/PromQL/promtool output and state that promtool/reload/scrape was not actually executed.
  - If the request is actually generic signal-selection, cardinality-as-a-concept, or alert-design philosophy with no Prometheus specifics, defer to SK-QA-004 rather than restating it.
escalation:
  - A request to plan a v2.x -> v3.0 upgrade requires explicit confirmation of the current version before recommending the upgrade path, given the documented risk of irreversibly losing persistent TSDB data below v2.55.
verification:
  - Every PromQL/config/CLI/behavior claim carries a "[Source: <url>]" citation resolvable to source_references.
  - Every version-specific claim states the range it applies to, especially the TSDB v2.55 boundary and the v2->v3 regex/lookback semantic changes.
  - A proposed Alertmanager HA configuration lists every instance directly in Prometheus's alerting.alertmanagers block, never behind a load balancer.
  - A scrape config with realistic cardinality risk sets sample_limit/label_limit/label_value_length_limit/target_limit rather than relying on convention alone.
evaluation_criteria:
  - For a seeded metric-instrumentation task, chooses Counter vs. Gauge correctly per the value's semantics (monotonic-only vs. can-decrease) and recommends native histograms over classic histograms when the client library supports them.
  - For a seeded HA/scale question, correctly states that local storage is not clustered/replicated and recommends federation or remote-write to a long-term-storage backend rather than implying Prometheus alone scales horizontally.
  - For a seeded Alertmanager-HA configuration task, configures all instances directly in Prometheus rather than behind a load balancer.
  - For a seeded alerting/recording-rule authoring task, proposes promtool test rules coverage rather than declaring the rule correct without a test.
  - Does not restate the generic signal-selection/cardinality/alert-design synthesis already owned by SK-QA-004 (no-duplication).

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  vscode:
    argument_hint: "<task, e.g. 'write a scrape config with cardinality limits' or 'design an Alertmanager HA cluster'>"
