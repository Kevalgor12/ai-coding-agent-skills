id: SK-TECH-prometheus
slug: prometheus
name: Prometheus
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-QA-004]

purpose: >-
  Apply Prometheus correctly and version-appropriately — PromQL, the four
  metric types, scrape/cardinality configuration, and its single-node
  storage/HA architecture — specializing the observability parent skill
  with Prometheus-specific, cited implementation depth.
scope: >-
  Prometheus-specific implementation: PromQL mechanics (selectors,
  modifiers, subqueries, staleness), precise metric-type semantics
  (Counter/Gauge/Histogram/Summary, native vs. classic histograms),
  config-level cardinality guardrails, the not-clustered/not-natively-HA
  local-storage architecture and its federation/remote-write scaling
  paths, Alertmanager HA operational rules, native OTLP receiver and
  Grafana data-source integration, and promtool-based testing. The
  generic cross-technology method (signal selection, cardinality/PII
  discipline as a concept, alert-design philosophy) is owned by the
  parent skill (SK-QA-004) and is not repeated here.
expertise: Prometheus / metrics-observability engineer.
description: >-
  Prometheus-specific PromQL, scrape/relabel config, the four metric
  types (Counter/Gauge/Histogram/Summary, native vs. classic
  histograms), cardinality guardrails, non-HA storage architecture,
  Alertmanager HA, and promtool testing. Use when prometheus.yml, a
  Prometheus server, /metrics scraping, PromQL, or Alertmanager is in
  play. Not for OpenTelemetry instrumentation, Grafana dashboards, or
  generic signal-selection/alert-design method (SK-QA-004).

activation_conditions:
  - A prometheus.yml config, a running/deployed Prometheus server, or a scraped /metrics endpoint is present in the stack
  - The task names Prometheus, PromQL, Alertmanager, promtool, or a Prometheus client library
  - Instrumenting application code with Counter/Gauge/Histogram/Summary metrics intended for Prometheus scraping
non_activation_conditions:
  - The stack has no Prometheus component and none is requested (route to the generic observability skill or the relevant sibling tech skill)
  - The task is OpenTelemetry instrumentation/collector configuration with no Prometheus backend involved (route to SK-TECH-opentelemetry)
  - The task is Grafana dashboard/panel/alerting-UI authoring rather than the Prometheus server or PromQL itself (route to SK-TECH-grafana)
  - Generic signal-selection, cardinality-discipline-as-a-concept, or alert-design philosophy with no Prometheus specifics needed (route to SK-QA-004)
activation_mode: auto

inputs:
  - name: task
    description: The Prometheus-related task (scrape/relabel config, PromQL query, alerting/recording rule, client-library instrumentation, HA/federation design, version-upgrade planning).
    required: true
  - name: prometheus-version
    description: The Prometheus major/minor version in use (server --version, image tag, or config), especially relevant across the v2.55/v3.0 TSDB-format boundary.
    required: false
outputs:
  - name: prometheus-config-or-rules
    kind: edit
    description: prometheus.yml scrape/relabel/remote_write config, recording/alerting rule files, or promtool unit-test files.
  - name: promql-query
    kind: edit
    description: A PromQL instant/range query, subquery, or recording-rule expression.
  - name: analysis
    kind: analysis
    description: Version-correct recommendations (metric-type choice, cardinality guardrail, HA/federation stance, upgrade risk) with citations.

depends_on_skills: []
related_skills: [SK-TECH-opentelemetry, SK-TECH-grafana, SK-QA-003]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B

