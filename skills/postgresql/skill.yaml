id: SK-TECH-postgresql
slug: postgresql
name: PostgreSQL
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-DATA-001, SK-DATA-003, SK-DATA-005]   # data-modeling, database-operations (not yet authored), search-integration (not yet authored)

purpose: >-
  Apply PostgreSQL correctly and version-appropriately: indexing, MVCC/VACUUM,
  transaction isolation, row-level security, full-text search, replication,
  and the extension mechanism.
scope: >-
  PostgreSQL-specific engineering detail — the generic schema-design method
  comes from the parent skill (SK-DATA-001); query-tuning/operations depth and
  search-engine trade-offs are owned by SK-DATA-003 and SK-DATA-005
  respectively (both forward references — not yet authored in this library).
expertise: PostgreSQL database engineer.
description: >-
  PostgreSQL-specific indexing (B-tree/GIN/GiST/BRIN), MVCC/VACUUM, transaction
  isolation levels, row-level security, full-text search, replication, and
  version-gated v18 features (OAuth2 auth, async I/O, protocol 3.2). Use when
  the stack targets PostgreSQL (postgres:// URL, pg/psycopg/pgx driver, a
  Postgres-configured ORM, or the task names a PG feature). Not for MySQL or
  other engines, generic schema design, or ORM mapping mechanics.

activation_conditions:
  - A postgres:// / postgresql:// connection string or a PG driver (pg, psycopg, pgx, libpq) is present
  - An ORM/ODM is configured with a PostgreSQL provider/dialect
  - The task names PostgreSQL or a PG-specific feature (MVCC, RLS, VACUUM, EXPLAIN ANALYZE, tsvector, pg_upgrade, LISTEN/NOTIFY)
  - A slow query or index question against a known-PostgreSQL database
non_activation_conditions:
  - The stack uses MySQL, MongoDB, ClickHouse, or another engine (route to that engine's skill)
  - No engine has been chosen yet and the question is store-shape/schema design (route to SK-DATA-001)
  - The question is ORM-mechanics independent of the engine (route to SK-DATA-002)
  - The task is safely evolving an already-populated schema's migration process, not PostgreSQL feature usage (route to SK-DATA-006)
activation_mode: auto

inputs:
  - name: task
    description: The PostgreSQL task (schema/DDL change, slow query, transaction/isolation design, RLS policy, full-text search, replication/HA, upgrade).
    required: true
  - name: schema-and-workload
    description: Existing schema, query patterns, and (ideally) EXPLAIN (ANALYZE, BUFFERS) output.
    required: false
  - name: pg-version
    description: The PostgreSQL major version in use (server, container image tag, or manifest).
    required: false
required_context:
  - The PostgreSQL major version in use — needed for version-correct guidance (rule VA-3).
optional_context:
  - EXPLAIN (ANALYZE, BUFFERS) output for a slow query.
  - Existing index definitions and access patterns.
  - Whether the deployment is self-managed or a managed service (affects what's controllable, e.g. postgresql.conf access).

outputs:
  - name: schema-or-migration
    kind: edit
    description: DDL or migration reflecting version-correct PostgreSQL features, with a rollback path for destructive changes.
  - name: index-or-query-change
    kind: edit
    description: Index definitions or query rewrites addressing an observed EXPLAIN plan.
  - name: analysis
    kind: analysis
    description: Recommendations (index type, isolation level, RLS vs. app-level authz, in-DB FTS vs. dedicated search) with rationale and the PG version they apply to.
  - name: commands-run
    kind: command-run
    description: psql/EXPLAIN/pg_upgrade or other CLI invocations executed to diagnose or verify, when shell is available.

depends_on_skills: []
# Policy fix (2026-09-09, applied consistently with the solution-architecture
# fix from the DISC-domain batch): depends_on_skills is reserved for hard
# composition (invoking another skill as a blocking sub-step of this skill's
# own execution). The relationship to the generic parent skill(s) above is
# specialization, already fully captured by the `parents` field -- duplicating
# it into depends_on_skills was redundant and conflated the two relationship
# types. Cleared here; parents is the single source of truth for this edge.
related_skills: [SK-TECH-drizzle, SK-TECH-prisma, SK-TECH-typeorm, SK-DATA-002, SK-DATA-006]
conflicts_with: [SK-TECH-mysql]   # alternative primary relational engine; do not co-activate for the same engine decision

required_capabilities: [file-read, file-write, shell]
execution_tier: B
# Proposing DDL/index/query changes is advisory (file-only); running psql,
# EXPLAIN ANALYZE, or pg_upgrade needs shell. No capability_fallbacks block
# required (Tier B, not C) — degrades to advisory per failure_handling if
# shell is unavailable.

