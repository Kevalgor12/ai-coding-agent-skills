covered_versions:
  postgresql: ">=14 <=18"
version_sensitive_claims:
  - claim: Protocol version 3.2 (256-bit cancel-request keys) was introduced in PostgreSQL 18; protocol 3.0 (PG 7.4+) remains supported for backward compatibility.
    applies_to: "18 (3.2); >=7.4 (3.0, still supported)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/postgresql.md §3
  - claim: pg_upgrade supports upgrading from PostgreSQL 9.2+ to the current major, requires binary compatibility, and cannot upgrade clusters with certain OID-reference pseudo-type columns.
    applies_to: ">=9.2"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/postgresql.md §11
  - claim: "PG18 raised the minimum toolchain: Python >=3.6.8, OpenSSL >=1.1.1, LLVM >=14; HP-PA/PA-RISC support dropped."
    applies_to: ">=18"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/postgresql.md §13
  - claim: As of PG18, pg_upgrade carries forward optimizer statistics, reducing (but not eliminating) the need for a full post-upgrade ANALYZE.
    applies_to: ">=18"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/postgresql.md §11
  - claim: OAuth 2.0 (SASL OAUTHBEARER) as a pg_hba.conf authentication method, and the async I/O (AIO) subsystem with B-tree "skip scan", were introduced in PostgreSQL 18.
    applies_to: ">=18"
    source_ref: research/technologies/postgresql.md §7, §8
  - claim: md5 password authentication is deprecated with warnings on CREATE ROLE/ALTER ROLE (silenceable via md5_password_warnings=off); no removal version has been published yet.
    applies_to: ">=18"
    source_ref: "research/technologies/postgresql.md §6, §13 (Unresolved: removal version)"
  - claim: Support window is 5 years per major release post-GA, with minor releases at least every 3 months. As of 2026-09-09, PG14 is nearing EOL (2026-11-12), PG18 is the current stable baseline, and PG19 is in Beta 3 (not GA).
    applies_to: "as of research date 2026-09-09"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/postgresql.md §12
last_verified: "2026-09-09"
reverify_triggers:
  - A new PostgreSQL major release (currently PG19, in Beta 3 as of 2026-08-13) reaches GA
  - postgresql.org publishes a removal version for md5 password authentication
  - Any change to the documented pg_upgrade version-compatibility range or checksum/upgrade requirements
  - A new protocol version supersedes 3.2

owned_knowledge:
  - PostgreSQL MVCC/WAL/VACUUM mechanics and XID-wraparound avoidance
  - PostgreSQL index-type selection (B-tree/GIN/GiST/BRIN/Hash/SP-GiST)
  - PostgreSQL transaction isolation level selection (Read Committed/Repeatable Read/Serializable)
  - PostgreSQL row-level security (RLS) policy syntax and fail-closed semantics
  - PostgreSQL full-text search (tsvector/tsquery + GIN) usage
  - PostgreSQL replication topologies (physical/logical, sync/async trade-off) and pg_upgrade mechanics
  # Cross-cutting security/performance/testing depth is NOT owned here — referenced, not restated.

decision_framework_present: true

failure_handling:
  - If the PostgreSQL major version cannot be determined, ask for it or explicitly state the version the guidance assumes — never assume "latest" silently (rule VA-3).
  - If shell is unavailable or denied, degrade to advisory DDL/query/index output and state that the migration/EXPLAIN was not actually run.
  - If EXPLAIN output is unavailable for a "slow query" task, ask for it rather than guessing an index from the query text alone.
escalation:
  - A destructive migration (DROP, data-losing ALTER, or a pg_upgrade in link/swap mode that makes the old cluster unusable) requires explicit user confirmation before execution.
  - Restoring a pg_dump/pg_restore archive from an untrusted source is flagged and confirmed before running — dumps contain superuser code executed on restore.
verification:
  - The proposed index type matches the query's actual access pattern (equality/range → B-tree; contains/full-text/jsonb/array → GIN; geometric/nearest-neighbor → GiST; large naturally-ordered tables → BRIN), not chosen by default.
  - Every version-specific claim is tagged with the PostgreSQL range it holds for.
  - For a migration, a rollback path exists and destructive operations are flagged for confirmation.
  - RLS policies handling concurrent modification are checked for the documented subquery race-condition caveat.
evaluation_criteria:
  - For a seeded slow query with EXPLAIN (ANALYZE, BUFFERS) output, proposes an index or rewrite that addresses the actual plan, not a guess from the query text.
  - Chooses a defensible isolation level for a seeded transaction scenario (e.g. Serializable for a scenario needing serialization-anomaly prevention, not defaulted to Read Committed without justification).
  - Any claim about a version-gated PG18 feature (OAuth2 auth, async I/O, protocol 3.2, pg_upgrade statistics carry-forward) is correctly scoped to ">=18" and not presented as universally true.
  - Does not restate generic schema-design or ORM-mapping guidance owned by SK-DATA-001/SK-DATA-002 (rule QR-2).
  - Flags a destructive migration or untrusted pg_dump restore for confirmation rather than executing it silently.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]   # for running psql/EXPLAIN/pg_upgrade; abstract shell -> CC tools
  cursor:
    paths: ["**/*.sql", "**/migrations/**"]
  vscode:
    argument_hint: "<task, e.g. 'optimize this slow query' or 'add an RLS policy'>"
