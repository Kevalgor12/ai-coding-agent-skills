id: SK-TECH-websocket-api
slug: websocket-api
name: WebSocket API
spec_version: "1.0"
skill_version: "0.1.0"
kind: technology
layer: 4
domain: TECH
parents: [SK-BE-004]   # realtime-communication

purpose: >-
  Implement the WebSocket API correctly — RFC 6455 handshake mechanics, the
  Sec-WebSocket-* headers, subprotocol/extension negotiation, close codes,
  and the browser/Node.js API surface — as the technology-level
  specialization of realtime-communication's transport method.
scope: >-
  WebSocket-API-specific implementation depth: handshake mechanics, framing,
  Sec-WebSocket-* headers, close codes, the browser WebSocket/WebSocketStream
  interfaces, and Node.js's client-only support. Not transport selection
  (WebSocket vs. Socket.IO vs. WebRTC vs. SSE), not the generic
  connection-lifecycle/scaling/handshake-auth design, and not CORS/Origin
  threat modeling depth — all owned by the parent skill SK-BE-004
  (realtime-communication).
expertise: Web-platform/protocol engineer implementing RFC 6455 WebSocket connections.
description: >-
  WebSocket-API-specific implementation: opening handshake mechanics,
  Sec-WebSocket-* headers, subprotocol/extension negotiation, close codes,
  and the browser WebSocket/WebSocketStream vs. Node.js WebSocket client API
  surface. Use once WebSocket is the chosen transport (see
  realtime-communication for that choice) and implementation-level detail is
  needed. Not for choosing between WebSocket/Socket.IO/WebRTC, or generic
  connection/scaling/auth design.

activation_conditions:
  - WebSocket has already been selected as the realtime transport and implementation detail is needed (handshake, headers, close codes, subprotocols)
  - The task references the WebSocket() constructor, ws:// / wss:// URLs, Sec-WebSocket-* headers, or RFC 6455 directly
  - Implementing or debugging a raw WebSocket client (browser or Node.js) or a WebSocket server (e.g. via the `ws` npm package)
non_activation_conditions:
  - The transport choice itself is still open (WebSocket vs. Socket.IO vs. WebRTC vs. SSE) — route to SK-BE-004
  - Connection-lifecycle/reconnection, horizontal-scaling, or handshake-authentication design in the abstract — route to SK-BE-004
  - Socket.IO-specific API usage (rooms, namespaces, acknowledgements, the Socket.IO wire protocol) — route to SK-TECH-socketio
activation_mode: auto

inputs:
  - name: task
    description: The WebSocket implementation task (client connection, server handshake handling, close-code/error handling, subprotocol negotiation).
    required: true
  - name: runtime-target
    description: Whether the code runs in a browser, Node.js, or another server runtime — determines which API surface applies (browser WebSocket, Node's client-only global, or a server library such as `ws`).
    required: false
required_context:
  - Whether WebSocket has already been chosen as the transport (this skill assumes that decision was made; if not, defer to SK-BE-004)
optional_context:
  - The Node.js version in use, relevant to the client-global support cutover (v21.0.0 experimental → v22.4.0 stable)
  - Whether a server-side WebSocket implementation is needed, since Node.js provides none built-in

outputs:
  - name: client-or-server-code
    kind: edit
    description: WebSocket client/server connection code, handshake handling, close-code/error handling, or subprotocol negotiation logic.
  - name: analysis
    kind: analysis
    description: Version/compatibility notes relevant to the implementation (e.g. the Node.js client-only gap, the http(s)-URL normalization date).

depends_on_skills: []
related_skills: [SK-TECH-socketio]
conflicts_with: []

required_capabilities: [file-read, file-write, shell]
execution_tier: B

