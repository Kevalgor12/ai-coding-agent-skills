covered_versions:
  websocket-api: "RFC 6455 (STD 34, no version number); Node.js client-only support stable v22.4.0+, no built-in server"
version_sensitive_claims:
  - claim: Node.js ships a global browser-compatible WebSocket client but no built-in WebSocket server at all; a separate server implementation (e.g. the `ws` npm package) is required.
    applies_to: "All Node.js versions (client global specifically: introduced v21.0.0 / backported to v20.10.0 behind --experimental-websocket; flag removed v22.0.0; stable as of v22.4.0)"
    source_ref: research/knowledge-maps/version-matrix.md (WebSocket API section); research/technologies/websocket-api.md §12, §16
  - claim: The WebSocket() constructor accepts http/https URLs and auto-normalizes them to ws/wss.
    applies_to: "Browser/runtime engines implementing the change dated May 2023; older engines may only accept ws/wss literally"
    source_ref: research/knowledge-maps/version-matrix.md (WebSocket API section); research/technologies/websocket-api.md §3, §13
  - claim: WebSocketStream provides backpressure but is experimental/non-standard, not broadly available.
    applies_to: "Implemented in one rendering engine only as of research date (2026-09-09/10)"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/websocket-api.md §3, §12
  - claim: Baseline WebSocket interface support is "Widely available."
    applies_to: "Across major browsers, dating to July 2015"
    source_ref: research/knowledge-maps/version-matrix.md; research/technologies/websocket-api.md §12
last_verified: "2026-09-10"
reverify_triggers:
  - The WHATWG WebSockets Living Standard's next substantive revision
  - A new RFC superseding or amending RFC 6455
  - WebSocketStream reaching broader, cross-engine implementation status
  - Node.js shipping a built-in WebSocket server

owned_knowledge:
  - RFC 6455 handshake mechanics (Sec-WebSocket-* headers, Sec-WebSocket-Accept computation)
  - WebSocket close-code registry and CloseEvent semantics
  - Browser WebSocket/WebSocketStream and Node.js WebSocket client API surface
  - Subprotocol/extension negotiation mechanics (Sec-WebSocket-Protocol / Sec-WebSocket-Extensions)
decision_framework_present: true

failure_handling:
  - If the transport choice (WebSocket vs. Socket.IO vs. WebRTC) is still open, defer to SK-BE-004 rather than assuming WebSocket.
  - If the runtime target (browser vs. Node.js vs. other server runtime) is unknown, ask, since the available API surface differs (Node ships no built-in server).
  - If shell is unavailable/denied, output advisory client/server code and state that it was not run or tested.
escalation:
  - A server accepting non-browser clients with no connection-level authentication beyond Origin checking is escalated to SK-BE-004's handshake-auth guidance, not re-decided here.
verification:
  - Handshake code validates Sec-WebSocket-Version and required headers, returning 400 on malformed/unsupported requests.
  - Server-side code enforces the client-must-mask / server-must-not-mask rule and disconnects clients sending unmasked frames.
  - Close-code handling distinguishes codes never actually sent on the wire (1005, 1006, 1015) from real remote-sent codes.
  - Every version-specific claim (Node client-only gap, http(s) normalization date, WebSocketStream status) is tagged with its applicable range.
evaluation_criteria:
  - For a seeded "implement a WebSocket client/server" task, produces handshake-correct code (proper headers, Sec-WebSocket-Accept, masking rule) grounded in RFC 6455.
  - Correctly states that Node.js has no built-in WebSocket server when the task involves a Node.js server.
  - Does not restate SK-BE-004's transport-comparison table or its connection-lifecycle/scaling/auth framework (no-duplication rule QR-2).
  - Surfaces the no-backpressure/bufferedAmount limitation and the lack of an official testing story when relevant to the task.

adapter_hints:
  claude-code:
    allowed_tools: [Bash, Read, Edit]
  vscode:
    argument_hint: "<task, e.g. 'implement WebSocket close-code handling' or 'add subprotocol negotiation'>"
